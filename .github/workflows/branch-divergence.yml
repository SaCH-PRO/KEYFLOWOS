name: Branch divergence

# Guardrail against the kind of develop-vs-main split documented in
# `BRANCH_CLEANUP_REPORT.md` (60/31 commits, 247 files diverged before
# Task #240). Wraps `scripts/check-branch-divergence.sh` so any
# non-`main` long-lived branch is automatically compared to `main` and
# the build fails if it has drifted past the configured thresholds.
#
# Triggers:
#   - pull_request targeting `main`             (compares PR head <-> main)
#   - push to a known long-lived branch         (compares branch <-> main)
#   - workflow_dispatch                         (manual, fully overridable)
#
# Thresholds default to the values called out in
# `docs/branch-hygiene-policy.md` Rule 5 (25 commits / 50 files / 0 lines).
# To request a temporary bump for a specific run, use the
# `workflow_dispatch` inputs below — do NOT raise the defaults in this
# file without updating the policy doc in the same PR.
#
# Re-run locally:
#   scripts/check-branch-divergence.sh main <branch> \
#     --max-commits 25 --max-files 50 --fetch

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - develop
      - staging
      - next
      - 'release/**'
      - 'long-lived/**'
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref to compare against (default: main)"
        required: false
        default: main
      head_ref:
        description: "Head ref to compare (default: current branch)"
        required: false
        default: ""
      max_commits:
        description: "Fail if either side has more unique commits than this"
        required: false
        default: "25"
      max_files:
        description: "Fail if the diff touches more files than this"
        required: false
        default: "50"
      max_lines:
        description: "Fail if combined +/- lines exceed this (0 = disabled)"
        required: false
        default: "0"

concurrency:
  group: branch-divergence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Check divergence vs main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Defaults aligned with docs/branch-hygiene-policy.md Rule 5.
      DEFAULT_MAX_COMMITS: "25"
      DEFAULT_MAX_FILES: "50"
      DEFAULT_MAX_LINES: "0"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For PRs we want the merge base, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Resolve refs and thresholds
        id: resolve
        run: |
          set -euo pipefail

          EVENT="${{ github.event_name }}"
          BASE=""
          HEAD=""

          case "$EVENT" in
            pull_request)
              BASE="origin/${{ github.event.pull_request.base.ref }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE="origin/main"
              HEAD="${{ github.sha }}"
              ;;
            workflow_dispatch)
              BASE="${{ github.event.inputs.base_ref }}"
              BASE="${BASE:-main}"
              # Prefer an explicit ref; otherwise fall back to whatever
              # the workflow was dispatched against.
              HEAD="${{ github.event.inputs.head_ref }}"
              HEAD="${HEAD:-${{ github.ref_name }}}"
              # Normalise unqualified refs to their origin counterpart so
              # the script can resolve them after a shallow checkout +
              # full fetch.
              if [[ "$BASE" != *"/"* ]] && [[ "$BASE" != "HEAD" ]]; then
                BASE="origin/$BASE"
              fi
              ;;
            *)
              echo "::error::Unsupported event '$EVENT'"
              exit 1
              ;;
          esac

          # Skip the check entirely when we're already on main — there's
          # nothing meaningful to compare against itself.
          SKIP=0
          if [[ "$EVENT" == "push" ]] && [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            SKIP=1
          fi

          MAX_COMMITS="${{ github.event.inputs.max_commits }}"
          MAX_FILES="${{ github.event.inputs.max_files }}"
          MAX_LINES="${{ github.event.inputs.max_lines }}"
          MAX_COMMITS="${MAX_COMMITS:-$DEFAULT_MAX_COMMITS}"
          MAX_FILES="${MAX_FILES:-$DEFAULT_MAX_FILES}"
          MAX_LINES="${MAX_LINES:-$DEFAULT_MAX_LINES}"

          {
            echo "base=$BASE"
            echo "head=$HEAD"
            echo "max_commits=$MAX_COMMITS"
            echo "max_files=$MAX_FILES"
            echo "max_lines=$MAX_LINES"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"

          echo "Event:        $EVENT"
          echo "Base ref:     $BASE"
          echo "Head ref:     $HEAD"
          echo "Thresholds:   commits=$MAX_COMMITS files=$MAX_FILES lines=$MAX_LINES"
          echo "Skip:         $SKIP"

      - name: Fetch base ref
        if: steps.resolve.outputs.skip != '1'
        run: |
          set -euo pipefail
          BASE="${{ steps.resolve.outputs.base }}"
          # `actions/checkout@v4` with fetch-depth: 0 already fetches all
          # branches, but be explicit so the script works even if a
          # future change tightens the fetch.
          if [[ "$BASE" == origin/* ]]; then
            git fetch --no-tags --quiet origin "${BASE#origin/}:refs/remotes/$BASE" || \
              git fetch --no-tags --quiet origin "${BASE#origin/}" || true
          fi
          git rev-parse --verify "$BASE" >/dev/null

      - name: Run divergence check
        if: steps.resolve.outputs.skip != '1'
        id: check
        run: |
          set -euo pipefail
          chmod +x scripts/check-branch-divergence.sh
          scripts/check-branch-divergence.sh \
            "${{ steps.resolve.outputs.base }}" \
            "${{ steps.resolve.outputs.head }}" \
            --max-commits "${{ steps.resolve.outputs.max_commits }}" \
            --max-files   "${{ steps.resolve.outputs.max_files }}" \
            --max-lines   "${{ steps.resolve.outputs.max_lines }}" \
          | tee divergence-report.txt

      - name: Skipped (push to main)
        if: steps.resolve.outputs.skip == '1'
        run: echo "Push to main — nothing to compare. Skipping divergence check."

      - name: Upload divergence report
        if: always() && steps.resolve.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: divergence-report
          path: divergence-report.txt
          if-no-files-found: ignore

      - name: Explain failure
        if: failure() && steps.check.conclusion == 'failure'
        run: |
          cat <<'EOF'
          ::error::Branch divergence threshold exceeded.

          This branch has drifted from `main` past the limits defined in
          docs/branch-hygiene-policy.md (Rule 5).

          What to do:
            1. Rebase or merge `main` into this branch and push again, OR
            2. Split the branch into smaller PRs targeting `main`, OR
            3. If the spike is intentional and time-boxed, request a
               temporary threshold bump by re-running this workflow via
               "Run workflow" with higher max_commits / max_files inputs
               and link to the run in your PR description. Update the
               policy doc in the same PR if the bump should become the
               new default.

          Re-run locally:
            scripts/check-branch-divergence.sh main HEAD \
              --max-commits 25 --max-files 50 --fetch
          EOF
          exit 1
