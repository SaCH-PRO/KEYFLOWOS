name: Branch divergence

# Enforces Rule 5 of docs/branch-hygiene-policy.md: no branch is allowed to
# silently drift from `main` past the configured thresholds (default
# 25 commits / 50 files / 0 lines, matching the policy doc). This wraps
# `scripts/check-branch-divergence.sh`, which exits non-zero with a JSON
# summary when a threshold is exceeded.
#
# Triggers:
#   - pull_request targeting `main` -> compares PR head <-> PR base. This
#     is the gate that branch protection should mark as a required check.
#   - push to any branch except `main` -> immediate per-push status check
#     for direct pushes (covers long-lived branches like develop/staging
#     plus any in-flight feature branch).
#   - schedule (daily 06:00 UTC)    -> sweeps every branch on origin so
#                                       stale, no-recent-push branches
#                                       still surface (the original
#                                       develop-vs-main failure mode).
#   - workflow_dispatch             -> manual run with overridable
#                                       thresholds (large-refactor escape
#                                       hatch).
#
# Per-branch overrides live in `.github/branch-divergence-overrides.yml`.
# See that file for the format. To request a temporary bump for a single
# run, use the `workflow_dispatch` inputs below — do NOT raise the
# defaults in this file without updating the policy doc in the same PR.
#
# Re-run locally:
#   scripts/check-branch-divergence.sh main HEAD \
#     --max-commits 25 --max-files 50 --fetch

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to check (defaults to all non-main remote branches)"
        required: false
        default: ""
      max_commits:
        description: "Override max unique commits per side (default 25)"
        required: false
        default: "25"
      max_files:
        description: "Override max files changed (default 50)"
        required: false
        default: "50"
      max_lines:
        description: "Override max diff lines (0 disables, default 0)"
        required: false
        default: "0"

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: branch-divergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Self-test job: exercises the threshold resolver against fixture data so
  # parser regressions in scripts/ci/resolve-divergence-thresholds.sh are
  # caught before they silently change which branches get gated. Runs on
  # every trigger so it acts as a smoke test for the workflow itself.
  # ---------------------------------------------------------------------------
  resolver-tests:
    name: Threshold resolver tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Run resolver test fixture
        run: bash scripts/ci/test-resolve-divergence-thresholds.sh

  # ---------------------------------------------------------------------------
  # PR job: runs on every PR targeting `main`. Compares the PR head against
  # the PR base. This is the job that branch protection should mark as a
  # required check so a drifting branch cannot merge.
  # ---------------------------------------------------------------------------
  check-pr:
    if: github.event_name == 'pull_request'
    name: Check divergence vs main (PR)
    needs: resolver-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history of PR head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch PR base ref
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF:refs/remotes/origin/$BASE_REF" || \
            git fetch --no-tags --quiet origin "$BASE_REF"
          git rev-parse --verify "origin/$BASE_REF" >/dev/null

      - name: Resolve thresholds for ${{ github.head_ref }}
        id: thresholds
        env:
          BRANCH: ${{ github.head_ref }}
          DEFAULT_MAX_COMMITS: "25"
          DEFAULT_MAX_FILES: "50"
          DEFAULT_MAX_LINES: "0"
        run: bash scripts/ci/resolve-divergence-thresholds.sh

      - name: Run divergence check
        id: check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_COMMITS: ${{ steps.thresholds.outputs.max_commits }}
          MAX_FILES: ${{ steps.thresholds.outputs.max_files }}
          MAX_LINES: ${{ steps.thresholds.outputs.max_lines }}
        run: |
          set +e
          OUTPUT=$(scripts/check-branch-divergence.sh \
            "origin/$BASE_REF" "$HEAD_SHA" \
            --max-commits "$MAX_COMMITS" \
            --max-files "$MAX_FILES" \
            --max-lines "$MAX_LINES" \
            --json)
          STATUS=$?
          set -e
          echo "$OUTPUT" > divergence.json
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # Human-readable report, also archived as an artifact for reviewers.
          scripts/check-branch-divergence.sh \
            "origin/$BASE_REF" "$HEAD_SHA" \
            --max-commits "$MAX_COMMITS" \
            --max-files "$MAX_FILES" \
            --max-lines "$MAX_LINES" \
            | tee divergence-report.txt || true

          exit "$STATUS"
        continue-on-error: true

      - name: Render check summary
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
          BRANCH: ${{ github.head_ref }}
          MAX_COMMITS: ${{ steps.thresholds.outputs.max_commits }}
          MAX_FILES: ${{ steps.thresholds.outputs.max_files }}
          MAX_LINES: ${{ steps.thresholds.outputs.max_lines }}
          OVERRIDE_REASON: ${{ steps.thresholds.outputs.reason }}
        run: bash scripts/ci/render-divergence-summary.sh

      - name: Upload divergence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: divergence-report-pr
          path: divergence-report.txt
          if-no-files-found: ignore

      - name: Fail when thresholds exceeded
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error title=Branch divergence threshold exceeded::PR head '${{ github.head_ref }}' has drifted past the configured thresholds vs '${{ github.event.pull_request.base.ref }}'. See https://github.com/${{ github.repository }}/blob/main/docs/branch-hygiene-policy.md#rule-5--detect-divergence-early for guidance, or add an override in .github/branch-divergence-overrides.yml."
          exit 1

  # ---------------------------------------------------------------------------
  # Per-push job: runs on every push to a non-main branch. Single check,
  # using the override file when there is a match, otherwise the workflow
  # defaults (25 / 50 / 0 — matches Rule 5).
  # ---------------------------------------------------------------------------
  check-push:
    if: github.event_name == 'push'
    name: Check branch vs origin/main
    needs: resolver-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch --no-tags --quiet origin main:refs/remotes/origin/main

      - name: Resolve thresholds for ${{ github.ref_name }}
        id: thresholds
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_MAX_COMMITS: "25"
          DEFAULT_MAX_FILES: "50"
          DEFAULT_MAX_LINES: "0"
        run: bash scripts/ci/resolve-divergence-thresholds.sh

      - name: Run divergence check
        id: check
        env:
          MAX_COMMITS: ${{ steps.thresholds.outputs.max_commits }}
          MAX_FILES: ${{ steps.thresholds.outputs.max_files }}
          MAX_LINES: ${{ steps.thresholds.outputs.max_lines }}
        run: |
          set +e
          OUTPUT=$(scripts/check-branch-divergence.sh \
            origin/main HEAD \
            --max-commits "$MAX_COMMITS" \
            --max-files "$MAX_FILES" \
            --max-lines "$MAX_LINES" \
            --json)
          STATUS=$?
          set -e
          echo "$OUTPUT" > divergence.json
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # Human-readable summary alongside the JSON, also archived.
          scripts/check-branch-divergence.sh \
            origin/main HEAD \
            --max-commits "$MAX_COMMITS" \
            --max-files "$MAX_FILES" \
            --max-lines "$MAX_LINES" \
            | tee divergence-report.txt || true

          exit "$STATUS"
        continue-on-error: true

      - name: Render check summary
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
          BRANCH: ${{ github.ref_name }}
          MAX_COMMITS: ${{ steps.thresholds.outputs.max_commits }}
          MAX_FILES: ${{ steps.thresholds.outputs.max_files }}
          MAX_LINES: ${{ steps.thresholds.outputs.max_lines }}
          OVERRIDE_REASON: ${{ steps.thresholds.outputs.reason }}
        run: bash scripts/ci/render-divergence-summary.sh

      - name: Upload divergence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: divergence-report-push
          path: divergence-report.txt
          if-no-files-found: ignore

      - name: Fail when thresholds exceeded
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error title=Branch divergence threshold exceeded::Branch '${{ github.ref_name }}' has drifted past the configured thresholds. See https://github.com/${{ github.repository }}/blob/main/docs/branch-hygiene-policy.md#rule-5--detect-divergence-early for guidance, or add an override in .github/branch-divergence-overrides.yml."
          exit 1

  # ---------------------------------------------------------------------------
  # Manual job: runs only on workflow_dispatch. Lets a maintainer pass an
  # explicit branch + thresholds (escape hatch for large refactors).
  # ---------------------------------------------------------------------------
  check-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Check ${{ inputs.branch || 'all branches' }} (manual)
    needs: resolver-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin
        run: git fetch --no-tags --quiet origin

      - name: Run divergence check(s)
        env:
          BRANCH: ${{ inputs.branch }}
          MAX_COMMITS: ${{ inputs.max_commits }}
          MAX_FILES: ${{ inputs.max_files }}
          MAX_LINES: ${{ inputs.max_lines }}
        run: bash scripts/ci/sweep-divergence.sh

  # ---------------------------------------------------------------------------
  # Scheduled job: nightly sweep of every non-main branch on origin. Surfaces
  # branches that stopped getting pushes but kept drifting (the original
  # develop-vs-main failure mode).
  # ---------------------------------------------------------------------------
  check-scheduled:
    if: github.event_name == 'schedule'
    name: Nightly sweep of all branches
    needs: resolver-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin
        run: git fetch --no-tags --quiet origin

      - name: Sweep all non-main branches
        env:
          BRANCH: ""
          MAX_COMMITS: "25"
          MAX_FILES: "50"
          MAX_LINES: "0"
        run: bash scripts/ci/sweep-divergence.sh
