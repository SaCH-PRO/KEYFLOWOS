name: KEYFLOWOS Agent Autopilot

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows:
      - "CI/CD Pipeline"
      - "Agent Control Gate"
      - "Branch divergence"
      - "DAST (HawkScan)"
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional implementation PR to reconcile/merge if fully admitted"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: keyflow-agent-autopilot-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  normalize-event:
    if: github.event_name != 'issue_comment' || github.event.issue.number == 80
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify event normalizer
        run: node --test scripts/agent-control/normalize-event.spec.mjs

      - name: Normalize event
        id: event
        shell: bash
        run: |
          set -euo pipefail
          json="$(node scripts/agent-control/normalize-event.mjs)"
          echo "json=$json" >> "$GITHUB_OUTPUT"
          echo "$json"

      - name: Publish actionable wake event
        if: fromJSON(steps.event.outputs.json).actionable == true
        uses: actions/github-script@v7
        env:
          EVENT_JSON: ${{ steps.event.outputs.json }}
        with:
          script: |
            const event = JSON.parse(process.env.EVENT_JSON);
            const marker = '<!-- keyflow-autopilot-event:' + context.runId + ' -->';
            const body = [
              marker,
              '```yaml',
              'message_id: AUTO-EVENT-' + context.runId,
              'message_type: AUTO_EVENT',
              'sender: github-autopilot',
              'kind: ' + event.kind,
              'packet_id: ' + (event.packet_id || 'null'),
              'pr_number: ' + (event.pr_number || 'null'),
              'workflow: ' + (event.workflow || 'null'),
              'conclusion: ' + (event.conclusion || 'null'),
              'head_sha: ' + (event.head_sha || 'null'),
              'source_ref: ' + (event.ref || 'null'),
              'next_action: command_center_reconcile',
              '```',
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 80, body });

  exact-head-auto-merge:
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve PR number
        id: pr
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          MANUAL_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then pr="$WORKFLOW_PR"; else pr="$MANUAL_PR"; fi
          if [ -z "$pr" ]; then echo "number=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Merge only an exactly admitted head
        if: steps.pr.outputs.number != ''
        id: merge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          json="$(node scripts/agent-control/auto-merge-admitted.mjs --merge)"
          echo "$json"
          {
            echo "json<<EOF"
            echo "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record automatic merge
        if: steps.pr.outputs.number != '' && fromJSON(steps.merge.outputs.json).eligible == true && fromJSON(steps.merge.outputs.json).merge.merged == true
        uses: actions/github-script@v7
        env:
          MERGE_JSON: ${{ steps.merge.outputs.json }}
        with:
          script: |
            const result = JSON.parse(process.env.MERGE_JSON);
            const body = [
              '<!-- keyflow-autopilot-merge:' + context.runId + ' -->',
              '```yaml',
              'message_id: AUTO-MERGE-' + context.runId,
              'message_type: AUTO_MERGE',
              'sender: github-autopilot',
              'pr_number: ' + result.pr,
              'admitted_head: ' + result.head_sha,
              'merged: true',
              'merge_sha: ' + result.merge.sha,
              'next_action: post_merge_verify_and_checkpoint',
              '```',
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 80, body });

  hourly-reconcile-open-prs:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconcile every open implementation PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("impl/")) | .number')
          for pr in "${prs[@]}"; do
            echo "Reconciling PR #$pr"
            PR_NUMBER="$pr" node scripts/agent-control/auto-merge-admitted.mjs --merge || true
          done
