name: E2E Live (Release 0 journey)

# R0-25-PLAYWRIGHT-R0. The Release 0 journey (issue #186) in a real browser
# against a real API, Postgres and Redis on this runner: apps/web/e2e/
# release0-live.spec.ts. Nothing is mocked, and the spec fails on any request
# that leaves localhost and on any 5xx.
#
# MANUAL ONLY (workflow_dispatch). It builds and boots the whole stack, so it is
# not a per-push gate; the mocked Playwright job in ci-cd.yml is.
#
# Sign-in (owner ruling D-02, option C, hosted Supabase): this runner has no
# Supabase project and must not call one, so the sign-up submit is not driven
# here; it belongs to the operator-authorized staging run (#186 step B). The
# spec starts each owner from an HS256 token signed with a secret generated
# for this run and handed to the API as SUPABASE_JWT_SECRET (verified locally
# under NODE_ENV=test), and records that substitution in its output.
#
# The API runs with NODE_ENV=test, AI_DISABLED=1, HIBP_DISABLED=true, no
# schedulers and no provider key of any kind: every optional service stays off.
# The trace of the run is uploaded whether it passes or fails.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Must match the exact versions in the root package.json `engines` field (see ci-cd.yml).
env:
  NODE_VERSION: '20.18.1'
  PNPM_VERSION: '9.15.0'

jobs:
  release0-live:
    name: Release 0 live journey (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: keyflow
          POSTGRES_PASSWORD: keyflow
          POSTGRES_DB: keyflowos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://keyflow:keyflow@localhost:5432/keyflowos
      DIRECT_URL: postgresql://keyflow:keyflow@localhost:5432/keyflowos
      REDIS_URL: redis://localhost:6379
      API_PORT: '3001'
      E2E_API_URL: http://localhost:3001
      E2E_PORT: '5000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace packages
        run: pnpm --filter @keyflow/shared --filter @keyflow/db --filter @keyflow/api build

      # Same admission as the server tests in ci-cd.yml: exact CI identity and
      # local-only Postgres/Redis, before the first write.
      - name: Admit test resources
        run: node scripts/proof-admission/admit-resources.mjs --manifest scripts/proof-admission/manifests/ci-resources.json

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Build server
        run: cd apps/server && pnpm run build

      # A per-run HS256 secret: the API verifies the spec's tokens with it, and
      # it exists nowhere else.
      - name: Generate the run's token secret
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "E2E_JWT_SECRET=$secret" >> "$GITHUB_ENV"

      # An allow-listed environment, not a copy of the runner's: no provider key
      # can reach the API.
      - name: Start the API (no provider keys, optional services off)
        run: |
          cd apps/server
          env -i PATH="$PATH" HOME="$HOME" \
            DATABASE_URL="$DATABASE_URL" DIRECT_URL="$DIRECT_URL" REDIS_URL="$REDIS_URL" \
            NODE_ENV=test PORT="$API_PORT" AI_DISABLED=1 DISABLE_SCHEDULERS=1 HIBP_DISABLED=true \
            SUPABASE_JWT_SECRET="$E2E_JWT_SECRET" RATE_LIMIT_MAX_REQUESTS=100000 \
            nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS "$E2E_API_URL/healthz" > /dev/null; then echo "API ready"; exit 0; fi
            sleep 2
          done
          echo "API did not become ready"; tail -80 "$RUNNER_TEMP/api.log"; exit 1

      # NEXT_PUBLIC_* are inlined at build time: the browser bundle calls the
      # local API and has no Supabase URL or key to call.
      - name: Build web against the local API
        run: cd apps/web && pnpm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          NEXT_PUBLIC_SITE_URL: ''

      - name: Install Playwright Chromium
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Run the Release 0 live journey
        run: cd apps/web && pnpm exec playwright test e2e/release0-live.spec.ts
        env:
          E2E_LIVE: '1'
          E2E_WEB_COMMAND: pnpm exec next start -H 127.0.0.1 -p 5000
          E2E_BASE_URL: http://127.0.0.1:5000

      - name: Upload trace and API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release0-live-trace
          path: |
            apps/web/test-results/
            ${{ runner.temp }}/api.log
          retention-days: 14
          if-no-files-found: warn
