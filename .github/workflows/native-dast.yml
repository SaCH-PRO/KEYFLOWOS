name: DAST (Native)

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: native-dast-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.1'
  PNPM_VERSION: '9.15.0'

jobs:
  native-dast:
    name: Native dynamic security proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: keyflow
          POSTGRES_DB: keyflowos
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://keyflow@localhost:5432/keyflowos
      DIRECT_URL: postgresql://keyflow@localhost:5432/keyflowos
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      NATIVE_DAST_BASE_URL: http://127.0.0.1:3001

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @keyflow/db db:generate

      - name: Build workspace packages and server
        run: |
          pnpm turbo run build --filter=@keyflow/db --filter=@keyflow/shared --filter=@keyflow/api
          cd apps/server && pnpm run build

      - name: Apply migrations
        run: pnpm --filter @keyflow/db exec prisma migrate deploy

      - name: Start API
        env:
          PORT: '3001'
        run: |
          export JWT_SECRET="$(openssl rand -hex 24)"
          export BYOK_ENCRYPTION_SECRET="$(openssl rand -hex 24)"
          export CREDENTIALS_ENCRYPTION_KEY="$(openssl rand -hex 24)"
          node apps/server/dist/main.js > native-dast-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$NATIVE_DAST_BASE_URL/healthz" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat native-dast-server.log || true
          echo "::error::API did not become healthy for native DAST"
          exit 1

      - name: Unit proof for native DAST evaluator
        run: node --test scripts/security/tests/native-dast.spec.mjs

      - name: Run native dynamic security proof
        run: node scripts/security/native-dast.mjs scripts/security/native-dast-manifest.json

      - name: Stop API
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" || true; fi
