name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem and proposed solution clearly.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Opportunity
      description: What problem are you trying to solve? Who is affected?
      placeholder: "As a [user type], I want [goal] so that [benefit]."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches? Why is this one best?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, docs, related issues, or screenshots.
