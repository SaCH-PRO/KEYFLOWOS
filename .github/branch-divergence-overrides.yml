# Per-branch overrides for the "Branch divergence" CI guardrail.
#
# Used by .github/workflows/branch-divergence.yml when invoking
# scripts/check-branch-divergence.sh against `origin/main`.
#
# Default thresholds (when no override matches) come from the workflow
# inputs / Rule 5 of docs/branch-hygiene-policy.md:
#   max_commits: 25   max_files: 50   max_lines: 0 (disabled)
# These mirror DEFAULT_MAX_COMMITS / DEFAULT_MAX_FILES / DEFAULT_MAX_LINES in
# .github/workflows/branch-divergence.yml — keep the two in sync.
#
# When to add an override:
#   - Legitimate large refactor that will be merged or archived by a known
#     date (set `expires` so the override self-removes from review).
#   - Long-running spike branch where the team has explicitly accepted the
#     drift risk in writing (link the discussion in `reason`).
#
# Format:
#   overrides:
#     - branch: <exact branch name OR glob, e.g. "refactor/*">
#       max_commits: <int, optional — defaults to workflow default>
#       max_files:   <int, optional — defaults to workflow default>
#       max_lines:   <int, optional — 0 disables the line check>
#       reason:      <human-readable justification>
#       owner:       <github handle accountable for the branch>
#       expires:     <YYYY-MM-DD; the workflow warns once this date passes>
#
# Examples (commented out — uncomment + edit as needed):
#
# overrides:
#   - branch: refactor/storage-layer
#     max_commits: 250
#     max_files: 500
#     reason: "Storage layer rewrite; merging in one shot per Rule 2."
#     owner: SaCH-PRO
#     expires: 2026-06-15
#
#   - branch: spike/*
#     max_commits: 100
#     reason: "Throwaway spike branches; not merged, archived after review."
#     owner: SaCH-PRO
#     expires: 2026-12-31

overrides:
  - branch: chore/repo-vscode-setup
    max_files: 100
    reason: "Tenant-isolation hardening + connector certification (PR #46). 21 commits is within the commit threshold; only the file count (75 > 50) trips Rule 5, because the secret-redaction and silent-success sync() fixes are each small edits spread across many connector implementations. Merges to main in one shot per Rule 2. NOTE: the guardrail correctly flagged that this branch bundles two workstreams under a chore/ name — future security work should land as its own scoped branch."
    owner: SaCH-PRO
    expires: 2026-08-31

  - branch: archive/develop-2026-06-13
    max_commits: 10000
    max_files: 10000
    max_lines: 500000
    reason: "Retired develop branch preserved as an archive for historical Waves A-G gap-closure work. Intentionally divergent; does not merge into main."
    owner: SaCH-PRO
    expires: 2026-12-31
