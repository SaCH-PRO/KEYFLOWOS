    A failed authority check leaves zero parsed commands executable. The
    focused informational fixture can still complete a conversation, but
    request-wide absence of all effects is not established. Degradation is
    visible in step evidence and the error log, not a dedicated user notice.
  - >
    The detectActions fallback above still runs after a fail-closed batch, so
    this packet does not make the whole request effect-free.

