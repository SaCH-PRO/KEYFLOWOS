summary: >
  One entry added to COPILOT_NOT_RUN_REASONS in lib/semantic-review.mjs so
  that the wording GitHub's Copilot bot has used since 2026-10-24 when it
  cannot review for quota, "insufficient remaining quota", derives the
  existing machine reason quota_exhausted, as "reached their quota limit"
  already did. Four tests and one negative control prove the entry and its
  boundaries. Nothing else in the evidence contract changes. Artifact head
  f2a7db95 added the admission-record preparation that 6399663147
  authorized: the top-level semantic_review block transcribing that reading
  of S and the live primary-reviewer NOT_RUN citation. This head records the
  separate exact-head admission decision 6400449273, which accepted that
  record for admission: review_status is ACCEPT_FOR_ADMISSION, acceptance of
  the record and not READY_TO_MERGE, not PACKET_ADMISSION and not a grant.
  This pre-RETURN record claims no post-check result; exact_head_proof
  remains PENDING for this head. The PR is draft, merge_authority is false,
  and no merge grant, ready transition or credit is granted.

