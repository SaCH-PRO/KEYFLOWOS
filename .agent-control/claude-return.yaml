findings:
  - id: CV-F1
    status: FIXED_PENDING_REVIEW
    detail: the detail route and service applied the tenant predicate only; a member with CRM read could open another member's PRIVATE contact and its child rows by id
  - id: CV-F2
    status: IN_OBJECTIVE_BY_RULING
    detail: "GET .../contacts/:contactId/dossier calls the same service without an actor inside one Promise.all with the journey, AI-insight and health lookups; the correction awaits the visible detail first and starts the collaborators only then; tests at this head, correction in the next semantic commit"
  - id: CV-F3
    status: DISCLOSED_NOT_CHANGED
    detail: "the sibling contact-scoped read routes (events, notes, tasks by contact, journey, cross-journey, story, revenue-summary, health-metrics, relationships, network, best-channel, playbook, conversations and their summary and insights, conversation-context, data-quality) also pass businessId and contactId only, so a member who may not see a contact can still read its child data through them; a separate directive is needed"
  - id: CV-F4
    status: DISCLOSED_NOT_CHANGED
    detail: "packages/api/src/routers/crm.ts contactDetail (tRPC) applies assertBusinessAccess only; same class, separate surface"
  - id: CV-F5
    status: OBSERVED
    detail: "an ADMIN without explicit permissionScopes cannot open other members' PRIVATE rows unless shared, because visibilityClause only bypasses for OWNER and SUPER_ADMIN; the detail now matches the list, which already behaved this way; whether that is the intended product rule is for the owner"

