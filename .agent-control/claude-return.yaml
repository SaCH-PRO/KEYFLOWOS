summary: >
  H1 of issue #178. The owner console gains /admin/mission-control/handoffs, a
  read-only view of the ChatGPT/Claude handoffs on issue #80, backed by GET
  /api/admin/mission-control/handoffs (AuthGuard + AdminGuard) in
  AdminPlatformModule. One shared projector and one GET-only collector live
  in scripts/agent-control/lib and read every body through control-envelope.mjs
  unchanged; the server loads them by native dynamic import. Each request
  shows six separately evidenced stages, with review outcome, revision
  validity, merge authority and confidence as separate fields. The monitor is
  off unless a read credential is configured, and no hosted environment has
  one.

health_reason: >
  Code and proof are complete locally. YELLOW because the exact-head checks
  and the independent review have not run yet, and because the production
  server image does not ship scripts/agent-control (a packaging decision
  outside this scope, recorded under residual_risks).

