residual_risks:
  - >
    A set that changes on every attempt makes the job fail on that hour
    rather than reconcile a subset; the next scheduled run tries again.
    This is the intended direction.
  - >
    The bounded guarantee is one consistent enumeration, not a snapshot;
    a PR whose number was never served on any page cannot be detected by
    the count check if the API's totalCount omits it too.

