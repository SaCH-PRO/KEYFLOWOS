implementation_decisions:
  - the row-level check lives in the service's assertContact, before the Promise.all that reads child rows, so a forbidden row reads nothing related to it; the recorder test observes this rather than argues it
  - actorUserId is optional so the pass-through wrapper and its system-context callers are not changed; both HTTP routes always supply it, and refuse a request with no identity with the same UnauthorizedException BusinessGuard uses
  - a forbidden row raises the existing NotFoundException('Contact not found'), the same answer as an absent id, so no existence oracle is created; the directive's not-found policy is kept
  - the dossier awaits contactDetail before its Promise.all of the three collaborators, as the ruling requires; the response shape is unchanged
  - ADMIN without explicit scopes keeps today's semantics (viewAll, so other members' PRIVATE rows stay hidden unless shared), because that is what visibilityClause already returns for the list; no new rule
  - the real-database suite keeps CrmRateLimitGuard real and stubs only services the detail, dossier and list routes never call, plus the journey service as recorders because its non-invocation is the dossier claim (and its AI insight would be provider traffic); identity is attached from the seeded user row by a header middleware, the one step the Supabase-verifying AuthMiddleware would otherwise need a provider for
  - "the controllers' req parameter is typed as a user-bearing request object rather than any, so the lint ratchet sees no new warning"
  - the cloud branch was read as a description in its STOP message only; nothing from it was fetched, grafted or cherry-picked

