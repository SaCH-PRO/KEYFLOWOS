summary: >
  One entry added to COPILOT_NOT_RUN_REASONS in lib/semantic-review.mjs so
  that the wording GitHub's Copilot bot has used since 2026-10-24 when it
  cannot review for quota, "insufficient remaining quota", derives the
  existing machine reason quota_exhausted, as "reached their quota limit"
  already did. Four tests and one negative control prove the entry and its
  boundaries. Nothing else in the evidence contract changes. This
  pre-RETURN record claims no post-check result; exact_head_proof remains
  PENDING. The PR is draft, review_status stays PENDING_CHATGPT_REVIEW and
  no merge, ready transition or credit is granted.

