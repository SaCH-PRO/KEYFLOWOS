  - id: F2
    about: PR 155 after main moved
    detail: >
      PR 155 sits on ac3a6384 and its checks last ran on 2026-10-06. Merged
      with main 7d2619c7, the ten files of PR 166 are non-control changes
      after its source_head 8987f6db, so its gate will stop the same way this
      branch's did when it next runs. It also rewrites the same two artifact
      files as this branch. It needs main merged in and its artifacts
      rewritten, which makes a new semantic head there too. Doing that once,
      after this branch merges, avoids doing it twice.
  - id: F3
    about: the alias table as a precedent
    detail: >
      The table makes it cheap to accept a third spelling. The control-plane
      document says an alias exists only for a spelling already on #80 and is
      a reviewed change with the real comment recorded and replayed. Nothing
      mechanical enforces that.
  - id: F4
    about: the recording ages
    detail: >
      The continuation ends at 6025392698. Authority posted after it is read
      from the live issue by status and the orchestrator, and is not in the
      fixture.
  - id: F5
    about: the gate and a moving main
    detail: >
      The gate checks out the synthetic merge of the PR with its base and
      diffs source_head against it. Every merge to main that changes a
      non-control file therefore stops the gate of every open impl PR until
      that PR merges main and declares a new semantic head, which in turn
      needs a new independent reading. That is what happened here and will
      happen to PR 155. Whether that cost is intended is a question for
      authority; this packet changes no gate.
  - id: F6
    about: worker delivery
    detail: >
      A directive whose message id is long enough cannot be delivered by the
      worker on this host, and the failure is silent on issue 80. See
      delivery. It needs a bounded change to claude-worker.ps1 on main.
  - id: F9
    about: what ACCEPT_FOR_ADMISSION means to the repository
    detail: >
      Message 6109741134 separates ACCEPT_FOR_ADMISSION from READY_TO_MERGE
      and grants no merge. The repository does not separate them:
      READY_STATUSES in lib/admission.mjs holds both, the non-draft step of
      the gate workflow takes either, and nothing on the merge path reads
      merge_authority. The autopilot runs auto-merge-admitted.mjs with
      --merge. So with this record on the PR head, the draft flag is the one
      thing that keeps PR 159 out of the automated merge, and marking the PR
      ready for review is in effect the merge decision. This packet changes
      no gate and leaves the PR draft. Stated in the ACK (6109766740) before
      this commit.

