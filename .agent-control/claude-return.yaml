summary: >
  Admission now requires an independent semantic review through one
  provider-neutral contract, scripts/agent-control/lib/semantic-review.mjs,
  which evaluateAdmission consumes. Copilot is the preferred reviewer. ChatGPT
  is the one approved fallback, and only when Copilot is recorded and evidenced
  on the PR as NOT_RUN for a capacity, quota or service reason. ChatGPT writes
  the semantic_review record at admission. The admission path checks the
  record against live evidence: the bot's PR reviews, and the cited #80
  REVIEW, read through the admitted envelope parser. Every failure mode the
  directive names fails closed. The PR 103 admission-order race is corrected
  in three ways. A pending or owed required run blocks admission. Auto-merge
  takes a second complete snapshot immediately before the merge call. The docs
  require every manual merge to pass the same evaluator first.
  Live-evidence correction (CG-DIRECTIVE-META-AI-REVIEW-FAILOVER-LIVE-EVIDENCE-FIX-001):
  the admission path reads the cited #80 comment through REST, where `url` is
  the API URL. The ChatGPT evidence is now keyed on the comment's html_url, so a
  genuine fallback review at the cited location can match its record.

characterization:
  review_substrate_on_main: >
    At 4eba59eb the only AI-review element was return-evidence.mjs AI_REVIEW_GATE
    = 'fresh Copilot review', a pre-RETURN label. admission.mjs and
    auto-merge-admitted.mjs had no review input, and there was no Codex machinery.
    Nothing was removed; the contract is new code on main (option A).
  pr_103_race: >
    From the GitHub API: the head was 5dbfac61. ready_for_review came at 19:09:33
    and triggered an Agent Control Gate run at 19:09:36. A manual merge commit,
    4eba59eb, landed at 19:09:40, outside the evaluator. At 19:09:48 the run
    concluded failure (review_status was still PENDING_CHATGPT_REVIEW).
  live_review_evidence_on_pr_103: >
    The Copilot bot filed two reviews. At 75b43f00, the semantic head, it reviewed
    and wrote "Changes recommended, Findings: 1". At 5dbfac61 it wrote "unable to
    review ... quota limit". Both are fixtures in semantic-review.spec. They shaped
    three rules. A review that ran is not a pass. A Copilot PASS must list
    dispositioned_findings. One provider may give different outcomes at
    different heads.
  live_evidence_defect: >
    Found at admission (CC-CONTRADICTION-META-AI-REVIEW-FAILOVER-ADMIT-001). At
    b70dff17, chatgptReviewEvidence took `url` from normalizeComment, which
    prefers `c.url`. auto-merge-admitted.mjs fetches the cited comment with GET
    /repos/{repo}/issues/comments/{id}, and that REST shape has `url` =
    https://api.github.com/... next to `html_url`. It only fetches an
    evidence_location in the #80 browser form, so no record could match, and
    every ChatGPT fallback failed closed as live_evidence_missing. The spec
    fixture had html_url alone, so the suites never saw the real shape.
  correction_commit: >
    6b40df3a ("fix(agent-control): canonicalize ChatGPT review URL") made the
    one-line code change: url = comment.html_url when present, else the
    normalized url, which is already the browser URL in the gh shape. It was
    authored by Sachin Dookie after the directive, not by Claude, and was
    pushed to this branch with no test. Claude verified it independently.
    c40ed180 adds the regression, the replay of the failing live path and
    the negative control. No other line of semantic-review.mjs or
    control-envelope.mjs changed.
  discoveries:
    - >
      The local worker picks only the newest authority. Two REVIEWs 3s apart
      (5881457102 for this packet, 5881457544 for the web-Sentry queue) meant it
      processed the second and never woke for this packet. Authority can be
      shadowed without any error. This run executed the packet interactively; the
      worker selector is unchanged (out of scope).
    - >
      docs/development/KEYFLOWOS_AUTONOMOUS_AGENT_ROLES.md, a successor-programme
      document, still says "Copilot reviews" and mentions Kimi as an optional
      challenger. It is not changed here, because the successor programme is
      INACTIVE and the change is outside the minimum scope. It is raised for
      ChatGPT.
    - >
      programme-state.yaml is stale against the authority messages since
      CG-DIRECTIVE-META-STATE-RECONCILE-002, so the autopilot reports
      DERIVED_STATE_STALE_AUTHORITY every hour. Re-deriving it is not in this
      directive's scope.

design:
  contract: >
    semantic_review in claude-return.yaml has implementer and reviews[]. Each
    entry has provider, reviewer, reviewed_head, outcome (PASS, NOT_RUN or
    CHANGES_REQUIRED), reason, unresolved_substantive_findings and
    evidence_location. A copilot PASS also needs dispositioned_findings. The
    approved identities are copilot-pull-request-reviewer[bot] (type Bot) and
    chatgpt.
  exact_head_binding: >
    reviewed_head is the source_head, the PR head, or a commit whose lineage the
    compare API proves. That commit descends from source_head, is an ancestor of
    the PR head, and differs from source_head only under .agent-control/.
  admission_order: >
    TRANSITION_TRIGGERS maps each PR timeline event to the required workflows it
    re-runs (reopened -> all five; ready_for_review, converted_to_draft, renamed,
    base_ref_changed -> Agent Control Gate). This follows each workflow's
    on.pull_request types. recheckBeforeMerge requires two eligible verdicts at
    the same head and base.

