summary: >
  The application change is unchanged. The KeyCortex query pipeline does not
  execute parsed commands when their authority check fails: the executable
  set starts empty and is assigned once, after every parsed command in the
  batch has an explicit usable verdict. What changed is the tree the change
  sits in. Main moved from 98ee0202 to b1948d27 (the F9 squash of PR 181), so
  this head integrates main by an ordinary merge commit, 26c10943, which is
  the new semantic head, under CG-DIR-KF155-INTEGRATION-001. The one commit
  after it changes the two control artifacts only. Nobody independent has
  read the integrated head; the reading of fe791816 in review 6240050804 is
  historical evidence. This pre-RETURN record claims no post-check result;
  exact_head_proof remains PENDING. The PR stays draft, review_status stays
  PENDING_CHATGPT_REVIEW, and no merge grant, ready transition or production
  effect is granted.

