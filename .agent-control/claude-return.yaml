findings:
  - id: F9
    status: REPAIR_PENDING_REVIEW
    detail: >
      The identity recorded on main is kept; no new finding. Admission,
      recheck and the non-draft step now require a distinct #80 grant. The
      artifact merge_authority line remains builder-written and is not read
      as authority.

residual_risks:
  - a duplicate hold on a packet that holds the target denies permanently in this predicate (Q2); the predicate has no reconciliation path, so clearing it needs separately reviewed authority outside F9
  - a malformed hold claim whose packet cannot be read holds every target whose lifetime it falls in (CG-REV-F9-004, A1), and for each only a later valid HOLD_CLEAR for that target's own packet releases it. Where that packet has no hold the fold can see, the canonical fold reads such a HOLD_CLEAR as HOLD_MISMATCH. This is fail-closed by design (CG-REV-F9-003 Option A) but costs liveness for the packets alive when it was posted; the predicate never writes the fold
  - "A1 cost, as ruled: a packet-less malformed HOLD that names nothing of a packet and was posted before that packet's first valid authority does not hold it; the floor is about[0], so a packet first named by an earlier unrelated message sharing its branch name starts its lifetime earlier, which only holds more"
  - a hold claim is keyed by its packet text exactly as written; a HOLD whose packet differs from the target's only in case or whitespace, and which names neither the target PR nor branch, does not apply
  - RESUME provenance is the fold's (Q4); the RESUME comment URL and body repository field are not checked, so the caller must supply only the target repository's issue 80, as the CLI does
  - "Q5: main's pre-F9 evaluator never reads #80 grants, so until this repair is on main, draft is the only stop; any one-off human merge needs a separate exact-head decision and a verified F9-aware grant check immediately before the SHA-pinned merge"
  - the second snapshot's #80 read is not atomic with the SHA-pinned merge call; a comment posted in that window is seen only by the next evaluation
  - every authority comment comes from one shared account; the allowlist attests the account, not which agent wrote it
  - a deleted #80 comment cannot be detected from a snapshot
  - the gate step runs the PR's own copy of the script (pull_request event); the authoritative check is the evaluator the autopilot runs from trusted main
  - the gate step uses the runner's default Node; the step body was the only part changed, so no setup-node was added
  - any edited allowlisted comment anywhere on issue 80 makes every grant unverifiable, as it already does for all authority

rollback_floor:
  - before merge, close the PR; nothing else changed
  - after merge, revert the two semantic commits; the merge path returns to its 98ee0202 behaviour, F9 included
  - no data, schema, checkpoint or production change to undo

