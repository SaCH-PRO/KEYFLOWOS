contract_as_implemented:
  field_syntax:
    - a field is a top-level key line at column 0; the colon must be followed by whitespace or end of line
    - inline comments and quoting are read as lib/yaml.mjs reads them
    - a repeated key, including one in a second fenced block, has no value and is malformed
    - an unmatched quote is malformed; the value is still read as written, for filtering only
    - quote balance is escape-aware (backslash escapes in double quotes, doubled '' in single quotes); a stray interior quote is unmatched
    - the inline-comment scanner reads quotes the same escape-aware way, so a "#" after an escaped quote inside a quoted scalar is value, not comment
  authority_profile:
    - authority message_type; sender exactly chatgpt; allowlisted author
    - message_id and packet_id non-null; every envelope key present, null allowed, any state or health value
    - control fields are single-line
  activation_profile: AUTHORITY plus non-null values, packet-state and GREEN/YELLOW/RED vocabulary, 40-hex SHAs, true/false
  collection:
    - any edited comment from an allowlisted author -> AUTHORITY_EDITED; unknown edit state -> AUTHORITY_UNVERIFIABLE
    - missing id or unparseable time, or two authority-typed comments sharing an id -> AUTHORITY_ORDER_AMBIGUOUS
    - order is created_at, then comment id
    - a malformed ChatGPT message is a candidate, never skipped; reconcile reports those newer than the anchor as AUTHORITY_MALFORMED
    - from the ChatGPT sender, a missing, repeated or undeclared message_type is malformed authority; the declared non-authority types are the #80 list (ACK, PROGRESS, MOMENTUM, CONTRADICTION, RETURN, CLOSE) plus AUTO_EVENT and AUTO_MERGE
    - entries keep comment id, created_at, updated_at, edit evidence and the raw body for audit
  selector: selects only when the newest authority is valid, a DIRECTIVE or REVIEW, and unprocessed; exits 2 when authority is unverifiable or node is missing
  events: >
    authority-typed messages are actionable only when they pass AUTHORITY. A
    syntactically malformed envelope is MALFORMED and not actionable. An
    attributable (sender chatgpt, allowlisted author) authority-typed envelope
    that parses but fails AUTHORITY is also kind MALFORMED, as collectAuthority
    classifies it; its claimed type stays in the event's message_type and the
    profile problems in authority.problems. A forged-author or non-ChatGPT
    message keeps its claimed kind with actionable false (r4115915819).

behaviour_changes_to_note:
  - >
    An inline comment after a value is now stripped everywhere, as YAML does.
    This closes r4111639398, since a programme field followed by an inline
    comment now names the programme.
  - >
    A key followed by a colon with no space before the value is no longer a field.
  - the selector no longer wakes on an older directive when the newest authority is a HOLD/RESUME, is malformed, or when any allowlisted comment has been edited
  - forged or incomplete authority-typed comments no longer produce AUTO_EVENT wake comments
  - every envelope key must be present in authority messages; live authority since the anchor complies except the two historic messages reported as AUTHORITY_MALFORMED
  - >
    ChatGPT must use a declared #80 message type. A ChatGPT PLAN, a
    lowercase directive or a typo now fails closed (reconcile finding; the
    worker does not wake past it) instead of being ignored. Live, this adds
    CG-PLAN-PLATFORM-CONVERGENCE-001 (5826799265) to AUTHORITY_MALFORMED.
    If PLAN should be a declared non-authority type, that is a contract
    decision for ChatGPT.

