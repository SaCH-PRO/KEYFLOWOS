defects_found_and_fixed_during_implementation:
  - id: D1
    detail: >
      The YAML serializer emitted `{}` for an empty map while the parser
      rejected flow mappings, so the state file would fail to reload after its
      first save. Caught by the round-trip test, fixed, and pinned by
      NC-YAML-ROUND-TRIP.
  - id: D2
    detail: >
      The parser could not read multi-line plain scalars, which the real
      claude-return.yaml already contains. Fixed rather than weakening the test.
  - id: D3
    detail: >
      The builder adapter reported WAITING_EXTERNAL_AGENT for an installed and
      authenticated Claude CLI: on Windows the entry point is a .ps1/.cmd shim
      that Node cannot spawn without a shell (ENOENT). This would have silently
      stalled the loop. Fixed; the prompt now goes on stdin, which also keeps
      arbitrary prompt text away from the shell.
  - id: D4
    found_by: CI on PR #87, not by the local run
    detail: >
      The YAML parser could not read a block scalar used as a sequence item
      (`- >`), which this very return artifact uses for its long prose entries.
      A control artifact the codec must read was unparseable by it. It escaped
      locally because the artifact was rewritten after the last local suite --
      a file changed after its last verification. Fixed and pinned by two
      regression tests; source_head advanced accordingly.
  - id: D5
    found_by: CI on PR #87
    detail: >
      The worker cursor proof assumed an authenticated gh. On a runner there is
      none, so the tick errored rather than reporting no pending directive. It
      now skips when the control channel is unreadable instead of passing for
      the wrong reason.
  - id: D6
    found_by: CG-REVIEW-META-AUTO-002 (independent admission review)
    severity: P1
    id_upstream: META-P1-CONCURRENCY-CROSS-PATH-001
    detail: >
      The workflow-level concurrency group keyed on PR number for workflow_run
      and on a programme constant for schedule, while the scheduled reconcile
      iterates EVERY open impl/* PR. A sweep merging PR #N and an event-driven
      job merging PR #N therefore sat in different groups with no exclusion.
    why_my_proof_missed_it: >
      The F1 test asserted concurrencyKey(scheduled, packet) ===
      concurrencyKey(workflow, packet). That exercised a library helper with an
      explicitly-passed packet id, not what the workflow computes -- it checked
      the shape and not the referent. It was green while the shipped workflow
      was partitioned. The replacement tests parse the workflow file itself.
    fix: >
      Observation and mutation separated. Workflow-level group renamed
      *-observe-* and kept per-event for read-only parallelism; every mutating
      job declares one constant job-level group, keyflow-agent-control-mutation.
  - id: D7
    found_by: the negative-control run, while proving D6
    detail: >
      proof-mutation builds a throwaway git worktree, and on Windows that
      checkout rewrites LF to CRLF. A multi-line `find` written with LF never
      matched, so a control reported VACUOUS for a bookkeeping reason rather
      than a real one -- the worst kind of negative-control failure, because it
      is indistinguishable from a genuine finding. Mutations now adopt the
      file's own line-ending convention.

