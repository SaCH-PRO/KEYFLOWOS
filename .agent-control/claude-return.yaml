summary: >
  The worker that merged in PR #87 is hardened on the canonical impl/* branch.
  Dispatch now requires sender chatgpt plus an allowlisted GitHub author. Two
  identical failures hold a directive and escalate once, with no third Claude
  invocation. Every wake runs in its own worktree, and cleanup never deletes
  unsaved work. The worker stays a no-op until the hardened install is made.
  Proof is platform-correct: Ubuntu portable plus a required Windows job. All
  25 negative controls are live in CI at the exact head. Proof is complete;
  state stays PROVING until ChatGPT review, since READY_TO_MERGE is authority's
  to grant.

