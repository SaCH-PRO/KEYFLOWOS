characterization:
  basis: CG-DIR-AI-REVIEW-QUOTA-WORDING-001, read at b1948d27 before editing
  defect_at_source_main: >
    COPILOT_NOT_RUN_REASONS held one pattern, /\breached their quota limit\b/i.
    copilotReviewEvidence therefore returned reason null for the body the
    bot posted on PR 155 at 65832bc6 and 02bf32b9, "Copilot was unable to
    review this pull request because the user who requested the review has
    insufficient remaining quota.", and evaluateSemanticReview answered
    not_run_reason_not_evidenced for a record that truthfully said
    quota_exhausted. The fallback could not be judged live.
  reproduced: >
    Before the change, copilotReviewEvidence on the real review 5636727516
    gave status NOT_RUN, reason null; evaluateSemanticReview on PR 155's
    record with live-shaped evidence gave satisfied false,
    not_run_reason_not_evidenced (#80 comment 6391360955).

