residual_risks:
  - >
    Authority advances the projection only when ChatGPT types it. An untyped
    authority message still stops the fold, permanently, until a reviewed
    re-derivation moves the checkpoint past it. This is deliberate
    fail-closed behaviour, but it means the deadlock returns whenever
    ChatGPT omits control_effect.
  - >
    A malformed authority message newer than the anchor stops the fold in the
    same way. CORRECTION-004 did, and it took the reviewed re-anchor of
    CONTRACT-CORRECTION-008 to move past it. Prose written at column 0 as
    "word:" twice is enough to cause it.
  - >
    The stop is not scoped to a packet. A malformed authority message for
    any packet stops the fold for every packet, as the memory REVIEW
    5982337036 did on 2026-10-04, thirty seconds after RULING-012. With
    parallel tracks posting authority on #80, each such message costs a
    reviewed re-anchor. This PR has now needed two.
  - >
    A HOLD or RESUME wakes only when it is typed. An untyped or mistyped
    one is valid authority that wakes nothing and then stops the fold when
    any later wake reads it. That is the ruled behaviour (R13-K1), and it
    means a hold ChatGPT forgets to type takes effect as drift, not as a
    hold.
  - >
    The wake change takes effect when it is on main. The autopilot's
    normalize-event job checks out main, so until this PR merges a HOLD or
    RESUME still wakes nothing in CI.
  - >
    CLOSE is not an authority type. A packet's checkpoint must therefore be
    sent as a REVIEW with control_effect CHECKPOINT and the PR number. Until
    it is, a merged packet whose admission folded reports PR_ALREADY_MERGED.
  - >
    Generation is a position in the observed snapshot. A deleted #80 comment
    is undetectable and would shift later positions. The coordinate does not
    shift, and the parser already documents deletion as an accepted limit.
  - >
    A duplicate HOLD_SET on an already-held packet fails closed, even when
    it is only a restatement. Restatements should use NO_STATE_CHANGE.
  - >
    An explicit null for a checkpoint container (a bare "holds:" line) is now
    invalid, where it used to load as empty. No committed checkpoint has
    one. This is the stricter reading of 018 K2 and was stated in the ACK
    and in PROGRESS-007; a checkpoint written that way fails closed as
    drift until a reviewed commit corrects it.
  - >
    With an invalid checkpoint on disk, orchestrate.mjs without --apply
    reports REPORT_DRIFT and exits 0. With --apply and an actionable event
    it exits non-zero when it tries to journal, because saveState() refuses
    an invalid state. That was already so for the 017 defects and is
    unchanged.
  - >
    The architecture inventory is reproducible only from an LF tree without
    untracked files; see scanner_environment_sensitivity under scope_ledger.

