summary: >
  lib/control-envelope.mjs is now the only reader of issue #80 control fields.
  It has two profiles: AUTHORITY, used by every consumer, and ACTIVATION, used
  only by platformProgrammeState, which is AUTHORITY plus the unchanged
  activation vocabulary. events.mjs, reconcile.mjs and platform-dag.mjs use it.
  select-directive.ps1 is a thin wrapper over select-directive.mjs (D3). The
  CI decide step reads with the job token (D1). The live reconcile on healthy
  evidence no longer reports AUTHORITY_UNVERIFIABLE or REPO_TRUTH_UNVERIFIABLE.
  It reports DERIVED_STATE_STALE_AUTHORITY (D2: not re-anchored) and
  AUTHORITY_MALFORMED for three ChatGPT messages newer than the anchor that
  are not well-formed authority: two historic malformed ones (one of them a
  hold) and one PLAN, a type #80 does not declare.

