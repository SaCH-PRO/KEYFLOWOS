open_findings:
  detect_actions_fallback: >
    The text-action fallback can still run after a parsed-command failure.
    The fresh review traced separate checks in actions/executor; the first
    batch failure is not a request-wide prohibition. This packet proves
    narrowing of parsed commands at its boundary only.
  stream_query: >
    streamQuery is outside the changed parsed-command autonomy stage.
    Existing executor authorization does not make this packet a proof of
    every streaming or request-wide effect path.
  executor_result_shape: >
    The real executeBatch returns BatchResult with a results field, whereas
    the query pipeline calls map on the returned value and the focused
    fixture uses an array. This pre-existing integration mismatch is a
    separate correction; the allowed-path proof stops at the executor call.
  supervised_without_approval: >
    A structurally valid allowed true, requiresApproval false, supervised
    verdict preserves the existing executable behavior. Current producers
    pair supervised with approval. A tighter cross-field rule is separate.
  flow_authority: >
    The shipped Flow route has separately owned selective primary-policy
    read failure and client-supplied job-role authority findings. Neither is
    widened into this packet or credited as corrected.
  evidence: https://github.com/SaCH-PRO/KEYFLOWOS/blob/11971802fdada7e0e41fac39e178f1e441c4e882/docs/intelligence/sessions/2026-10-17-p0-safety-review/README.md
  disposition: all listed follow-ons are preserved outside this packet's narrow accepted semantics

residual_risks:
