summary: >
  The KeyCortex query pipeline no longer executes parsed commands when their
  authority check fails. The executable set starts empty and is assigned once,
  after every parsed command in the batch has an explicit usable verdict. A
  thrown check, or a verdict that is not an object with a boolean allowed, a
  boolean requiresApproval and a tier of manual, supervised or full, leaves
  the whole batch non-executable, keeps the conversational answer, and is
  recorded in STEP_5_CHECK_AUTONOMY as authority_check_failed_closed. Two
  semantic commits and three files. The two commits after them change only
  the two control artifacts. This one records the review message that the
  admission path can read; see semantic_head_review.

health_reason: >
  YELLOW is about process, not code. The primary reviewer could not run at
  either semantic head or at the first artifact head. The derived programme
  projection is stale, because the fold does not know the control_effect
  value of the first review of this packet. See admission_notes.

characterization:
  basis: the directive's live_defect, re-read at ac3a6384 before editing
  defect_at_source_main: >
    autonomyCheckedCommands was initialized from parsedCommands, and the catch
    around the autonomy loop logged and kept that set, so a thrown check left
    every parsed command executable.
  target_blob_at_source_main: 33540d0c07d2affd919246ebb5975ce0bef32109
  application_drift: none; origin/main is still ac3a6384 and no other packet touched the target files

implementation:
  fail_closed_default: the executable set starts empty and is assigned once, after the loop has evaluated every parsed command
  atomic_batch: the catch assigns nothing, so a failure on a later command keeps no approved prefix
  unusable_verdict: >
    isUsableAutonomyVerdict requires an object with a boolean allowed, a
    boolean requiresApproval and a tier equal to manual, supervised or full.
    Anything else throws inside the loop and is handled as a failed authority
    check.
  no_oracle: >
    The local fallback verdict is allowed false, requiresApproval true and
    tier manual, so it stays an ordinary non-executable verdict with outcome
    evaluated.
  decision_expression: unchanged from source main
  evidence: STEP_5_CHECK_AUTONOMY gains outcome (evaluated or authority_check_failed_closed), authorityCheckFailed and authorityCheckError
  log: the catch logs at error level with the count of executable parsed commands; the old text about using all parsed commands is gone
  not_touched: AutonomyOrchestratorService, the genome bridge, the executor, streamQuery, schema, FLOW_TOOLS

