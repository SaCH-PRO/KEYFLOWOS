correction:   # SWEEP-IO-001; CG-REV-AUTOPILOT-SWEEP-COVERAGE-001 (6399669819), ruled Option A by 6400454898
  finding: >
    scripts/agent-control/list-open-impl-prs.mjs ended with
    main().then((code) => process.exit(code)). main writes the whole list to
    stdout once and resolves, and the forced exit in the next microtask can
    discard the part of that write a pipe under backpressure has not taken.
    The reviewer reproduced the pattern on Node 22 with a slow pipe reader
    and a 5,000-item, 16-digit list: 65,536 of 85,000 bytes, exit 0. The
    suite at S injected stdout in memory and never crossed the real
    CLI-to-pipe boundary.
  accepted: true
  fix_at_d: >
    The entrypoint sets process.exitCode to main's 0 or 2 and lets the
    process end on its own, so the pending write drains before exit. Four
    comment lines above it name the reason. No other line of the lister
    changed; the query, paging, consistency predicates, retry, output
    format and stderr lines are those of S.
  why_the_first_proof_stopped: >
    The negative controls run only in the hosted Windows job. On Windows,
    Node gives a stdout pipe a blocking handle with synchronous writes, so
    the forced exit loses nothing there: the CONTRADICTION measured 85,000
    of 85,000 bytes with the defect in place, through a real pipe with a
    paused reader. A control proven only through the native pipe would have
    been VACUOUS on the manifest's only platform.
  option_a_as_built: >
    One regression test with two legs, each a separate child process
    running the actual CLI file with fetch stubbed through a --import
    preload that the test writes to a temporary directory. Leg 1 is the
    native OS pipe. Leg 2 adds a test-only sink in the preload: each
    process.stdout.write reaches the real pipe on a later macrotask and
    returns false, the deterministic model of a POSIX pipe under
    backpressure. Both legs assert exit 0, no signal, the 5,000 expected
    16-digit ids in order, and byte-for-byte stdout of 85,000 bytes. The
    reader is held paused until the child announces its summary on stderr
    plus 150 ms, resumes on its own timer within 5 s regardless, and a 30 s
    kill timer ends a hung child and fails the test. Nothing shipped reads
    the preload's environment variables, and the workflow is unchanged.

