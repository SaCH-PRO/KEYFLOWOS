summary: >
  Contact detail and dossier routes now apply the same record-level visibility
  as the contacts list. CrmStatsService.contactDetail takes an optional
  actorUserId; with an actor, resolveCrmAccess + visibilityClause are AND'd into
  the row query before any child row is read, and a hidden row resolves as
  NotFoundException('Contact not found'), indistinguishable from a missing id.
  Without an actor (system/automation callers via CrmService.contactDetail)
  behaviour is unchanged. The controller passes req.user.id on both routes.
  Local proof: pre-fix negative control recorded (2/15 HTTP cases fail on
  unmodified main at crm.e2e.test.ts:367), post-fix 15/15, adapter spec 12/12,
  server typecheck clean including both test files, lint warning count equal to
  main. Real-database proof is NOT_RUN in the implementer sandbox (no Docker
  daemon; migrations need pgvector, whose compilation the sandbox policy refused)
  and is owed by the CI test job on the exact head.
