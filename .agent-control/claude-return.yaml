residual_risks:
  - >
    Authority advances the projection only when ChatGPT types it. An untyped
    authority message still stops the fold, permanently, until a reviewed
    re-derivation moves the checkpoint past it. This is deliberate
    fail-closed behaviour, but it means the deadlock returns whenever
    ChatGPT omits control_effect.
  - >
    CLOSE is not an authority type. A packet's checkpoint must therefore be
    sent as a REVIEW with control_effect CHECKPOINT and the PR number. Until
    it is, a merged packet whose admission folded reports PR_ALREADY_MERGED.
  - >
    Generation is a position in the observed snapshot. A deleted #80 comment
    is undetectable and would shift later positions. The coordinate does not
    shift, and the parser already documents deletion as an accepted limit.
  - >
    A duplicate HOLD_SET on an already-held packet fails closed, even when
    it is only a restatement. Restatements should use NO_STATE_CHANGE.

