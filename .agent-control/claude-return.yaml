summary: >
  Correction of finding SWEEP-IO-001 on the hourly sweep's candidate lister.
  The CLI entrypoint ended with process.exit right after the one large
  stdout write, so under pipe backpressure the process could end with part
  of the candidate list unwritten and exit 0; the reviewer measured 65,536
  of 85,000 bytes on Linux. D sets process.exitCode and ends naturally with
  the same status, so the write drains first. One regression test spawns
  the actual CLI and reads its real stdout pipe in two legs, the native OS
  pipe and a test-only sink that models a POSIX pipe under backpressure;
  one negative control restores the forced exit, for 252. On Windows the
  control is live through the modeled leg, because the native stdout pipe
  there is blocking and shows no loss; on Linux both legs fail with the
  defect restored. The listing logic, query, consistency predicates,
  workflow, evaluator, recorder and lock are unchanged from S. This
  pre-RETURN record claims no result for the head that carries it;
  exact_head_proof stays PENDING, PR 185 stays draft under CHANGES_REQUIRED,
  and no merge, ready transition or credit is granted.

