residual_risks:
  - the second snapshot's #80 read is not atomic with the SHA-pinned merge call; a comment posted in that window is seen only by the next evaluation
  - every authority comment comes from one shared account; the allowlist attests the account, not which agent wrote it
  - a deleted #80 comment cannot be detected from a snapshot
  - the gate step runs the PR's own copy of the script (pull_request event); the authoritative check is the evaluator the autopilot runs from trusted main
  - the gate step uses the runner's default Node; the step body was the only part changed, so no setup-node was added
  - any edited allowlisted comment anywhere on issue 80 makes every grant unverifiable, as it already does for all authority

