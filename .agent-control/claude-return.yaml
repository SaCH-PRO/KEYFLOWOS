summary: >
  Two valid REVIEWs on #80 declared a control_effect outside the canonical
  vocabulary, and the fold stopped at the first. lib/authority-effects.mjs now
  has one frozen table, CONTROL_EFFECT_ALIASES, beside readEffect():
  BOUNDED_CORRECTION is read as PACKET_CORRECTION and
  AUTHORIZE_CONTROL_BINDING as NO_STATE_CHANGE. The spelling is resolved first
  and every rule after that is the canonical effect's own. CONTROL_EFFECTS is
  unchanged, every other unknown token still stops the fold, and the declared
  spelling is kept only as evidence. The committed checkpoint is untouched and
  still anchored to RECOVERY-021; from it the fold now reaches the newest
  authority on #80.

health_reason: >
  YELLOW is the directive's own health and is about process: this branch
  rewrites the two artifact files that PR 155 also rewrites, and the outcome
  for the head that carries this file is not known yet. The code and its local
  proof have no open failure.

characterization:
  live_before: >
    At ac3a6384, status.mjs --verify reported DERIVED_STATE_STALE_AUTHORITY:
    checkpoint RECOVERY-021 at generation 87, 14 typed effects applied,
    observed generation 101 of 106, stopped at
    CG-REVIEW-GENAI-AUTH-FAIL-CLOSED-CORRECTION-001 (6011507550), generation
    102, CONTROL_EFFECT_UNKNOWN for BOUNDED_CORRECTION. That is the evidence
    the directive recovered.
  anti_duplication: >
    readEffect() in lib/authority-effects.mjs is the only reader of
    control_effect. lib/events.mjs reaches it through readEffect() for the
    HOLD and RESUME wake. No normalization or compatibility seam for effect
    vocabulary existed anywhere in scripts/agent-control or .github. The alias
    table is therefore the single owner, and no second reader is added.
  existing_controls: >
    The manifest had 157 entries on main. One of them,
    NC-REDUCER-UNTYPED-INFERRED, targets the line that reads control_effect,
    and another the type-rule line. The change is written beside those lines,
    so all 157 entries are byte-for-byte as they were and each mutation target
    still matches exactly once.

design:
  seam: >
    readEffect() reads the declared effect, returns CONTROL_EFFECT_MISSING for
    none as before, resolves the spelling through CONTROL_EFFECT_ALIASES by
    exact own key, and hands the canonical effect to readCanonicalEffect(),
    which holds the unchanged vocabulary check, type rule, health rule,
    production rule and field rules.
  evidence: >
    readEffect() returns declared_effect beside effect, and each entry of the
    reduction's applied list carries both. applyEffect() reads only effect.
    The spelling is never written into the projection.
  type_mismatch_detail: >
    When an alias rides a type its canonical effect cannot, the detail names
    both: "HOLD cannot carry PACKET_CORRECTION (declared as
    BOUNDED_CORRECTION)". For a canonical spelling the detail is as it was.
  not_done: >
    No new effect, no new state, no change to CONTROL_EFFECTS, EFFECTS_BY_TYPE
    or PROJECTED_STATE, no change to the envelope parser, the reconciler, the
    orchestrator or status.mjs, and no change to programme-state.yaml.

