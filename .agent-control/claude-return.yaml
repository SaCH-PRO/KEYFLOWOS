residual_risks:
  - >
    A person with merge rights can still merge by hand without running the
    evaluator. Only GitHub branch protection or a ruleset enforces required
    checks for a manual merge. That setting is HUMAN_GATED.
  - >
    Reviewer identity on #80 is the envelope sender plus the authorized-author
    allowlist, and both agents post from the same GitHub account. The contract
    relies on the same trust model as all #80 authority. It cannot tell a
    ChatGPT-authored REVIEW from one typed by another agent under that account.
  - >
    TRANSITION_TRIGGERS mirrors the workflows' on.pull_request types. If a
    required workflow's triggers change, the map must change too. admission.spec
    checks the gate's types and that every mapped workflow is required.
  - >
    The Copilot finding count is parsed from the bot's overview text
    ("**Findings:** N"). If GitHub changes that format, the count reads as 0,
    and dispositioned_findings is still required to be explicit.

