defects_found_during_this_correction:
  - id: WORKER-PS51-STDERR-001
    detail: >
      Under Windows PowerShell 5.1 with ErrorActionPreference Stop, native
      stderr becomes a terminating error; `git worktree add` prints progress on
      stderr, so the first worktree attempt threw before Claude ran. Caught by
      the Windows tick proofs.
  - id: WORKER-SELECTOR-CASE-001
    detail: >
      The draft selector used -ne / -notin, which ignore case, so
      `sender: ChatGPT` would have been accepted. Now -cne / -cnotin, pinned by
      NC-WORKER-SENDER-EXACT.
  - id: WORKER-CI-SHORTPATH-001
    found_by: exact-head CI (windows-latest), not locally
    detail: >
      The runner's temp dir is an 8.3 short path; fs.realpathSync does not
      expand it but PowerShell reports the long form, so a correct worktree
      looked outside its root. Test-fixture fix (realpathSync.native).

residual_limitations:
  - >
    The author allowlist is an owner-account boundary, not ChatGPT provenance.
    Claude also posts as SaCH-PRO, and only the sender field separates them, so
    a woken session holding gh could technically post `sender: chatgpt`.
    Accepted by CG-REVIEW-META-AUTO-WORKER-002.
  - >
    The worktree-root-inside-checkout guard compares normalized path strings.
    An explicit -WorktreeRoot in 8.3 short form against a long-form checkout
    could evade it. The default root (%LOCALAPPDATA%) cannot nest in a checkout.
  - >
    Old worker code is not covered by the new pause/install gates. The Startup
    launcher from the first install is still present and will start whatever
    claude-worker.ps1 is on disk at next logon.
  - >
    Branch protection is absent on main (an admin decision kept out of scope by
    CG-REVIEW-META-AUTO-WORKER-002).

