implementation_decisions:
  - grant: a valid AUTHORITY-profile REVIEW from an allowlisted author, merge_authority true, review_status READY_TO_MERGE, control_effect read by readEffect as NO_STATE_CHANGE or PACKET_ADMISSION, bound exactly to pr_number, packet_id, implementation_branch, source_head, pr_head and source_main; its URL must be on the target repository's issue 80, and a repository field, when present, must name the target
  - ordering: the newest valid message about the target (same packet, PR or branch) must be the grant; anything later voids it, and only a new grant restores it
  - ambiguity: a malformed authority candidate after the grant that is, or may be, about the target denies; one before it is superseded by it
  - holds (CG-REV-F9-003): the hold pass reads every candidate, valid or malformed, in #80 order. A hold claim is a candidate whose message_type values are not exactly one of DIRECTIVE, REVIEW or RESUME (a HOLD, or an absent, repeated or undeclared type), so a HOLD repeated behind a REVIEW is still a claim. It holds the target when its packet is the target's or cannot be read, or when it names the target's pr_number or implementation_branch under another packet (Q3); a hold claim on another readable packet naming neither does not apply
  - hold release: only a later valid RESUME whose effect readEffect reads as HOLD_CLEAR for the hold's own packet releases it, matched exactly as written; a hold whose packet cannot be read is keyed to the target packet. A HOLD_CLEAR for another packet (including one that names the target PR or branch), one older than the HOLD, or a RESUME that is not valid authority releases nothing, and a later HOLD needs its own later release
  - duplicate (Q2): a second hold claim on a packet already held, with no release between, is merge_grant_hold_duplicate and denies whatever follows; no later RESUME cures it. This replaces the decision recorded since 3022dcda (a second HOLD stayed held until one HOLD_CLEAR), as CG-REV-F9-003 ruled. A HOLD_CLEAR with no hold before it still changes nothing, and the global fold is unchanged
  - lifetime (CG-REV-F9-004, A1): the floor is the target's first valid authority message (packet, PR or branch) in #80 order, about[0], never a timestamp, grant or projection. A hold claim whose packet cannot be read and which names none of the target's packet, PR or branch, in any repeated value, holds nothing for the target when it is strictly older than the floor, and is not a hold for the duplicate rule. At or after the floor it holds before or after the grant; readable-packet and target-naming claims keep their scope at any age. Releases, duplicates, binding, supersession and post-grant ambiguity are unchanged. Stated cost, as ruled: a packet-less malformed HOLD posted before a packet's first valid authority does not hold that packet
  - chronology (CG-REV-F9-005): the hold pass keeps a per-packet chronology of every hold claim in scope, keyed by the packet whose HOLD_CLEAR releases it, whether or not the claim holds the target yet. A packet is relevant to the target when any of its holds in the chronology holds the target. A second hold on a packet with no release between is recorded as that packet's duplicate; it denies merge_grant_hold_duplicate when the packet is relevant, in either ordering of an unrelated hold and a target-naming hold, whatever follows, and no later release cures it. A duplicate on a packet that never concerns the target is not this target's to judge. Whether an unreleased hold holds the target is judged per hold (Q3), so a packet's released target hold followed by an unrelated hold on it holds nothing. One stated change of reason, both denials: HOLD(other, unrelated), HOLD(other, names the target), grant with no release read merge_grant_target_held at bb2479a1 and reads merge_grant_hold_duplicate now, as the canonical fold would stop there
  - Q1: readEffect is unchanged; a null or blank RESUME health is absent and releases, a present health outside GREEN/YELLOW/RED does not
  - Q4: RESUME provenance is unchanged; a body repository field or URL is not a release condition, and no authentication is inferred from it
  - malformed candidates that are not hold claims (a malformed REVIEW, DIRECTIVE or RESUME) are still superseded by a later grant and release nothing; after the grant, any malformed candidate that may be about the target is still ambiguous
  - no global READY_TO_MERGE projection is required or read, so a meta repair does not move or wait on the active application packet
  - the grant is checked last in evaluateAdmission, so every earlier denial keeps its reason; the artifact review_status check is kept as it was
  - recheckBeforeMerge requires the same grant (comment id, message id, binding) in both snapshots
  - acyclic binding: the grant names the final artifact head after that commit exists; the artifact never names the grant
  - the gate step runs --grant-only (PR, artifacts, issue 80; no workflow runs), bound to the event head and base; it keeps its source_main and status checks
  - "scope disclosure from the ACK: issues read permission added to the gate workflow, outside the step body; read-only"

