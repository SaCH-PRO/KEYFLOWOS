behaviour_changes:
  - a thrown authority check executes no parsed command; before, it executed all of them
  - a failure on a later command of a batch executes none of the batch, an approved earlier command included
  - a verdict that lacks a boolean allowed, a boolean requiresApproval or a recognized tier is a failed check and the batch executes nothing
  - a verdict whose allowed is truthy but not a boolean no longer approves a command
  - STEP_5_CHECK_AUTONOMY carries outcome, authorityCheckFailed and authorityCheckError

new_consumers_or_writers: []

open_findings:   # recorded, not resolved by this packet
  detect_actions_fallback: >
    When no parsed command is executable, processQuery runs
    actionDetectionService.detectActions on the model content and then
    actionsService.executeActions. That branch has no autonomy check in this
    file. The same fallback runs when executeBatch throws. What
    actionsService enforces was not characterized.
  stream_query: >
    streamQuery has no parsed-command autonomy step. It sends detected actions
    to executeBatch with no authority check in this file.
  supervised_without_approval: >
    A well-formed verdict of allowed true, requiresApproval false and tier
    supervised still executes, because the existing decision blocks manual and
    explicit approval requirements only. Both current producers pair
    supervised with requiresApproval true. The review keeps this as preserved
    behaviour and names any tighter rule a separate decision.
  disposition: the review records all three as outside this packet and not credited as fixed

residual_risks:
  - >
    A failed authority check degrades a command-bearing request to a
    conversational answer with no effect. A user sees no action taken, and
    the reason is in the step evidence and the error log only.
  - >
    The detectActions fallback above still runs after a fail-closed batch, so
    this packet does not make the whole request effect-free.

