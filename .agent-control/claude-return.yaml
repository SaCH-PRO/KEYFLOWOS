modelling_decisions_for_review:
  - id: M1
    subject: SPACE-001 / UX-001
    detail: >
      The board writes "UX-001 coordination", not a dependency. It is modelled as
      a non-blocking `coordinates_with` edge so the selector neither invents a
      hard gate nor loses the relationship. Promote it to depends_on on an
      explicit decision. Topologically either choice is acyclic; this one is the
      literal reading.
  - id: M2
    subject: bare packet references
    detail: >
      A bare reference to a spanning packet resolves to its TERMINAL phase --
      the stricter reading, which can only delay work, never leapfrog it. The
      validator proves this introduces no backward wave edge.

known_gaps:
  - >
    The OpenAI and secondary reviewer adapters are configuration hooks: they
    report WAITING_EXTERNAL_AGENT until credentials are supplied out of band.
    Live review invocation is deliberately not enabled here, since wiring a
    credentialed reviewer is a separate authorized decision.
  - >
    The GitHub-hosted runner cannot impersonate the interactive Claude session.
    The worker therefore runs on the developer machine, exactly as
    AGENT_AUTOPILOT documents. No cloud worker is claimed.

