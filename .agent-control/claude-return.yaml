summary: >
  helpdesk_create_ticket is the first capability to run through the KEY action
  boundary: real CapabilityContract identity, a server-built frozen envelope
  bound to a sha256 fingerprint, a ControlRequirement derived from capability,
  principal authority, KEY autonomy, policy and surface, server-issued
  ControlEvidence, Clearance computed inside the claim transaction on locked
  rows, an insert-or-fail ExecutionClaim, the SupportTicket written on the
  same transaction, and OutcomeEvidence naming the ticket and the principal
  chain. Every surface that can run the tool reaches one branch of
  FlowOrchestratorService.executeToolAction, and that branch hands the call to
  KeyActionBoundaryService. No other capability is touched. No new table:
  KeyActionProposal is the action record and the claim is an IdempotencyKey row.

health_reason: >
  YELLOW is about process, not code. The primary reviewer could not run at
  either semantic head, and several runner jobs on 92329d04 and cfb3322c were
  cancelled after 910 seconds with no step recorded and no runner assigned.

characterization:
  basis: CC-RETURN-ACTION-001-CHAR (5826241744), accepted by CG-REVIEW-ACTION-001-CHARACTERIZATION-ACCEPT-001
  application_drift: none; git diff ad97ea48..6fdffc26 over apps/ and packages/ is empty
  choke_point: every surface ends in the helpdesk_create_ticket branch of executeToolAction (flow-orchestrator.service.ts:4843 at 6fdffc26)
  twelfth_reach: autoExecuteToolForMonitoring calls the executor under a pro_auto mode override; it was not numbered in the characterization
  proposal_producers: nine files build EXECUTE_TOOL proposals and the proposals route accepts one; keyActionProposal.create is called in two places, the proposal service and the boundary

design:
  reuse: >
    CapabilityContractService for identity. KeyActionProposal for the envelope,
    requirement, evidence, principal chain and outcome (twelve nullable
    columns, one index). IdempotencyKey for the claim, under its existing
    unique index. AiOversightService.evaluate for KEY autonomy and policy,
    with an optional reader so it runs on locked rows. The frozen AUTH-001
    approval-tier rule. HelpdeskService for the insert.
  claim_transaction: >
    Insert the claim. Read the action record and recompute the fingerprint.
    Lock with FOR SHARE and re-read the autonomy policy rows, the business,
    and for each principal the user and the membership. Derive the
    ControlRequirement again and compute Clearance. Insert the ticket. Write
    the outcome on the action record and the claim. Commit, then emit
    supportTicket.created.
  eligibility: >
    A requester confirms their own action on the BusinessGuard rule: owner,
    member or SUPER_ADMIN. An approval needs an approval tier at or above the
    capability tier. STAFF defaults to tier 0. An owner with no Membership
    row has tier 0, because resolveApproval refuses an approver with no
    Membership.
  principalless: >
    A surface with no trusted principal gets HUMAN_APPROVAL whatever KEY
    autonomy says. The phone stream and a caller that declares no surface
    have an untrusted tenant binding and are denied before anything is read
    or written.
  plan_step_identity: >
    A plan step is one action. Its record is found again by business,
    capability, plan step and fingerprint while it is PENDING, APPROVED or
    EXECUTED, so the plan runner's resume executes the approved action and a
    run after execution replays the ticket.
  refusal_is_not_failure: >
    The dispatcher does not retry a boundary answer, does not count it
    towards its circuit breaker and returns awaitingApproval. The queue
    worker leaves such a step awaiting_approval. The efferent bridge returns
    notExecuted, and the cortex registry does not score, limit-count or cache
    a notExecuted result.
  failure_classification: >
    FAILED is recorded only when the database deterministically rejected the
    write or the contact check failed. Any other error rolls back with the
    claim and leaves the action executable.
  shadow: >
    The legacy oversight decision is computed beside the ControlRequirement
    and stored on the action record. Over 13 surfaces, 5 verdict shapes and 6
    requester kinds the boundary agrees with the surface in 150 cells, is
    stricter in 240 and is looser in none.

