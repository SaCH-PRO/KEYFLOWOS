summary: >
  The application change is unchanged. The KeyCortex query pipeline does not
  execute parsed commands when their authority check fails: the executable
  set starts empty and is assigned once, after every parsed command in the
  batch has an explicit usable verdict. What changed is the tree the change
  sits in. Main moved from ac3a6384 to 98ee0202 (PR 166 and PR 159), so this
  head integrates main by an ordinary merge commit, fe791816, which is the new
  semantic head. The one commit after it changes the two control artifacts
  only. Nobody independent has read the integrated head; see
  semantic_head_review. Nothing here was pushed or posted by the session
  that wrote this file.

