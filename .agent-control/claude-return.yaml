precedence_before_after:
  before:
    - programme-state was declared canonical; #80 was "a log, not state"
    - decide() read only programme-state and the single triggering event
    - a newer #80 HOLD or REVIEW changed nothing until someone hand-edited programme-state
    - main's projection (PR #87 READY_TO_MERGE) with the hold lifted -> EVALUATE_ADMISSION forever
  after:
    - decide() requires reconcile() to show the projection consistent with the newest valid #80 authority and repository truth
    - newer authority / repo contradiction / missing anchor / unreadable input -> REPORT_DRIFT with every finding
    - main's old projection, live -> REPORT_DRIFT (DERIVED_STATE_UNANCHORED, PR_ALREADY_MERGED), with or without its hold
    - committed projection, live -> CONSISTENT -> WAIT_AUTHORITY (ACTION-001 held)
    - consistent input -> identical to the prior rule table for all 8 states

discoveries:
  - id: D1
    detail: >
      #80 has no HOLD or RESUME message_type; holds/resumes have been typed DIRECTIVE and
      distinguished only by id prefix and prose. Not inferred: any newer authority stales the
      projection. A future typed HOLD/RESUME convention would be a ChatGPT decision.
  - id: D2
    detail: >
      ACTION-001 release wording differs: CG-HOLD-ACTION-AUTO-001 says "CG-RESUME-ACTION-*";
      the prior projection (citing CG-REVIEW-META-AUTO-001) said a fresh
      "CG-DIRECTIVE-ACTION-CHAR-*". Both recorded verbatim; not resolved.
  - id: D3
    detail: CI observer lacks a token for the decide step (see deferred)
  - id: D4
    detail: >
      auto-merge-admitted.mjs does not consult #80, so a HOLD posted after a PR's
      review_status became READY_TO_MERGE would not stop an exact-head merge. Fixing it needs
      D1 decided and changes automatic_merge_contract. Not changed.

residual_risks:
  - the projection goes stale after every new ChatGPT authority message until re-derived in a reviewed commit; the orchestrator waits (REPORT_DRIFT) meanwhile -- safe, but no automated re-derivation exists
  - until the workflow step has a token, CI-published derived_action is REPORT_DRIFT (AUTHORITY_UNVERIFIABLE)
  - the authority allowlist is an owner-account boundary, not proof a message came from ChatGPT (same as the worker)
  - once this PR merges and ChatGPT posts its review, main's projection is stale relative to that review by design; re-anchoring is a follow-up reviewed commit
  - D4 merge-path/HOLD gap

