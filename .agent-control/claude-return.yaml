characterization:
  basis: CG-DIR-AUTOPILOT-SWEEP-COVERAGE-001 and 002, read at b1948d27; #80 comment 6390607657
  defect_at_source_main: >
    The hourly step listed candidates with gh pr list --state open --json
    number,headRefName and a jq filter on impl/. Without --limit, gh returns
    30 pull requests. The repository had 52 open PRs, so the 14 impl/* PRs
    outside the 30 newest were never evaluated, and the job printed nothing
    about completeness.
  reproduced: >
    Scheduled run 40079991941 evaluated exactly the 7 impl/* heads among the
    30 newest open PRs (179, 168, 162, 161, 160, 158, 155) and reported
    success; the later scheduled runs carried the same line.

