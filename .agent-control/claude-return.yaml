summary: >
  programme-state.yaml is now a reviewed checkpoint. Every newer #80 authority
  message that declares an explicit control_effect is folded over it at read
  time by scripts/agent-control/lib/authority-effects.mjs. reconcile() then
  checks the effective projection against #80 and repository truth, and
  orchestrate, status and the autopilot decide on it. Ordinary typed
  authority therefore advances the derived projection without a hand-written
  reconciliation PR. Untyped, unknown, malformed, conflicting or
  programme-naming authority stops the fold and fails closed as before, and
  repository contradictions still report drift. The checkpoint was re-derived
  at main 11053288 and anchored to the directive. Read live, the real typed
  CG-REVIEW-META-STATE-REDUCER-LIVE-CORRECTION-001 folds over it and the
  projection reconciles CONSISTENT, with ACTION-001 still held.

characterization:
  starting_point: >
    At 11053288 reconcile() treated any valid authority message newer than
    programme-state's anchor as stale (DERIVED_STATE_STALE_AUTHORITY), and the
    only cure was a reviewed re-derivation commit. The committed projection
    was anchored to CG-DIRECTIVE-META-STATE-RECONCILE-002 (5875639550), and 13
    newer valid authority messages made it stale. None of them, nor any
    earlier #80 authority, carried a typed effect.
  pr_109: >
    PR 109 (9fca0d24) holds a pure fold that is not wired into reconcile,
    orchestrate or status. It was read as reference only; no code was taken
    from it. Its design differs here: it had a programme activation effect,
    a single hold, and generation as a count of valid messages.
  live_evidence: >
    ChatGPT's first typed authority, CORRECTION-001, carried control_effect
    PACKET_CORRECTION with no pr_number because no PR existed. The first cut
    required pr_number on corrections and stopped on it live. Corrections now
    may omit pr_number, which keeps the projected PR; admission and
    checkpoint still require it. The real comment is in the recorded fixture.

design:
  effects: >
    NO_STATE_CHANGE, PACKET_RELEASE (DIRECTIVE), PACKET_CORRECTION (DIRECTIVE,
    REVIEW), PACKET_ADMISSION (REVIEW), CHECKPOINT (REVIEW), HOLD_SET (HOLD
    only), HOLD_CLEAR (RESUME only). A packet's projected state comes from its
    effect, never from the free-vocabulary state field. Packet effects other
    than a release target only the active packet; a release needs no packet in
    flight. A different PR number is a conflict.
  holds: >
    C1. holds is a packet-keyed map, and several packets may be held at once.
    A duplicate HOLD_SET on a held packet, or a HOLD_CLEAR without an active
    hold for its packet, fails closed. A packet effect naming a held packet
    fails closed; an effect for another packet folds. decide() still waits
    while any hold is active, so execution stays serialized. A legacy single
    hold is lifted into the map by the fold, and the checkpoint now stores the
    ACTION-001 hold in holds.
  generation: >
    C2. Generation is the 1-based position among all authority candidates in
    the observed #80 snapshot, malformed ones included, so an earlier message
    turning malformed never renumbers a later one. An edit makes the snapshot
    unverifiable and nothing is numbered. Each folded or unapplied message
    also carries its immutable coordinate, created_at#comment_id. The live
    path reads the whole issue, where the anchor is generation 64.
  no_activation_no_safety: >
    Authority naming programme or programme_action stops the fold. The fold
    never touches safety, platform_programme or contradictions.
  credit: CHECKPOINT credits only members of KEYFLOWOS_PROGRAMME_DAG.yaml; meta packets stay at zero.
  wiring: >
    truth.reconcileWithTruth reads #80, folds, reads repository truth for the
    effective projection, and calls reconcileProjection. orchestrate decides on
    reconciliation.effective_state and journals onto the stored checkpoint.
    status --verify renders the effective projection, the checkpoint, the
    applied effects and any stop. Nothing writes the fold back.
  checkpoint: >
    Re-derived at main 11053288 and anchored to CG-DIRECTIVE-META-STATE-REDUCER-LIVE-001
    (5963509515). The programme section equals what the directive's
    PACKET_RELEASE would project. It records 4/35 application packets
    checkpointed, ACTION-001 held in holds, the platform programme
    INACTIVE_SUCCESSOR, and every safety flag false. PR 104 is recorded under
    meta_package. CC-CONTRADICTION-AI-PR-REVIEW-GATE-001 moves to resolved, per
    the authority_decision in CG-DIRECTIVE-META-AI-REVIEW-FAILOVER-001
    (5876689636, SUPERSEDED_BY_REVIEWER_FAILOVER).

