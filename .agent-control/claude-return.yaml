  - >
    The directive says to run the new decision path in shadow first and
    withdraw the legacy bypasses after proof. This is one PR: the legacy
    decision is recorded beside the new one and the differences are proved
    over the whole matrix, and the same PR enforces the boundary. There is no
    flag that restores legacy execution, because that flag would be a surface
    bypass. Stated in CC-PROGRESS-ACTION-001-IMPLEMENT-001, reading 5.
