summary: >
  GET contact detail and GET contact dossier now apply the caller's effective
  CRM visibility (resolveCrmAccess + visibilityClause, the rule the list
  already applies) to the row lookup before any child row is read, and answer
  a forbidden row exactly like an absent one. The dossier awaits the visible
  detail first; its journey, AI-insight and health collaborators start only
  after the row is allowed. Two product files changed; the system-context
  callers keep their interface through an optional parameter. Each defect was
  first recorded on the hosted real database at a tests-first head
  (previous_head_e59856d0 for the detail route, previous_head_14977221 for the
  dossier), then corrected. The real-database suite is BLOCKED on this host and
  runs only in the hosted job, so its post-fix result for this head is reported
  in the RETURN.

