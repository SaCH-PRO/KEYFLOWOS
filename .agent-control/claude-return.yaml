summary: >
  programme-state.yaml is a reviewed checkpoint. Every newer #80 authority
  message that declares an explicit control_effect is folded over it at read
  time by scripts/agent-control/lib/authority-effects.mjs. reconcile() then
  checks the effective projection against #80 and repository truth, and
  orchestrate, status and the autopilot decide on it. Ordinary typed
  authority therefore advances the derived projection without a hand-written
  reconciliation PR. Untyped, unknown, malformed, conflicting or
  programme-naming authority stops the fold and fails closed as before, and
  repository contradictions still report drift. A typed HOLD or RESUME
  comment now also wakes the autopilot, so a hold or a release is decided on
  in the run that comment triggers (RULING-012). The checkpoint in this
  branch is the second reviewed recovery: re-derived whole at main 11053288
  and anchored to EXACT-BINDING-016 (5982685256, generation 81). The first
  recovery anchored it to CONTRACT-CORRECTION-008, past the malformed
  CORRECTION-004. That checkpoint then stopped, as designed, at a malformed
  REVIEW for another packet (5982337036), and RECOVERY-REANCHOR-015
  authorized the re-anchor. The checkpoint itself is validated before
  anything is folded over it (CHECKPOINT-VALIDATION-017), and a container
  that is present with the wrong structural type is left as written and
  rejected, never coerced (CONVERGED-CORRECTIONS-018 K2). 018 also makes a
  refused HOLD or RESUME record its reason in wake_refused in every case
  (K1) and binds the artifact identities as strings only (K3). Read live on
  2026-10-04 at a046914d the projection reconciles CONSISTENT: the anchor is
  generation 81, the typed 017, 018 and 019 fold over it (two corrections
  and one NO_STATE_CHANGE), and the observed generation is 84 of 84, with
  ACTION-001 still held.

characterization:
  starting_point: >
    At 11053288 reconcile() treated any valid authority message newer than
    programme-state's anchor as stale (DERIVED_STATE_STALE_AUTHORITY), and the
    only cure was a reviewed re-derivation commit. The committed projection
    was anchored to CG-DIRECTIVE-META-STATE-RECONCILE-002 (5875639550), and 13
    newer valid authority messages made it stale. None of them, nor any
    earlier #80 authority, carried a typed effect.
  pr_109: >
    PR 109 (9fca0d24) holds a pure fold that is not wired into reconcile,
    orchestrate or status. It was read as reference only; no code was taken
    from it. Its design differs here: it had a programme activation effect,
    a single hold, and generation as a count of valid messages.
  live_evidence: >
    ChatGPT's first typed authority, CORRECTION-001, carried control_effect
    PACKET_CORRECTION with no pr_number because no PR existed. The first cut
    required pr_number on corrections and stopped on it live. Corrections now
    may omit pr_number, which keeps the projected PR; admission and
    checkpoint still require it. The real comment is in the recorded fixture.
  malformed_authority: >
    CORRECTION-004 (5964575594) repeats a column-0 key in its prose, so the
    one envelope parser reads it as malformed and the fold from the directive
    anchor stopped there. The parser was not relaxed. CONTRACT-CORRECTION-008
    ordered the reviewed re-anchor instead, and the authoring rule is in
    AGENT_CONTROL_PLANE.md. CORRECTION-009 (5965780538) was posted as a
    one-line envelope, which the parser does not read as an authority
    candidate, so it holds no generation and never stopped a fold.
    CORRECTION-010 superseded it. CONTRACT-CORRECTION-008 is generation 73
    and was the anchor only until the second recovery; the current anchor is
    EXACT-BINDING-016 at generation 81.
  malformed_authority_for_another_packet: >
    CG-REVIEW-META-MEMORY-TRUTH-AUDIT-CORRECTION-001 (5982337036), a REVIEW
    for KF-META-MEMORY-TRUTH-AUDIT-001 posted 30 seconds after RULING-012,
    repeats a column-0 Required key in its prose. The fold from the
    CONTRACT-CORRECTION-008 anchor applied CORRECTION-010, RULING-011 and
    RULING-012 and stopped there, with CORRECTION-013 and ACTION-SHAPE-014
    behind it. Live status --verify reported DRIFT on 2026-10-04 and it was
    reported on #80 in the ACK of 014. The parser was not relaxed and #80
    was not edited. RECOVERY-REANCHOR-015 authorized the reviewed re-anchor
    and EXACT-BINDING-016 set the anchor to itself.
  hold_resume_wake: >
    At 2763f796 and on main, ACTIONABLE_MESSAGE_TYPES in lib/events.mjs was
    RETURN, CONTRADICTION, MOMENTUM, DIRECTIVE, REVIEW. A valid HOLD or
    RESUME normalized to actionable false, so the autopilot published no
    wake event for it and a HOLD_CLEAR dispatched nothing until some other
    event ran the autopilot (Copilot r4175650069, CONTRADICTION-003).

design:
  effects: >
    NO_STATE_CHANGE, PACKET_RELEASE (DIRECTIVE), PACKET_CORRECTION (DIRECTIVE,
    REVIEW), PACKET_ADMISSION (REVIEW), CHECKPOINT (REVIEW), HOLD_SET (HOLD
    only), HOLD_CLEAR (RESUME only). A packet's projected state comes from its
    effect, never from the free-vocabulary state field. Packet effects other
    than a release target only the active packet; a release needs no packet in
    flight. A different PR number is a conflict.
  holds: >
    C1. holds is a packet-keyed map, and several packets may be held at once.
    A duplicate HOLD_SET on a held packet, or a HOLD_CLEAR without an active
    hold for its packet, fails closed. A packet effect naming a held packet
    fails closed; an effect for another packet folds. decide() still waits
    while any hold is active, so execution stays serialized. A legacy single
    hold is lifted into the map by the fold, and the checkpoint stores the
    ACTION-001 hold in holds. Holds are read and written by own key only
    (AUDIT-CORRECTION-007), so a packet named __proto__ or constructor is
    held and cleared like any other.
  packet_ids: >
    A packet id is any non-blank text. The checkpoint YAML codec writes a
    mapping key plain only when its parser reads that exact key back, and
    quotes it otherwise, so ids such as ":", "a:b", "a: b" and "- z" survive
    a save and reload under the same key (C10-F1). The vocabulary is not
    narrowed.
  generation: >
    C2. Generation is the 1-based position among all authority candidates in
    the observed #80 snapshot, malformed ones included, so an earlier message
    turning malformed never renumbers a later one. An edit makes the snapshot
    unverifiable and nothing is numbered. Each folded or unapplied message
    also carries its immutable coordinate, created_at#comment_id. The live
    path reads the whole issue, where the current anchor, EXACT-BINDING-016,
    is generation 81. CHECKPOINT-VALIDATION-017 is 82,
    CONVERGED-CORRECTIONS-018 is 83 and SEMANTIC-ACCEPT-019 is 84. The
    previous anchor, CONTRACT-CORRECTION-008, is 73.
  safety_fields: >
    Every effect, holds and NO_STATE_CHANGE included, fails closed on a
    health value outside GREEN, YELLOW, RED (CORRECTION-003 F1) and on any
    production_touched other than false (AUDIT-CORRECTION-006 A6-F1). Each
    folded step is checked with validateState().
  no_activation_no_safety: >
    Authority naming programme or programme_action stops the fold. The fold
    never touches safety, platform_programme or contradictions.
  credit: CHECKPOINT credits only members of KEYFLOWOS_PROGRAMME_DAG.yaml; meta packets stay at zero.
  wiring: >
    truth.reconcileWithTruth reads #80, folds, reads repository truth for the
    effective projection, and calls reconcileProjection. orchestrate decides on
    reconciliation.effective_state and journals onto the stored checkpoint.
    status --verify renders the effective projection, the checkpoint, the
    applied effects and any stop. Nothing writes the fold back.
  admission_binding: >
    C10-F2. evaluateAdmission() binds both control artifacts to the PR being
    admitted before it reads anything else from them: one non-blank packet id
    on both, implementation_branch equal to the PR head_ref, and a declared
    pr_number equal to the PR's. A matching pair copied from another packet
    fails as control_artifacts_not_bound_to_pr. No packet id or branch is
    hard-coded. EXACT-BINDING-016: packet_id and implementation_branch are
    compared as written, so a value that differs from the PR only by
    surrounding whitespace is not bound. Trimming only decides whether a
    value is blank. The PR-number comparison is as it was.
    CONVERGED-CORRECTIONS-018 K3: an identity is a string. A packet id that
    is a number, boolean, mapping or list is packet_id_not_a_string, and a
    branch that is not a string is not the PR head_ref. Nothing is made into
    text, so 1 and "1" are not one identity. Any string is still a legal
    packet id.
  hold_resume_wake: >
    R12-K1, R13, R14. HOLD and RESUME are on the wake list of
    normalizeEvent(). Such a comment is actionable only when it is valid
    authority under the AUTHORITY profile, the reducer's own readEffect()
    reads HOLD_SET on a HOLD or HOLD_CLEAR on a RESUME (which also requires
    a packet id, production_touched false, canonical health and no programme
    field), the event action equals created exactly, and the payload shows
    the comment unedited. Any other HOLD or RESUME is non-actionable, and
    the normalized event records the reason in wake_refused and the effect
    in control_effect. events.mjs holds no effect vocabulary of its own.
    Whether the effect then folds is the fold's decision. The wake rules of
    the other message types, the workflow file and the worker selector are
    unchanged. CONVERGED-CORRECTIONS-018 K1: a claimed HOLD or RESUME that is
    refused because it is not authority records the reason in wake_refused
    too, as AUTHORITY_REJECTED (outside author, non-ChatGPT sender),
    AUTHORITY_MALFORMED (fails the AUTHORITY profile) or ENVELOPE_MALFORMED
    (repeated or badly quoted field), followed by exactly the problems that
    authority.problems or envelope_problems carry. Those structured fields
    are unchanged, and the effect of such a message is not read. A type that
    is not exactly HOLD or RESUME claims neither and carries no wake_refused.
  checkpoint_validation: >
    CHECKPOINT-VALIDATION-017. Once the anchor is found, reduceAuthority()
    checks the checkpoint with validateState(). One that fails is never
    folded from, with zero, one or many newer messages: the fold does not
    start (CHECKPOINT_INVALID, with checkpoint_problems) and reconcile()
    reports DERIVED_STATE_INVALID, so decide() returns REPORT_DRIFT.
    Unverifiable authority and a missing or unfound anchor are reported
    first, as before. The per-step validation is unchanged.
  checkpoint_shape: >
    CONVERGED-CORRECTIONS-018 K2. normalizeState() defaults a container only
    when its key is absent. One that is present with the wrong structural
    type is returned exactly as written, and validateState() rejects it as
    CHECKPOINT_SHAPE_INVALID, reported alone because every other check reads
    through the containers. Mappings: programme, momentum, correction,
    agents, holds, and the legacy hold (a mapping or null). Lists:
    programme.checkpointed, unresolved_contradictions, processed_event_keys,
    event_journal. The document itself is a mapping. An explicit null is
    present and wrong; an empty document, and a document without these keys,
    load with the defaults as before. status.mjs reads the checkpoint lists
    only when they are lists and hasProcessed() answers false for a key list
    that is not a list, so such a checkpoint is reported as drift.
  checkpoint: >
    Re-derived whole at main 11053288 under RECOVERY-REANCHOR-015 and
    anchored, as EXACT-BINDING-016 ruled, to that REVIEW (5982685256),
    generation 81 of 81 at derivation (75 valid, 6 malformed). It replaces
    the checkpoint anchored to CONTRACT-CORRECTION-008 (5965390363), which
    itself replaced the one anchored to
    CG-DIRECTIVE-META-STATE-REDUCER-LIVE-001 (5963509515). It records 4/35
    application packets checkpointed, ACTION-001 held in holds, the platform
    programme INACTIVE_SUCCESSOR, every safety flag false, and this packet
    in FIXING_PROOF_FAILURES on PR 120. PR 104 is recorded under
    meta_package, and the KEY memory programme under
    meta_package.parallel_tracks as a zero-credit track that is no
    sequential state transition. Recovery is a reviewed re-anchor and never
    a skip: a malformed message newer than the anchor still stops the fold.

