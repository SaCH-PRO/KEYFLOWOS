    33540d0c07d2affd919246ebb5975ce0bef32109.

implementation:
  fail_closed_default: the executable set starts empty and is assigned once, after the loop has evaluated every parsed command
  atomic_batch: the catch assigns nothing, so a failure on a later command keeps no approved prefix
  unusable_verdict: >
    isUsableAutonomyVerdict requires an object with a boolean allowed, a
    boolean requiresApproval and a tier equal to manual, supervised or full.
    Anything else throws inside the loop and is handled as a failed authority
    check.
  no_oracle: >
    The local fallback verdict is allowed false, requiresApproval true and
    tier manual, so it stays an ordinary non-executable verdict with outcome
    evaluated.
  decision_expression: unchanged from source main
  evidence: STEP_5_CHECK_AUTONOMY gains outcome (evaluated or authority_check_failed_closed), authorityCheckFailed and authorityCheckError
  log: the catch logs at error level with the count of executable parsed commands; the old text about using all parsed commands is gone
  not_touched: AutonomyOrchestratorService, the genome bridge, the executor, streamQuery, schema, FLOW_TOOLS

