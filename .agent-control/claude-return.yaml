summary: >
  The hourly sweep lists its candidates through a new paged GraphQL lister
  instead of gh pr list, whose default page of 30 hid 14 of the 21 open
  impl/* PRs on 2026-10-24 while the job reported a clean run. The lister
  prints the impl/* numbers only after a complete, internally consistent
  enumeration; churn is retried once as a whole and otherwise fails the job
  before any evaluator runs; a duplicated page is never collapsed into
  success. Twenty-two lister tests, two workflow-step tests and four
  negative controls prove it. This pre-RETURN record claims no post-check
  result; exact_head_proof remains PENDING. The PR is draft, review_status
  stays PENDING_CHATGPT_REVIEW and no merge, ready transition or credit is
  granted.

