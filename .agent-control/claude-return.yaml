proof_matrix:
  - obligation: the real PR 177 chain shows a returned and consumed handoff with CHANGES_REQUIRED, six open findings and no merge grant
    evidence_scope: semantic_head
    proof: >
      fixtures/handoff-irp177.json holds the seven real #80 comments verbatim
      (6229439023 request, 6229470452 ACK, 6229520428 RETURN, 6229558462
      receipt, plus a ChatGPT PROGRESS and two autopilot events). The node
      spec, the endpoint spec, the loopback self-test and the browser proof
      each assert DECISION_RECORDED, review CHANGES_REQUIRED with 6 findings,
      merge NOT_GRANTED, decision classified EVIDENCE_ONLY, WORKING
      NOT_OBSERVED and worker UNKNOWN. The review head 8ecb7158 matches the
      request, and PR 177 has since moved to c03603c0, so the review shows as
      SUPERSEDED.
    result: PROVEN
  - obligation: wrong reference, recipient, PR or revision cannot give a successful handoff or review
    evidence_scope: semantic_head
    proof: node spec cases for another request id, no reference, another sender, another PR, a changed reviewed_head, an ack_ref naming another ACK and a reply posted before the request; NC-HANDOFF-WRONG-REFERENCE-ACCEPTED, NC-HANDOFF-WRONG-RECIPIENT-ACCEPTED and NC-HANDOFF-CHANGED-HEAD-ACCEPTED are live
    result: PROVEN
  - obligation: duplicates, out-of-order or edited events, and missed or deleted records cannot create false success
    evidence_scope: semantic_head
    proof: duplicated request and RETURN ids, duplicate deliveries and shuffled input (same projection), conflicting deliveries treated as an edit, an edited RETURN and an edited request, a deletion found by count check and full resync, and an older copy that never overwrites a newer one
    result: PROVEN
  - obligation: stale, partial, rate-limited and failed collection is reported honestly
    evidence_scope: semantic_head
    proof: partial page with no prior snapshot (PARTIAL, no success time), failure after success (DEGRADED, then STALE, success time kept), rate limit backoff with no further requests, 304 without event-time or generation change, page bound never COMPLETE, restart starts empty; NC-HANDOFF-STALE-TIME-LAUNDERED is live
    result: PROVEN
  - obligation: unauthorized access is refused before the service or its cache, cached reads included
    evidence_scope: semantic_head
    proof: >
      The endpoint spec runs the real AuthMiddleware, AuthGuard and AdminGuard:
      no credential, a bad bearer, an expired SUPER_ADMIN token, admin tokens
      with role USER and ADMIN, and a Supabase tenant owner are refused with
      401 or 403, and the service is not called, before and after a
      SUPER_ADMIN request warms the cache. NC-HANDOFF-ADMIN-GUARD-REMOVED and
      NC-HANDOFF-GUARDS-REMOVED are live (scripts/proof-admission runner, 5 and
      4 named tests failed).
    result: PROVEN
  - obligation: collection is GET-only, bounded and credential-safe
    evidence_scope: semantic_head
    proof: request allowlist cases, the live transport spec (method GET, redirect error, credential only in the header and absent from errors) and the service spec (one GET to api.github.com, credential absent from the response); NC-HANDOFF-NON-GET-REQUEST and NC-HANDOFF-REQUEST-ALLOWLIST-OPEN are live
    result: PROVEN
  - obligation: safe text rendering, unsafe source URLs and credential redaction
    evidence_scope: semantic_head
    proof: node spec for links and redaction; the browser proof renders the synthetic hostile fixture and finds no script, img or iframe, only github.com links of this repository, the payload shown as text, the credential-shaped string redacted and no injected global set; NC-HANDOFF-UNSAFE-SOURCE-LINK is live
    result: PROVEN
  - obligation: missing telemetry and return without receipt
    evidence_scope: semantic_head
    proof: worker UNKNOWN / NOT_CONNECTED in every snapshot; progress is last-observed with an age and liveness UNKNOWN; a RETURN without a receipt stays awaiting chatgpt across repeated monitor reads, in the node spec and in the browser
    result: PROVEN
  - obligation: merge authority is never synthesized
    evidence_scope: semantic_head
    proof: a PROGRESS claiming merge_authority true grants nothing, and a valid PACKET_ADMISSION REVIEW does; NC-HANDOFF-MERGE-GRANT-SYNTHESIZED is live
    result: PROVEN
  - obligation: the wired UI and API are exercised end to end with isolated fixtures
    evidence_scope: semantic_head
    proof: >
      apps/server/test/handoff-monitor-loopback.cjs boots only the compiled
      handoff route on 127.0.0.1 with the default native-import loader; its
