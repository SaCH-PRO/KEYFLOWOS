objective: >
  Turn the existing KEYFLOWOS agent-control protocol into executable unattended
  orchestration so the human is no longer the message relay between ChatGPT, Claude,
  reviewers, GitHub and CI. The 35-packet programme and every safety boundary are
  preserved; this meta-package earns zero packet credit.

design_principle: >
  Maximum autonomous throughput SUBJECT TO invariant preservation. The orchestrator
  must know when it is allowed to move, and must fail closed on ambiguity.

