    - a live negative control so restoring the defect fails
    - portable, Windows, mutation, exact-head CI, fresh Copilot review, superseding RETURN
  constraints:
    - no merge, activation, ACTION-001 release, scope broadening, gate weakening
    - no production/provider traffic, secrets, OAuth, paid resources or programme-state re-anchor

