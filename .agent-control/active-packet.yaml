objective: >
  Make the hourly sweep's candidate list complete. The scheduled reconcile
  listed open pull requests with gh pr list, which returns its default page
  of 30, so impl/* PRs beyond the 30 newest were never evaluated and the
  job reported a clean run. The candidates now come from a paged GraphQL
  enumeration that prints nothing unless it is complete and internally
  consistent. The evaluator, the recorder, the lock and every trigger and
  permission stay as they are.

live_defect:
  where: .github/workflows/agent-control-autopilot.yml, job hourly-reconcile-open-prs, the listing line
  evidence: scheduled run 40079991941 (2026-10-24T08:56Z) evaluated PRs 179, 168, 162, 161, 160, 158 and 155, the 7 impl/* heads among the 30 newest of 52 open PRs; the other 14 impl/* PRs were never evaluated
  effect: a scheduled sweep that cannot see every open implementation PR reports success having reconciled a subset

bounded_guarantee: >
  Completeness is relative to one internally consistent enumeration, not
  to a transactional snapshot. Equality between the nodes collected and
  the API's totalCount, no PR number or cursor seen twice, and a stable
  totalCount across pages are evidence of one consistent read. A PR opened
  or closed between pages shows as churn: the whole enumeration is retried
  once, and a remaining inconsistency fails the job before any evaluator
  runs. A duplicated page is never collapsed into success. Each per-PR
  evaluator still rechecks live eligibility, head and base at execution.

allowed_scope:
  - .github/workflows/agent-control-autopilot.yml: the one listing line in the hourly step and its explanatory comments; nothing else in the file
  - scripts/agent-control/list-open-impl-prs.mjs: new paged, validated, consistency-checked lister
  - scripts/agent-control/tests/list-open-impl-prs.spec.mjs: new injected-fetch proofs
  - scripts/agent-control/tests/autopilot-workflow.spec.mjs: the listing stub and the listing tests only; every existing proof kept
  - scripts/agent-control/negative-controls.yaml: the existing listing-failure control retargeted to the new line, and four new controls, for 251
  - docs/development/AGENT_AUTOPILOT.md: a small accurate note on candidate enumeration and its bounded guarantee
  - .agent-control/active-packet.yaml and .agent-control/claude-return.yaml of this packet

prohibited_scope:
  - gh pr list --limit, gh api --paginate, or any listing that emits candidates before the enumeration is complete
  - auto-merge-admitted.mjs, record-auto-merge.mjs, lib/admission.mjs, lib/merge-grant.mjs, F9 authority semantics, the mutation lock, any trigger or permission, any other workflow
  - PR 155 and its artifacts; any other packet's files; application or production code; packages
  - merge, auto-merge, manual dispatch of merge-capable automation, ready_for_review, HOLD release, production or provider effect, schema change, programme credit

invariants:
  - every existing control stays in the manifest, functional; the count rises from 247 to 251
  - a listing failure of any kind leaves zero evaluator calls and fails the job with the existing error line
  - the sweep on main keeps its current behaviour until a separately authorized merge

proof_obligations:
  - 52 open PRs over more than one page list every impl/* candidate, including those past the 30th
  - more than 30 open PRs on one page; zero impl/* candidates; deterministic ascending order
  - duplicate PR number, repeated cursor, inconsistent totalCount, malformed nodes, GraphQL errors, HTTP 502 on page two, null next cursor with hasNextPage, the page cap: each fails with nothing on stdout
  - the workflow step evaluates nothing when the listing fails, evaluates every listed PR when it succeeds, and never lists through gh
  - the four new negative controls are live and name the test each fails; the hosted Windows manifest reports 251 of 251 live
  - the five required workflows at the final artifact head, with their real skips and security disclosures

stop_conditions:
  - main moves from b1948d27 before the push
  - the branch is claimed by another writer, or a HOLD applies
  - any existing control goes vacuous or any existing test fails
  - the change would need a job, trigger, permission or evaluator change to work

