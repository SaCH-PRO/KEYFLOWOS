objective: >
  Make the hourly sweep's candidate list complete. The scheduled reconcile
  listed open pull requests with gh pr list, which returns its default page
  of 30, so impl/* PRs beyond the 30 newest were never evaluated and the
  job reported a clean run. The candidates now come from a paged GraphQL
  enumeration that prints nothing unless it is complete and internally
  consistent, and the lister ends naturally so that what it prints drains
  into the pipe before the process ends. The evaluator, the recorder, the
  lock and every trigger and permission stay as they are.

live_defect:
  where: .github/workflows/agent-control-autopilot.yml, job hourly-reconcile-open-prs, the listing line
  evidence: scheduled run 40079991941 (2026-10-24T08:56Z) evaluated PRs 179, 168, 162, 161, 160, 158 and 155, the 7 impl/* heads among the 30 newest of 52 open PRs; the other 14 impl/* PRs were never evaluated
  effect: a scheduled sweep that cannot see every open implementation PR reports success having reconciled a subset

bounded_guarantee: >
  Completeness is relative to one internally consistent enumeration, not
  to a transactional snapshot. Equality between the nodes collected and
  the API's totalCount, no PR number or cursor seen twice, and a stable
  totalCount across pages are evidence of one consistent read. A PR opened
  or closed between pages shows as churn: the whole enumeration is retried
  once, and a remaining inconsistency fails the job before any evaluator
  runs. A duplicated page is never collapsed into success. Each per-PR
  evaluator still rechecks live eligibility, head and base at execution.

