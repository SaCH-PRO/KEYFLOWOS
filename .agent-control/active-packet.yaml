objective: >
  Harden the local Claude worker that merged in PR #87 so it can be restarted
  safely: platform-correct Linux + Windows proof, authenticated directive
  dispatch, bounded retry, and a dedicated worktree per wake. Carries the
  W0-W3 fixes and the YAML escape correction from PR #88 with their
  provenance intact.

authorized_scope:
  - id: WORKER-CI-PLATFORM-001
    obligation: >
      Portable control-plane proofs on Ubuntu; Windows-only worker, install and
      uninstall proofs on windows-latest, failing rather than skipping off
      Windows. The Windows job is required admission evidence.
  - id: WORKER-DIRECTIVE-AUTHORITY-001
    obligation: >
      A DIRECTIVE or REVIEW is actionable only with sender exactly chatgpt AND a
      GitHub comment author in the allowlist [SaCH-PRO]. Missing, claude, other
      and forged senders, AUTO_EVENT and plain text are rejected.
  - id: W6
    obligation: >
      Two materially identical failed attempts on one directive stop automatic
      retries, hold the directive as HELD_RETRYABLE (not processed), escalate
      once, and need a new directive or an explicit operator release.
  - id: W7
    obligation: >
      Every wake runs in a dedicated git worktree keyed by directive, never in
      the interactive checkout. Cleanup never deletes uncommitted or unpushed
      work.
  - id: PR88-CARRY
    obligation: W0-W3 worker fixes and the YAML escape correction, provenance kept
  - id: PROOF-AND-CONTROLS
    obligation: tests, negative controls, docs and control artifacts needed to prove the above

prohibited:
  - merge of this PR or of PR 88
  - restarting the autonomous worker
  - ACTION-001 work of any kind
  - repository admin settings (branch protection, rulesets)
  - production mutation or provider traffic
  - weakening any gate, proof or negative control

invariants:
  - no worker-actionable message without sender chatgpt and an allowlisted GitHub author
  - a directive is recorded as processed only on an explicit completion marker
  - no third Claude invocation after two identical failed attempts on one directive
  - a woken session never runs in the interactive checkout
  - worker cleanup never removes uncommitted or unpushed work

proof_obligations:
  - exact-head CI/CD Pipeline, Branch divergence, DAST (HawkScan) green
  - exact-head Agent Control Gate required and green
  - exact-head portable Ubuntu proof and Windows worker proof green
  - senderless, claude-authored and forged non-allowlisted directives rejected
  - sender chatgpt from SaCH-PRO accepted and wakes exactly once
  - two identical blocked attempts, then held, one escalation, no third invocation
  - a changed blocker signature permits a new bounded attempt
  - worktree path distinct from the interactive checkout
  - cleanup never deletes uncommitted work
  - worker is a no-op unless the hardened install is in place
  - installer ScheduledTask path resolvable on Windows; non-elevated fallback explicit and reversible
  - 14+ negative controls live, none vacuous

stop_conditions:
  - any new architecture ambiguity
  - inability to isolate background work safely on Windows
  - any required permission outside the bounded gh/git/node/file-tool allowance
  - any production or provider action

held_packets:
  - packet_id: KF-EXEC-ACTION-001
    hold_message_id: CG-HOLD-ACTION-AUTO-001
    branch_cut: false
    local_work: none
    resume_condition: explicit CG-RESUME-ACTION-* after KF-META-AUTO-001 is checkpointed
