objective: >
  Implement the first bounded adoption of the canonical
  Capability -> Control -> Clearance -> ExecutionClaim -> OutcomeEvidence
  boundary for helpdesk_create_ticket only.

allowed_scope:
  - helpdesk_create_ticket only, on every reachable surface (E1 to E11 of the accepted characterization)
  - the shadow decision path beside current oversight, with parity and differences proved
  - persistence for the envelope, control evidence, execution claim and outcome evidence, reusing or extending an existing semantic owner where one is coherent
  - withdrawal of legacy execution bypasses for this capability after proof
  - tests, real-DB proof and negative controls for the above
  - architecture maps for the seams this touches

prohibited_scope:
  - production deployment or mutation
  - provider traffic
  - migration of a second capability family
  - platform programme activation
  - forensic rebaseline
  - programme-map refresh without separate authority
  - silent resolution or dropping of D1 to D8
  - weakening an existing gate or proof obligation
  - merge without a later exact-head ChatGPT admission
  - CapabilityRegistry2, or a wrapper identity replacing the real capability identity
  - a client-resubmitted approval identity, or an approval boolean treated as Clearance
  - the authenticated human REST helpdesk create-ticket route (W3) routed through the KEY action boundary
  - W2 transfer_to_human migrated as helpdesk_create_ticket

architecture_decisions:   # CG-REVIEW-ACTION-001-CHARACTERIZATION-ACCEPT-001
  Q1: a surface without a trusted human or service principal may enter the boundary but receives no executable Clearance for this tier-2 action; it fails closed or produces a human-action proposal
  Q2: option (a); re-read and lock the exact authority dependencies inside the transaction that admits the ExecutionClaim and writes the SupportTicket; covers Membership role/tier and the owner/no-Membership path
  Q3: W2 transfer_to_human is a distinct capability identity; explicit VOICE/WITHDRAW follow-on work
  Q4: E4 may be routed into the boundary for proof; execution is denied until stream authentication provides a trusted business and actor binding
  Q5: the authenticated human REST create-ticket route stays outside the KEY action boundary
  Q6: D1 and D8 to VOICE; D3, D4 and D6 to an AUTH/TENANT backward re-audit; D2, D5 and D7 are ACTION follow-on findings; none is resolved by this slice

invariants:
  - capability identity is resolved from the real CapabilityContract; EXECUTE_TOOL or a wrapper never substitutes for it
  - material parameters are built server-side, canonicalized, frozen and bound to a deterministic cryptographic fingerprint (title, description, contactId, priority and the resolved source semantics at minimum)
  - the ControlRequirement is derived from capability, trusted principal authority, KEY autonomy/readiness, policy and execution surface; the risk tier is an input, not the requirement
  - ControlEvidence is server-issued, bound to the exact fingerprint and principal, and expires or becomes invalid when its material authority assumptions change
  - Clearance is computed at admission; Membership/owner authority and policy are re-read inside the claim transaction
  - the ExecutionClaim is an atomic insert-or-fail identity under a database uniqueness invariant; no check-then-act
  - the claim admission and the SupportTicket write share one transaction
  - success has durable OutcomeEvidence naming the actual SupportTicket id and the principal chain; failure is explicit; UNKNOWN is structurally impossible for this transactional effect
  - E4, E5, E9 and E11 enter the same boundary and cannot execute without a trusted eligible principal
  - E4 does not execute until trusted stream authentication exists

proof_obligations:
  - wrapper EXECUTE_TOOL resolves and governs as helpdesk_create_ticket
  - mutated parameters invalidate prior ControlEvidence
  - client-resubmitted confirmation toolName/toolArgs cannot execute
  - revocation or demotion before claim admission yields zero tickets
  - tightened policy or reduced autonomy forces reevaluation/rejection
  - concurrent N-way execution gives exactly one claim and one ticket
  - E3/E4/E5/E7/E8/E9/E10/E11 cannot bypass the canonical boundary
  - successful OutcomeEvidence names the actual SupportTicket
  - rollback/crash before commit remains safely retryable and non-duplicating
  - requestedBy/proposedBy/approvedBy/executedFor/executedBy are preserved wherever semantically applicable
  - each substantive invariant has a mutation/negative control that restores the defect and fails its intended proof; zero vacuous controls; no skipped required DB proof

out_of_scope_findings:
  voice_follow_up: [D1, D8]
  auth_tenant_backward_reaudit: [D3, D4, D6]
  action_follow_up: [D2, D5, D7]

stop_conditions:
  - the required invariant cannot be achieved without a new canonical primitive (CONTRADICTION)
  - any architecture decision not already made by the directive or the characterization review (CONTRADICTION)
  - production access or provider traffic would be required
  - a second capability family would have to be migrated

return_contract: >
  ACK before substantive work; branch from the exact source_main; map before
  modifying and enumerate the affected seams; report the exact semantic head
  and changed files; full applicable test suite; real-DB proof for the
  transactional and concurrency invariants; every negative control, none
  vacuous; architecture scanners where affected; live status/reconciliation;
  independent semantic review at the exact semantic head; the control artifact
  only after that review passes; RETURN once, with merge_authority false.
