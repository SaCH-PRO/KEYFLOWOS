invariants:
  - TENANT: every persisted and fetched contact and child row belongs to the requested business; cross-tenant behaviour unchanged
  - RECORD VISIBILITY: PRIVATE and owned records obey membership-level CRM visibility and sharing on the detail path exactly as on the list path, enforced BEFORE related events, notes, invoices or bookings are fetched
  - NO EXISTENCE DISCLOSURE: a forbidden record resolves exactly like a missing record (established not-found policy)
  - REUSE: resolveCrmAccess and visibilityClause are the only access semantics; no independent rule
  - INTERFACE: no new REST path or tRPC surface; consumers outside the write set keep their interface
