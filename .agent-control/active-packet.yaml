# As CG-DIR-HANDOFF-UI-001 declares it. Transcribed, not decided here.
review_status: PENDING_INDEPENDENT_REVIEW

objective: >
  H1 of issue #178: a protected, read-only owner-console viewer of the
  ChatGPT/Claude/GitHub handoffs on issue #80, at
  /admin/mission-control/handoffs, backed by a GET-only snapshot endpoint in
  the existing Mission Control owner (AdminPlatformModule) and one shared
  projector/collector under scripts/agent-control that reads #80 through the
  admitted control-envelope parser unchanged. Separately operator-authorized
  meta observability; not a node of the 35-packet DAG and not activation of
  PR 177.

allowed_scope:
  - focused handoff collector/projector modules and tests under scripts/agent-control
  - focused admin-platform service/controller/module wiring
  - the admin web route and components, typed API and one navigation link
  - synthetic or redacted fixtures, isolated UI proof and a short runbook
  - necessary accurate affected architecture scans and docs
  - per-PR active-packet and claude-return evidence

prohibited_scope:
  - changes to the existing parser, selector, reducer, admission or merge behavior
  - merges, the ready-for-review transition or auto-merge
  - production access including probes, live business databases, customer or provider effects, paid services, credentials, deployed secrets or deployments
  - worker installation or process changes, a heartbeat publisher, schedules, webhooks, external notifications
  - retry, release or action buttons
  - DAG, checkpoint or wave-board changes, and any gate weakening
  - changes to PR 155, 169, 175, 146, 172 or 177, and restarting halted OS cycles
  - .github/workflows, deployment configuration, the active checkpoint and existing directives or holds
  - enabling the monitor in hosted previews or supplying credentials there

invariants:
  - delivery stage, review outcome, revision validity, source freshness and merge authority are reported separately
  - an ACK never proves present liveness; without telemetry worker availability is UNKNOWN
  - a dashboard refresh is never ChatGPT's consumption of a RETURN
  - correlation uses explicit references; a missing or ambiguous reference stays unmatched
  - collection is GET-only, bounded and credential-safe; a failed or partial fetch never advances the last success time
  - unauthorized requests are refused before the service or its cache
  - nothing the monitor outputs is read as control authority

proof_obligations:
  - the real PR 177 chain displays a returned and consumed handoff with CHANGES_REQUIRED, six open findings and no merge grant
  - wrong reference, recipient or revision, duplicates, out-of-order or edited events, missed or deleted records, stale or error snapshots, cached authorization, XSS and unsafe URLs, missing telemetry and return-without-receipt are tested
  - the wired UI and API are exercised with isolated fixtures
  - negative controls restore wrong-reference acceptance, stale-time laundering and unauthenticated or cached leakage, and the named tests fail
  - applicable existing tests, builds, typechecks and the real architecture scanners run; skipped or unavailable proof is explained

stop_conditions:
  - a material baseline or scope revision change, or another active claim of this task (CONTRADICTION)
  - incompatible auth or a needed platform rewrite (stop for scope review)
  - production access, provider traffic or credentials would be required

return_contract: >
  Push ordinary commits, open one DRAFT PR, and RETURN with the PR, head and
  semantic SHA, the tests and negative controls actually run, reproducible
  local UI proof, run instructions, remaining limits and exact-head CI status,
  leaving review pending, programme credit zero and merge authority false.
