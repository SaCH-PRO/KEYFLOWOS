correction_001:   # CG-REVIEW-META-STATE-REDUCER-LIVE-CORRECTION-001
  C1: >
    Holds are packet-scoped, not globally singular. HOLD_SET / HOLD_CLEAR are
    bound to packet_id; a duplicate incompatible hold for the same packet fails
    closed; HOLD_CLEAR without a matching active hold fails closed; a hold on A
    never makes a valid effect for unrelated B malformed. Use a deterministic
    packet-keyed representation and preserve the ACTION-001 hold.
  C2: >
    Authority generation never renumbers later events. Generation identity is
    stable under replay and fail-closed validation, with invalid or malformed
    candidates consuming their position. Add a negative/replay test proving no
    renumbering when an earlier event becomes malformed or edited.

