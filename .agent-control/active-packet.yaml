  - real-database integration test over real membership, Contact visibility and persistence, through the HTTP guard path, without mocking the authorization boundary
  - matrix: OWNER/ADMIN, STAFF view-all with another's TEAM, STAFF owned-view, PRIVATE owned and foreign, explicit shares, no membership, read-only scope, another tenant, deleted contacts, sensitive linked child rows; forbidden detail fails while permitted list/detail remain consistent
  - existing crm.e2e.test.ts mocked behaviour kept explicitly separate from real-DB proof; focused existing tests, typecheck, lint with honest NOT_RUN disclosures
  - exact first failure, tests, branch/commit SHAs, evidence, scope ledger, remaining blocked CT-P01..CT-P12 recorded in the RETURN
