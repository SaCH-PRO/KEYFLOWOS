objective: >
  Repair existing finding F9 (main's claude-return.yaml; reproduced in
  docs/intelligence/sessions/2026-10-17-p0-safety-review at 11971802). A
  readiness status, a semantic PASS, a green workflow or a builder-written
  merge_authority flag is never by itself merge authority. The exact-head
  admission evaluator, its second-snapshot recheck and the non-draft gate
  step must also require one distinct, valid, current ChatGPT grant on #80,
  bound to the repository, PR, packet, branch, semantic head, final artifact
  head and base, through one shared predicate.

target_contract:
  grant: >
    a valid AUTHORITY-profile REVIEW on this repository's issue #80, from an
    allowlisted account, in an unedited and completely observed collection,
    carrying merge_authority: true, review_status: READY_TO_MERGE, a readable
    control_effect of NO_STATE_CHANGE or PACKET_ADMISSION, and exact values
    for pr_number, pr_head (final artifact head), source_head (semantic head),
    source_main (base), packet_id and implementation_branch
  supersession: >
    a later valid or malformed authority message about the same PR, packet or
    branch voids the grant; a later grant replaces it
  holds: >
    a HOLD for the packet with no later RESUME for it denies, whether it came
    before or after the grant; holds on other packets do not apply
  not_a_grant:
    - ACCEPT_FOR_ADMISSION
    - a semantic PASS
    - NO_STATE_CHANGE alone
    - the artifact merge_authority field
    - a global READY_TO_MERGE projection (not required either)

allowed_scope:
  - scripts/agent-control/auto-merge-admitted.mjs
  - scripts/agent-control/lib/admission.mjs
  - scripts/agent-control/lib/merge-grant.mjs (the one shared grant helper)
  - their tests, helpers and synthetic/redacted fixtures under scripts/agent-control/tests
  - the non-draft admission step of .github/workflows/agent-control-gate.yml, and the read-only issues permission that step needs to read #80
  - focused entries in scripts/agent-control/negative-controls.yaml
  - affected architecture and control-contract documentation
  - this branch's two packet artifacts

prohibited_scope:
  - the #80 parser, the typed effect vocabulary, the global projection contract, the programme DAG and the checkpoint
  - PRs 155, 179, 169, 175, 146, 172 and 177
  - merge, ready-for-review, auto-merge enablement
  - production, live business data, provider traffic, credentials, deployment
  - worker, process, install, scheduler, webhook or notifier changes
  - editing or deleting any #80 comment
  - weakening a gate or removing an existing negative control

invariants:
  - every existing admission denial keeps its reason; the grant is an additional requirement
  - independent semantic-review failover, artifact binding, current base, control-only tail, workflow freshness and transition checks stay as they are
  - the non-draft gate does not run the full evaluator, so it never waits for its own run
  - the grant names the final artifact head after that artifact exists; the artifact never names the grant
  - unverifiable, edited, unordered or ambiguous authority denies

proof_obligations:
  - rejecting cases for absent, false, null, malformed, forged, edited, stale, revoked and mismatched grants
  - ambiguous or incomplete authority evidence, active holds, wrong repository/PR/packet/branch/semantic head/artifact head/base, moved head or base
  - missing independent review, pending/owed/failed workflows, a grant changed between snapshots, ACCEPT_FOR_ADMISSION without a later grant
  - preserved valid application and meta grants (the PR 159 grant 6111001643 shape), unrelated active-packet separation, review failover, control-only lineage
  - the real CLI collector and recheck under a synthetic fetch with no network passthrough
  - live negative controls; the full portable suite; the Windows worker proof; both DAG validators; artifact checks; exact-head workflows

stop_conditions:
  - main moves off source_main, or newer authority changes the release (CONTRADICTION)
  - the correction needs scope beyond allowed_scope (CONTRADICTION for that work only)
  - production access or provider traffic would be required
