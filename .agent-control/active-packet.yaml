objective: >
  Implement one canonical deterministic fail-closed Issue #80 control-envelope
  parser and migrate every authority consumer to it so healthy repository and
  authority truth can be re-derived without human relay.

decision:
  c1: OPTION_T
  parser_contract: >
    One canonical parser module with two named validation profiles. AUTHORITY
    is the shared syntax/provenance/order/edit/duplicate/quoting/comment
    contract used by reconcile, selector, event normalization and all
    authority readers. ACTIVATION is an additive stricter profile used only for
    platformProgrammeState activation and preserves the existing packet-state,
    GREEN/YELLOW/RED and non-null activation requirements.
  d1: minimum read-only workflow plumbing for the decide step; GH_TOKEN from github.token; least privilege; no new credentials, PATs, secrets, provider access or write scopes
  d2: DERIVED_STATE_STALE_AUTHORITY may remain; do not re-anchor programme-state.yaml in this packet
  d3: migrate select-directive.ps1 to the shared parser through a thin wrapper preserving its I/O contract and fail-closed behaviour
  d4: edited allowlisted authority comments fail closed as AUTHORITY_EDITED; no deletion recovery from snapshot evidence

required_consumers:
  - scripts/agent-control/lib/events.mjs
  - scripts/agent-control/lib/reconcile.mjs
  - scripts/agent-control/lib/platform-dag.mjs
  - any selector/orchestrator authority-reading path

authority_profile:
  - sender exactly chatgpt
  - authorized GitHub author relationship preserved
  - recognized authority message_type
  - message_id non-null
  - packet_id non-null
  - required envelope keys present; null permitted where historical authority requires it
  - repeated top-level keys rejected
  - malformed or unmatched quoting rejected
  - YAML inline comments handled consistently with repository YAML codec
  - edited authority comments fail closed
  - deterministic auditable ordering
  - stale/forged/unreadable/ambiguous authority fails closed

activation_profile:
  - existing state vocabulary unchanged
  - existing GREEN/YELLOW/RED health vocabulary unchanged
  - existing activation-required fields remain non-null
  - existing platform activation negative controls remain live

required_proof:
  - shared parser is sole parser for authority envelopes
  - all required consumers use the same AUTHORITY semantics
  - ACTIVATION remains strictly additive and current negative controls still fail on broken variants
  - D1 workflow token/read-permission fix proves live repository/issue reads
  - AUTHORITY_UNVERIFIABLE and REPO_TRUTH_UNVERIFIABLE disappear when evidence is actually readable and valid
  - DERIVED_STATE_STALE_AUTHORITY may remain if projection anchor is stale and must not be mislabeled green
  - negative controls cover edited comments, duplicates, invalid-first repeats, inline comments, unmatched quotes, sender case drift, missing fields, forged author, stale anchor, unreadable input and ambiguous ordering
  - restored defects make their relevant tests fail
  - exact-head CI, portable/Windows proof, mutation controls, AI review and finding disposition all pass
  - no production, provider traffic, secrets, paid resource, activation, ACTION-001 release or gate weakening

constraints:
  - keep ACTION-001 held
  - KEYFLOWOS_PLATFORM_CONVERGENCE remains INACTIVE_SUCCESSOR
  - do not wire or activate KF-PLAT-AUTO-001
  - do not weaken existing gates
  - no production/provider traffic
  - no secrets
  - no merge by Claude
  - one active implementation lineage only

