objective: >
  Correct the live KeyCortex parsed-command autonomy failure path so any
  authority evaluation error or unusable verdict fails closed to zero
  executable parsed commands while preserving normal informational response
  behavior and existing allowed/denied semantics.

live_defect:
  source_file: apps/server/src/modules/key-cortex/key-cortex-query-pipeline.service.ts
  source_blob: 33540d0c07d2affd919246ebb5975ce0bef32109
  current_behavior: >   # characterized main baseline from the original directive, before this packet correction
    autonomyCheckedCommands is initialized from parsedCommands. If the autonomy
    evaluation loop throws, the catch logs "Autonomy check failed, using all
    parsed commands" and leaves the original parsed set executable. Later,
    when actions/v2/executor are active, executeBatch receives that set.
  violated_invariant: Authority uncertainty/error may only narrow capability, never widen it.

hard_invariant: >
  authority_check_error => post-error executable parsed-command set is empty.
  More generally, authority uncertainty/error may never increase the executable
  capability set.

required_semantics:
  fail_closed_default: >
    The executable parsed-command accumulator begins empty/non-executable.
    Parsed commands become executable only after a successful explicit allow
    verdict that does not require approval and does not carry command-level
    requiresApproval.
  atomic_batch_failure: >
    If autonomy evaluation throws or returns an unusable value for any parsed
    command in this batch, zero parsed commands from the batch may execute.
    Do not preserve a partially approved prefix.
  unavailable_oracle: >
    Preserve the existing no-oracle behavior as non-executable. Do not invent
    authority or treat absence of an authority oracle as approval.
  informational_survival: >
    An authority-check failure must not unnecessarily destroy the conversational
    response. Model/informational response may continue with zero parsed-command
    effects.
  allowed_path: >
    A command receiving the existing explicit allowed/non-manual verdict and
    not requiring command approval continues to the same existing execution path.
  denied_path: A denied/manual/approval-required command remains non-executable.
  honest_observability: >
    The logger and STEP_5_CHECK_AUTONOMY evidence must distinguish an authority
    evaluation failure/fail-closed degradation from authorization success.
    Do not summarize a checker exception as zero ordinary denials or as success.

allowed_scope:
  - apps/server/src/modules/key-cortex/key-cortex-query-pipeline.service.ts
  - apps/server/src/modules/key-cortex/__tests__/key-cortex-query-pipeline.service.spec.ts
  - scripts/proof-admission/manifests/auth-fail-closed-001-negative-controls.json
  - .agent-control/** only for the existing packet control artifacts
  - no other semantic/runtime file unless a concrete compile/test dependency makes it unavoidable; if so stop and post CONTRADICTION before widening

