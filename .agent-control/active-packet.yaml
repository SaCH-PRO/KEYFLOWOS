objective: >
  Make AI pull-request review a mandatory exact-head admission input. Every PR
  and every semantic head change triggers an AI review or a deterministic
  re-review request, and admission stays blocked until the current semantic
  head has a completed, machine-attributable AI review with zero undispositioned
  substantive findings, plus every existing repository prerequisite.

review_priority:
  non_blocking: [style, formatting covered by lint/format, cosmetic refactors without production risk]
  focus: [architecture boundaries, business-logic invariants, security, authn/authz/tenancy/privilege, payments/idempotency/money state, deletion/destructive migration, SQL injection, N+1/unbounded queries, transactions/races/retries, edge cases/partial failure/replay, API/schema drift, secrets/PII/logging, runtime failure modes]

high_risk_surfaces: [auth, authorization, tenancy, payments, billing, refunds, data deletion, destructive migrations, production configuration, deployment/control-plane authority, external provider side effects]

required_behavior:
  - every opened PR gets AI review automatically
  - every draft->ready transition gets AI review automatically
  - every semantic push invalidates prior AI review evidence and triggers a fresh exact-head review
  - inline comments for actionable findings; durable PR-level summary with exact head SHA, severity, finding ids, disposition
  - no substantive finding disappears without RESOLVED or REJECTED_WITH_EVIDENCE
  - fail closed when the reviewer is unavailable, stale, ambiguous or cannot prove the reviewed SHA
  - reviewer identity machine-verifiable; human prose and github-actions[bot] cannot spoof a passing review

authorized_scope:
  - .github/copilot-instructions.md (consolidated repository-wide reviewer policy; reconciles PR #90)
  - AGENTS.md review-guidelines section (Codex review surface)
  - new AI review gate / request workflows under .github/workflows/
  - scripts/agent-control/** additions for the gate evaluator, request logic and tests
  - admission wiring (scripts/agent-control/lib/admission.mjs) and AGENT_AUTOPILOT_POLICY.yaml required gate list
  - new docs/development/AI_PR_REVIEW_GATE.md
  - .agent-control/active-packet.yaml, .agent-control/claude-return.yaml

prohibited_scope:
  - files claimed by PR #93 (AGENT_CONTROL_PLANE.md, AGENT_AUTOPILOT.md, KEYFLOWOS_* programme docs, platform-dag.*, architecture/*.json|md edits there)
  - envelope parsing in events.mjs / reconcile.mjs / platform-dag.mjs (KF-META-CONTROL-PARSER-001)
  - merge; repository settings/ruleset mutation; production/deployment/provider traffic; secret or OAuth entry; paid resources
  - weakening any existing check, reviewer, branch rule, security gate or divergence threshold
  - any review loop that can approve itself; github-actions[bot] impersonating an AI reviewer

proof_obligations:
  - PR open causes review request/trigger
  - draft->ready causes review request/trigger
  - semantic push causes fresh exact-head review and stale prior review is rejected
  - non-semantic/no-op update does not create an uncontrolled review storm
  - missing reviewer result blocks admission
  - reviewer result for old SHA blocks admission
  - unresolved HIGH/MEDIUM or otherwise substantive finding blocks admission
  - auth/payment/data-deletion fixture surfaced as high-risk
  - N+1/SQL-injection/business-logic/unhandled-edge fixtures detected by review instructions or recorded reviewer fixtures
  - style-only issue does not independently block admission
  - existing required CI/agent-control/security checks remain required
  - inline finding + PR summary evidence durable and exact-head attributable
  - code-review mechanism changes receive independent AI review before admission

stop_conditions:
  - implementation would touch PR #93 files or parser-packet surfaces -> CONTRADICTION with smallest non-conflicting sequence
  - enforcement requires repository-settings/ruleset mutation -> record as authority-gated activation step, do not perform
  - evidence contradicts a packet assumption -> CONTRADICTION and stop affected work
