objective: >
  Contacts pilot, bounded row-level visibility security correction only. Make an
  ordinary STAFF member who can access the CRM module but is not authorized to
  view another person's PRIVATE or unshared owned contact fail closed on GET
  contact detail, while preserving legitimate OWNER, admin, TEAM, SHARED, owned,
  explicitly shared and cross-tenant behaviour. The gap is code-confirmed on main
  b1948d27: the GET detail route calls CrmStatsService.contactDetail without
  actor identity, and its assertContact filters by businessId, id and deletedAt
  only. This packet does not advance the 35-packet programme, reset the active
  AUTH packet, grant a merge, approve a deployment or alter any worker lock.

