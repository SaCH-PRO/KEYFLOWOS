proof_obligations:
  AUTH-FC-P01_EXCEPTION_NARROWS: >
    With one or more parsed executable commands present, autonomy evaluation
    throws; executorService.executeBatch is not called and zero parsed commands
    execute.
  AUTH-FC-P01B_UNUSABLE_NARROWS: >
    An unusable/malformed autonomy verdict on the executable parsed-command path
    also leaves zero parsed commands executable.
  AUTH-FC-P02_MUTATION_CONTROL: >
    Restore the historical fail-open initialization/behavior using the existing
    application proof-admission negative-control runner. The specifically named
    AUTH-FC-P01 proof must then fail by assertion, not compilation, timeout or
    unrelated suite failure.
  AUTH-FC-P03_CONVERSATION_SURVIVES: >
    The same authority failure still permits a normal non-effect informational
    response to complete.
  AUTH-FC-P04_ALLOWED_UNCHANGED: >
    A valid allowed command retains its existing successful path to the executor.
  AUTH-FC-P05_DENIED_UNCHANGED: >
    Denied/manual/approval-required commands remain non-executable.
  AUTH-FC-P06_HONEST_EVIDENCE: >
    STEP_5_CHECK_AUTONOMY and/or its directly associated structured evidence
    identifies fail-closed authority-check degradation. A restored fail-open
    path must not satisfy this proof.

