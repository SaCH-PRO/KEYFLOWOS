objective: >
  Let the semantic-review evidence contract recognize the wording GitHub's
  Copilot bot has posted since 2026-10-24 when it cannot review for quota,
  "insufficient remaining quota", as the existing machine reason
  quota_exhausted, beside the older "reached their quota limit". Nothing
  else about the contract changes: identities, heads, citations, the
  fallback rule and the fail-closed defaults are as they were.

live_defect:
  where: scripts/agent-control/lib/semantic-review.mjs, COPILOT_NOT_RUN_REASONS
  evidence: PR 155 reviews 5636247931 (at 65832bc6) and 5636727516 (at 02bf32b9), both "Copilot was unable to review this pull request because the user who requested the review has insufficient remaining quota."
  effect: copilotReviewEvidence derives reason null for those bodies, so evaluateSemanticReview answers not_run_reason_not_evidenced for a truthful quota record and the approved ChatGPT fallback cannot be judged live

allowed_scope:
  - scripts/agent-control/lib/semantic-review.mjs: one new entry in COPILOT_NOT_RUN_REASONS and the comment above it
  - scripts/agent-control/tests/semantic-review.spec.mjs: bounded tests for the new wording, near-match wordings, a body without "unable to review", impostor, uncited and wrong-head evidence, and the PR 155 record
  - scripts/agent-control/negative-controls.yaml: exactly one new control that removes the entry and names a test that then fails
  - docs/development/AGENT_CONTROL_PLANE.md: only if a contract note became inaccurate (none did; not touched)
  - .agent-control/active-packet.yaml and .agent-control/claude-return.yaml of this packet
  - under CG-REV-AI-REVIEW-QUOTA-WORDING-001, those two artifacts only: the top-level semantic_review admission record, lineage, receipts and retained disclosures
  - under CG-REV-AI-REVIEW-QUOTA-WORDING-ADMISSION-002, those two artifacts only: the bare review_status value, lineage and receipts, the retained f2a7db95 outcomes and disclosures

prohibited_scope:
  - any keyword-only or inferred quota matcher; any new reason vocabulary
  - evaluateSemanticReview, reviewer identity, commit or URL checks, lib/admission.mjs, lib/merge-grant.mjs, the gate workflow, the autopilot workflow
  - PR 155 and its artifacts; any other packet's files; application or production code; packages
  - merge, auto-merge, ready_for_review, HOLD release, production or provider effect, schema change, programme credit

invariants:
  - every existing control stays in the manifest with its target unchanged; the count rises from 247 to 248
  - the old wording still derives quota_exhausted; an unknown unavailable body still derives no reason
  - a fallback PASS still needs live, cited, matching primary-unavailable evidence at a head that carries the admitted semantics

proof_obligations:
  - the new wording from a correctly identified bot derives status NOT_RUN and reason quota_exhausted
  - the older wording still derives quota_exhausted
  - an unknown "unable to review" body derives reason null
  - a near-match wording derives null; a body lacking "unable to review" is a review that ran, not unavailability
  - an impostor account, an uncited or wrong-head citation and a wrong recorded reason cannot authorize the fallback
  - PR 155's real record with live-shaped evidence satisfies the evidence contract's predicate alone, carrying no admission or merge verdict
  - the new negative control is live and non-vacuous; the hosted Windows manifest reports 248 of 248 live
  - the five required workflows at the final artifact head, with their real skips and security disclosures
  - the top-level semantic_review record satisfies the evidence contract's predicate against live evidence at the head that carries it (the predicate alone; admission is a separate decision)

