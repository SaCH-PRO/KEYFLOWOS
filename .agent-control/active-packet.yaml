mandatory_characterization_before_edits:
  - docs/development/AGENT_CONTROL_PLANE.md
  - docs/development/EXECUTION_CONTROL_STANDARD.md
  - CLAUDE.md and root AGENTS.md
  - .agent-control schemas/examples and agent-control-gate.yml
  - branch-divergence and ordinary CI workflows
  - issue #80 message protocol and current control artifact shapes
  - architecture/os/OS.md — HALTED constraints ONLY, no cycle resumed
  - GitHub-native triggers for PR, workflow, issue-comment and scheduled events
  - deterministic in-repo vs external model/credential boundary
  - Claude / ChatGPT-OpenAI / Kimi-Codex adapter invocation without a canonical vendor
  - surface contradictions before semantic implementation

architecture_constraints:
  - repository remains the durable source of control evidence
  - one canonical packet contract across all agents
  - no agent self-approval
  - deterministic code decides mechanical transitions; models decide bounded semantic roles only
  - architecture contradictions stop advancement
  - external research/innovation suggestions become proposals, never silent code changes
  - no competing dynamic programme state stores
  - event handling must be idempotent and concurrency-safe
  - exact PR/head/main identities carried through every admission action
  - all automatic actions auditable back to event + rule + evidence
  - automation failure must not weaken existing manual gates

