required_progress_before_implementation:
  - exact file/workflow inventory
  - proposed state/event schema
  - canonical dynamic-state decision
  - agent adapter plan and credential requirements
  - concurrency/idempotency design
  - any contradiction or platform limitation

stop_conditions:
  - requires making issue #80 non-auditable or replacing repository evidence with ephemeral state
  - requires an agent to approve its own semantic work
  - requires production credentials/data
  - requires weakening branch/CI/agent-control gates
  - GitHub event model cannot support a required invariant without a new approved service
  - external agent invocation requires an unapproved credential or paid service
  - any ambiguity over who owns architecture/admission decisions

