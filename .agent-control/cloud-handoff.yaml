decisions:
  - Keep Phase 1 cloud dispatch strictly read-only and draft-only with zero merge or production authority.
  - Require authenticated authority and clearance evidence bound to the SHA-256 immutable task contract digest; strictly separate read-only PR-event identity (READ_ONLY_EVENT_IDENTITY) from mutating authorization (CRYPTOGRAPHICALLY_SIGNED / INDEPENDENT_OPERATOR_APPROVAL) so a PR author's self-supplied digest cannot mint lease claims, replay clearances, failovers, or dispatch (C7).
  - Enforce immutable task contracts across reconciliation, failover, and already-leased dispatch (C3), derive uncertain-execution failover checkpoints strictly from verified clearance dispositions (C2), and eliminate age-based lock stealing in FileBackedCloudRegistry (scoped to LOCAL_SINGLE_HOST_ONLY).
  - Fail closed on missing explicit --task files during handoff validation (C1), require cloud-handoff.yaml on HANDOFF_READY/COMPLETED_DRAFT tasks or when touched in changedFiles (C4), and support PROVING -> HANDOFF_READY / COMPLETED_DRAFT completion transitions with mandatory exact-head CI proof verification (C5).
  - Record pre-reset commit 583a1e2dd83a4330879b887ce52c6a81d6a37edb under archive tag archive/impl-kf-meta-cloud-control-001-pre-reset-2026-11-07 and use strictly append-only commits thereafter.
