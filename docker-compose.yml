###############################################################################
# Local development stack for KeyflowOS.
#
# Usage:
#   cp .env.example .env       # then edit values you care about
#   docker compose up -d db redis minio
#   cd packages/db && npx prisma migrate dev
#   pnpm dev                   # from repo root
#
# Brings up:
#   db     — PostgreSQL 16
#   redis  — Redis 7 (BullMQ job queues)
#   minio  — S3-compatible object storage
#
# Production-grade deploys should swap these for managed services.
# See DEPLOYMENT.md for platform-specific guides.
###############################################################################

services:
  db:
    # pgvector, not plain postgres. schema.prisma declares
    # `Unsupported("vector(1536)")` on AiMemoryEmbedding.embedding, which is the
    # pgvector extension type — semantic memory search does not work without it.
    #
    # This said `postgres:16-alpine`, which ships no pgvector, so
    # `docker compose up` on a clean machine produced a database that could not
    # host the schema. Existing volumes already have the extension because they
    # were created by some other image, which is why nobody noticed.
    #
    # Same PostgreSQL major version, so an existing data directory keeps working.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: keyflow
      POSTGRES_PASSWORD: keyflow
      POSTGRES_DB: keyflowos
    ports:
      - "5432:5432"
    volumes:
      - keyflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyflow -d keyflowos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - keyflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - keyflow_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  keyflow_db:
  keyflow_redis:
  keyflow_minio:
