  - tenant_and_auth_context
  - authority_and_capability
  - domain_command
  - invariant_checks
  - transaction
  - canonical_mutation
  - event_or_queue
  - worker_or_listener
  - external_effect
  - evidence
  - reconciliation
  - projection
  - downstream_consumer
  - recovery
  - feedback

development_loop:
  - human_direction
  - canonical_context
  - bounded_work
  - agent_execution
  - branch
  - proof
  - pull_request
  - review
  - ci_and_gates
