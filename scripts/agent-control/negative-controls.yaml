# AUTO-PROOF-MUTATION manifest.
#
# Each entry names a critical claim, the defect that would violate it, and the
# proof that MUST fail once that defect is restored. The runner verifies both
# halves: the proof passes clean, and fails mutated. A proof that survives its
# own defect is reported VACUOUS.
#
# Run: node scripts/agent-control/proof-mutation.mjs --manifest scripts/agent-control/negative-controls.yaml
#
# Mutations are applied inside a throwaway `git worktree`; the working tree,
# the branch and main are never modified.
version: 1

negative_controls:
  - id: NC-F1-MUTATION-LOCK-MISMATCH
    claim: >
      Every mutating orchestration path serializes on ONE constant mutation
      lock. A lock identity that drifts from what the workflow declares -- or
      that varies by event -- re-partitions the mutating paths and is rejected.
    mutation:
      file: scripts/agent-control/lib/events.mjs
      find: "export const MUTATION_LOCK = 'keyflow-agent-control-mutation';"
      replace: "export const MUTATION_LOCK = `keyflow-autopilot-${process.env.GITHUB_RUN_ID || 'programme'}`;"
    proof_command: node --test scripts/agent-control/tests/events.spec.mjs
    timeout_ms: 120000

  - id: NC-F1-MUTATION-LOCK-REMOVED-FROM-JOB
    claim: >
      A mutating job with no job-level mutation lock is rejected. This is the
      exact shape that shipped and was caught by review as
      META-P1-CONCURRENCY-CROSS-PATH-001.
    mutation:
      file: .github/workflows/agent-control-autopilot.yml
      find: |-
        # run beside a per-PR event-driven merge.
            concurrency:
              group: keyflow-agent-control-mutation
              cancel-in-progress: false
      replace: "# run beside a per-PR event-driven merge."
    proof_command: node --test scripts/agent-control/tests/events.spec.mjs
    timeout_ms: 120000

  - id: NC-F2-WAVE-GATE-DEADLOCK
    claim: >
      The DAG validator rejects a graph in which a packet depends on a later
      wave, which is the deadlock the prototype encoded.
    mutation:
      file: scripts/agent-control/lib/dag.mjs
      find: "      if (dag.waveIndex.get(dep.wave) > dag.waveIndex.get(node.wave)) {"
      replace: "      if (false) {"
    proof_command: node --test scripts/agent-control/tests/dag.spec.mjs
    timeout_ms: 120000

  - id: NC-F3-EVENT-IDEMPOTENCY
    claim: >
      A replayed event converges to one journal entry and one effect, so a
      crashed workflow cannot double-merge or double-checkpoint.
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "  if (hasProcessed(state, key)) return { state, duplicate: true, recorded: false, reason: 'already processed' };"
      replace: "  // defect restored: duplicate detection removed"
    proof_command: node --test scripts/agent-control/tests/recovery.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-EXACT-HEAD
    claim: >
      Workflow conclusions are only accepted at the exact PR head; green runs at
      another sha cannot admit this tree.
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: "  const atHead = runs.filter((r) => String(r.head_sha) === String(pr.head_sha));"
      replace: "  const atHead = runs;"
    proof_command: node --test scripts/agent-control/tests/admission.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-REVIEW-REQUIRED
    claim: >
      No admission without a recorded authority review marker; an agent can
      never self-approve.
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: "  if (!READY_STATUSES.has(String(ret.review_status))) {"
      replace: "  if (false) {"
    proof_command: node --test scripts/agent-control/tests/admission.spec.mjs
    timeout_ms: 120000

  - id: NC-STATE-MACHINE-FAILS-CLOSED
    claim: >
      Illegal state transitions fail closed; a packet cannot jump from
      CHARACTERIZING to merge readiness.
    mutation:
      file: scripts/agent-control/lib/state-machine.mjs
      find: "  if (!TRANSITIONS[from].includes(to)) {"
      replace: "  if (false) {"
    proof_command: node --test scripts/agent-control/tests/state-machine.spec.mjs
    timeout_ms: 120000

  - id: NC-CORRECTION-BOUNDED
    claim: >
      Two materially identical failed corrections force a block rather than an
      unbounded retry loop.
    mutation:
      file: scripts/agent-control/lib/correction.mjs
      find: "  if (prior >= MAX_IDENTICAL_ATTEMPTS) {"
      replace: "  if (false) {"
    proof_command: node --test scripts/agent-control/tests/orchestration.spec.mjs
    timeout_ms: 120000

  - id: NC-CONTRADICTION-STOPS-ADVANCE
    claim: >
      An unresolved contradiction stops advancement and is never resolved
      automatically.
    mutation:
      file: scripts/agent-control/lib/orchestrator.mjs
      find: "  if ((state.unresolved_contradictions || []).length) {"
      replace: "  if (false) {"
    proof_command: node --test scripts/agent-control/tests/orchestration.spec.mjs
    timeout_ms: 120000

  - id: NC-MISSING-AUTH-IS-WAITING
    claim: >
      A missing agent credential produces WAITING_EXTERNAL_AGENT, never a false
      success.
    mutation:
      file: scripts/agent-control/lib/adapters.mjs
      find: "      if (!process.env[envVar]) {"
      replace: "      if (false) {"
      # Both credentialed adapters carry this guard and the claim covers both,
      # so the defect is restored in every occurrence rather than one at random.
      replace_all: true
    proof_command: node --test scripts/agent-control/tests/orchestration.spec.mjs
    timeout_ms: 120000

  - id: NC-YAML-ROUND-TRIP
    claim: >
      The control-state codec can read back everything it writes; a writer/reader
      asymmetry corrupts state on the first save.
    mutation:
      file: scripts/agent-control/lib/yaml.mjs
      find: "  if (text === '{}') return {};"
      replace: "  // defect restored: empty flow mapping no longer readable"
    proof_command: node --test scripts/agent-control/tests/yaml.spec.mjs
    timeout_ms: 120000

  - id: NC-WORKER-CMDLET-EXISTS
    claim: >
      Every cmdlet the worker scripts invoke actually resolves. The install
      script shipped calling New-ScheduledTaskSettings (the real cmdlet is
      New-ScheduledTaskSettingsSet); it parsed cleanly, -WhatIfOnly exits before
      reaching it, and the old test only string-matched Register-ScheduledTask,
      so a broken install path merged.
    mutation:
      file: scripts/agent-control/install-claude-worker.ps1
      find: "New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries"
      replace: "New-ScheduledTaskSettings -AllowStartIfOnBatteries"
    # Windows-only since WORKER-CI-PLATFORM-001: the ScheduledTasks module
    # exists only there, so only there can this proof fail for the right reason.
    proof_command: node --test --test-name-pattern="every cmdlet" scripts/agent-control/tests/windows/install.spec.mjs
    timeout_ms: 180000

  - id: NC-WORKER-COMPLETION-MARKER
    claim: >
      The worker records a directive as processed only when the woken session
      emits an explicit completion marker naming that message. Exit code alone
      is not evidence: a fully permission-blocked session exits 0 with is_error
      false, and recording that as success silently skips the directive forever.
    mutation:
      file: scripts/agent-control/evaluate-run.ps1
      find: "if ($text -notlike \"*$doneMarker*\") {"
      replace: "if ($false) {"
    proof_command: node --test scripts/agent-control/tests/evaluate-run.spec.mjs
    timeout_ms: 180000

  - id: NC-WORKER-DENIAL-NOT-FATAL
    claim: >
      A permission denial that did not stop the session is a warning, not a
      failure. Failing there leaves the message unprocessed and makes the worker
      re-wake on it every poll.
    mutation:
      file: scripts/agent-control/evaluate-run.ps1
      find: "if ($result.is_error) {"
      replace: "if ($result.is_error -or $denialCount -gt 0) {"
    proof_command: node --test scripts/agent-control/tests/evaluate-run.spec.mjs
    timeout_ms: 180000

  # ---------------------------------------------------------------------------
  # Worker hardening (CG-REVIEW-META-AUTO-WORKER-001 / -002). The worker
  # proofs are Windows-only and run the real worker against stub gh/claude.
  # ---------------------------------------------------------------------------

  # Since KF-META-CONTROL-PARSER-001 (D3) the selector decides through the
  # shared parser, so these three restore their defect there. Claims and
  # proofs are unchanged: the proofs still drive select-directive.ps1.

  - id: NC-WORKER-SENDERLESS-REJECTED
    claim: >
      A DIRECTIVE with no sender field is not actionable. The live wake harness
      proved a senderless comment could wake the worker
      (WORKER-DIRECTIVE-AUTHORITY-001); this restores exactly that acceptance.
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "  if (!senders.includes(AUTHORITY_SENDER)) {"
      replace: "  if (senders.length && !senders.includes(AUTHORITY_SENDER)) {"
    proof_command: node --test --test-name-pattern="NO sender" scripts/agent-control/tests/select-directive.spec.mjs
    timeout_ms: 180000

  - id: NC-WORKER-SENDER-EXACT
    claim: >
      The sender must be exactly `chatgpt`. PowerShell's -ne ignores case, so
      the draft selector would have accepted `sender: ChatGPT`.
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "  if (!senders.includes(AUTHORITY_SENDER)) {"
      replace: "  if (!senders.some((s) => String(s).toLowerCase() === AUTHORITY_SENDER)) {"
    proof_command: node --test --test-name-pattern="any other sender" scripts/agent-control/tests/select-directive.spec.mjs
    timeout_ms: 180000

  - id: NC-WORKER-AUTHOR-ALLOWLIST
    claim: >
      A `sender: chatgpt` comment from a GitHub account outside the allowlist
      is rejected. The repository is public and the sender field is text anyone
      can type (WORKER-AUTHORITY-PUBLIC-REPO-001).
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "  if (!author || !authors.map((a) => String(a).toLowerCase()).includes(String(author).toLowerCase())) {"
      replace: "  if (false) {"
    proof_command: node --test --test-name-pattern="FORGED" scripts/agent-control/tests/select-directive.spec.mjs
    timeout_ms: 180000

  - id: NC-WORKER-RETRY-BOUNDED
    claim: >
      Two materially identical failed attempts hold the directive; there is no
      third Claude invocation (W6). Without the rule the worker retried every
      poll, each retry a full Claude session.
    mutation:
      file: scripts/agent-control/claude-worker.ps1
      find: "  if ($consecutive -ge $MaxIdenticalAttempts) {"
      replace: "  if ($false) {"
    proof_command: node --test --test-name-pattern="two identical blocked runs" scripts/agent-control/tests/windows/worker-retry.spec.mjs
    timeout_ms: 300000

  - id: NC-WORKER-HELD-IS-NOT-RETRIED
    claim: >
      A held directive is not handed to Claude again. Recording the hold is
      worthless if the tick ignores it.
    mutation:
      file: scripts/agent-control/claude-worker.ps1
      find: "  if ($entry -and $entry.held) {"
      replace: "  if ($false) {"
    proof_command: node --test --test-name-pattern="two identical blocked runs" scripts/agent-control/tests/windows/worker-retry.spec.mjs
    timeout_ms: 300000

  - id: NC-WORKER-WORKTREE-ISOLATION
    claim: >
      A woken session runs in its dedicated worktree, never in the interactive
      checkout (W7). Two agents in one checkout is what produced the edit-lock
      collision.
    mutation:
      file: scripts/agent-control/claude-worker.ps1
      find: "  Push-Location $Worktree.path"
      replace: "  Push-Location $RepoRoot"
    proof_command: node --test --test-name-pattern="dedicated worktree" scripts/agent-control/tests/windows/worker-worktree.spec.mjs
    timeout_ms: 300000

  - id: NC-WORKER-WORKTREE-ROOT-GUARD
    claim: >
      The worker refuses a worktree root inside the interactive checkout rather
      than nesting background work in the human's tree.
    mutation:
      file: scripts/agent-control/claude-worker.ps1
      find: "  if ($root -ieq $RepoRoot -or $root.StartsWith($RepoRoot + $sep, [System.StringComparison]::OrdinalIgnoreCase)) {"
      replace: "  if ($false) {"
    proof_command: node --test --test-name-pattern="inside the checkout" scripts/agent-control/tests/windows/worker-worktree.spec.mjs
    timeout_ms: 300000

  - id: NC-WORKER-CLEANUP-KEEPS-UNPUSHED
    claim: >
      Cleanup never removes a worktree holding commits that exist on no remote.
      git itself would allow that removal (the tree is clean), so only the
      worker's own check stands between it and lost work.
    mutation:
      file: scripts/agent-control/claude-worker.ps1
      find: "  if (@($unpushed.out | Where-Object { $_ }).Count) {"
      replace: "  if ($false) {"
    proof_command: node --test --test-name-pattern="on no remote" scripts/agent-control/tests/windows/worker-worktree.spec.mjs
    timeout_ms: 300000

  - id: NC-WORKER-CLEANUP-KEEPS-UNCOMMITTED
    claim: >
      Cleanup identifies uncommitted work itself and keeps the worktree, rather
      than relying on git refusing the removal.
    mutation:
      file: scripts/agent-control/claude-worker.ps1
      find: "  if (@($status.out | Where-Object { $_ }).Count) {"
      replace: "  if ($false) {"
    proof_command: node --test --test-name-pattern="never deletes uncommitted" scripts/agent-control/tests/windows/worker-worktree.spec.mjs
    timeout_ms: 300000

  - id: NC-WORKER-INSTALL-CONTRACT
    claim: >
      The worker wakes Claude only under the install record for its own
      contract version, so an autostart left over from an older worker stays a
      no-op until the hardened install is made.
    mutation:
      file: scripts/agent-control/claude-worker.ps1
      find: "  if (-not $DryRun -and -not (Test-InstallContract)) {"
      replace: "  if ($false) {"
    proof_command: node --test --test-name-pattern="install record" scripts/agent-control/tests/windows/worker-authority.spec.mjs
    timeout_ms: 300000

  - id: NC-WORKER-PAUSE
    claim: >
      A paused worker does not wake Claude until resumed.
    mutation:
      file: scripts/agent-control/claude-worker.ps1
      find: "  if (Test-Path $PauseFile) { Write-WorkerLog 'PAUSED'"
      replace: "  if ($false) { Write-WorkerLog 'PAUSED'"
    proof_command: node --test --test-name-pattern="paused worker" scripts/agent-control/tests/windows/worker-authority.spec.mjs
    timeout_ms: 300000

  # --- source precedence (CG-DIRECTIVE-META-STATE-RECONCILE-001) ------------

  - id: NC-RECONCILE-GATE-BYPASS
    claim: >
      decide() consults the derived programme-state only behind a consistent
      reconciliation. Without the gate, a stale READY_TO_MERGE for an already
      merged PR asks for admission again.
    mutation:
      file: scripts/agent-control/lib/orchestrator.mjs
      find: "  if (!rec || rec.consistent !== true) {"
      replace: "  if (false) {"
    proof_command: node --test --test-name-pattern="stale READY_TO_MERGE for a merged PR" scripts/agent-control/tests/reconcile.spec.mjs
    timeout_ms: 120000

  - id: NC-RECONCILE-NEWER-AUTHORITY
    claim: >
      Any valid #80 authority message newer than the projection's anchor --
      including a hold typed DIRECTIVE -- makes the projection stale, so an
      older derived advance cannot outrun a newer hold.
    mutation:
      file: scripts/agent-control/lib/reconcile.mjs
      find: "      } else if (idx < authority.messages.length - 1) {"
      replace: "      } else if (false) {"
    proof_command: node --test --test-name-pattern="newer than the projection" scripts/agent-control/tests/reconcile.spec.mjs
    timeout_ms: 120000

  - id: NC-RECONCILE-MERGED-PR
    claim: >
      A pre-merge projection whose PR has merged is reported as
      PR_ALREADY_MERGED, not misclassified.
    mutation:
      file: scripts/agent-control/lib/reconcile.mjs
      find: "      if (PRE_MERGE_STATES.has(p.state) && merged) {"
      replace: "      if (false) {"
    proof_command: node --test --test-name-pattern="stale READY_TO_MERGE for a merged PR" scripts/agent-control/tests/reconcile.spec.mjs
    timeout_ms: 120000

  - id: NC-RECONCILE-REPO-CONTRADICTION
    claim: >
      A MERGED or CHECKPOINTED projection whose PR never merged fails closed
      and reports the drift.
    mutation:
      file: scripts/agent-control/lib/reconcile.mjs
      find: "      } else if (POST_MERGE_STATES.has(p.state) && !merged) {"
      replace: "      } else if (false) {"
    proof_command: node --test --test-name-pattern="repository contradicts projection" scripts/agent-control/tests/reconcile.spec.mjs
    timeout_ms: 120000

  - id: NC-RECONCILE-UNVERIFIABLE-AUTHORITY
    claim: >
      An unreadable #80 is reported as AUTHORITY_UNVERIFIABLE, never treated as
      "no newer authority".
    mutation:
      file: scripts/agent-control/lib/reconcile.mjs
      find: "  if (!authority?.verified) {"
      replace: "  if (false) {"
    proof_command: node --test --test-name-pattern="cannot be verified fails closed" scripts/agent-control/tests/reconcile.spec.mjs
    timeout_ms: 120000

  - id: NC-RECONCILE-AUTHORITY-SENDER
    claim: >
      Only sender chatgpt from an allowlisted GitHub author carries authority;
      a claude-sent or forged REVIEW does not move the anchor.
    # Moved with collectAuthority into the shared parser (KF-META-CONTROL-PARSER-001).
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "export function rejectionOf(env, author, authors = AUTHORIZED_AUTHORS) {"
      replace: |-
        export function rejectionOf(env, author, authors = AUTHORIZED_AUTHORS) {
          return null;
    proof_command: node --test --test-name-pattern="only chatgpt-sent" scripts/agent-control/tests/reconcile.spec.mjs
    timeout_ms: 120000

  - id: NC-RECONCILE-CLI-WIRING
    claim: >
      The orchestrator CLI passes the real reconciliation to decide(); a CLI
      that asserts consistency would publish derived actions from a stale
      projection.
    mutation:
      file: scripts/agent-control/orchestrate.mjs
      find: "decide({ state, reconciliation, event, dag, registry, duplicate })"
      replace: "decide({ state, reconciliation: { consistent: true, findings: [] }, event, dag, registry, duplicate })"
    proof_command: node --test --test-name-pattern="CLI end to end" scripts/agent-control/tests/reconcile.spec.mjs
    timeout_ms: 120000

  # --- one #80 envelope parser (KF-META-CONTROL-PARSER-001, option T) ---------

  - id: NC-ENVELOPE-EDITED
    claim: >
      An edited comment from an allowlisted author fails closed as
      AUTHORITY_EDITED. An edit can add, change or remove authority, including
      a hold, and the prior body is not observable.
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "  if (edited.length) {"
      replace: "  if (false) {"
    proof_command: node --test --test-name-pattern="NC edited comment" scripts/agent-control/tests/control-envelope.spec.mjs
    timeout_ms: 120000

  - id: NC-ENVELOPE-EDIT-UNKNOWN
    claim: >
      An allowlisted comment whose input shape carries no edit evidence is
      unverifiable, never assumed unedited.
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "  if (editUnknown.length) {"
      replace: "  if (false) {"
    proof_command: node --test --test-name-pattern="edit state not observable" scripts/agent-control/tests/control-envelope.spec.mjs
    timeout_ms: 120000

  - id: NC-ENVELOPE-REPEATED-KEY
    claim: >
      A repeated top-level key is ambiguous and malformed; no first-wins value
      is ever read from it.
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "    if (env.values[key].length > 1) {"
      replace: "    if (false) {"
    proof_command: node --test --test-name-pattern="NC repeated key" scripts/agent-control/tests/control-envelope.spec.mjs
    timeout_ms: 120000

  - id: NC-ENVELOPE-INVALID-FIRST-REPEAT
    claim: >
      A message whose repeated message_type starts with a non-authority value
      is still authority (malformed), not skipped. Reading only the first value
      made such a message vanish, so a newer hold could be lost.
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "  const authority = types.find((t) => AUTHORITY_MESSAGE_TYPES.includes(t));"
      replace: "  const authority = [envelopeField(env, 'message_type')].find((t) => AUTHORITY_MESSAGE_TYPES.includes(t));"
    proof_command: node --test --test-name-pattern="NC invalid-first repeat" scripts/agent-control/tests/control-envelope.spec.mjs
    timeout_ms: 120000

  - id: NC-ENVELOPE-UNDECLARED-TYPE
    claim: >
      A ChatGPT-sender comment whose message_type is missing, repeated or not
      declared on #80 (a typo'd HOLD, say) is malformed authority, never
      skipped, so the worker cannot fall back to an older directive past it
      (Copilot r4115806024).
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "  return 'UNKNOWN';"
      replace: "  return null;"
    proof_command: node --test --test-name-pattern="undeclared type" scripts/agent-control/tests/control-envelope.spec.mjs scripts/agent-control/tests/select-directive.spec.mjs
    timeout_ms: 180000

  - id: NC-ENVELOPE-INLINE-COMMENT
    claim: >
      Inline YAML comments are read as lib/yaml.mjs reads them. events.mjs used
      to keep "value # note" as the value (CONTRADICTION D6).
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "  const text = stripComment(rest).trim();"
      replace: "  const text = rest.trim();"
    proof_command: node --test --test-name-pattern="NC inline comment" scripts/agent-control/tests/control-envelope.spec.mjs
    timeout_ms: 120000

  - id: NC-ENVELOPE-UNMATCHED-QUOTE
    claim: >
      A value with an unmatched quote is malformed. Stripping each quote
      independently read `'ACTIVATE` as ACTIVATE.
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: |-
            if (!balanced) return { value: text.replace(/^["']|["']$/g, ''), problem: 'unmatched quote' };
      replace: |-
            if (!balanced) return { value: text.replace(/^["']|["']$/g, '') };
    proof_command: node --test --test-name-pattern="NC unmatched quote" scripts/agent-control/tests/control-envelope.spec.mjs
    timeout_ms: 120000

  - id: NC-ENVELOPE-ESCAPED-QUOTE
    claim: >
      Quote balance is escape-aware. Comparing only the first and last
      characters accepted `"KF-X\"`, which never closes (Copilot r4115848580).
    mutation:
      file: scripts/agent-control/lib/control-envelope.mjs
      find: "    const balanced = wellQuoted(text);"
      replace: "    const balanced = opens && closes && text.length >= 2 && text[0] === text[text.length - 1];"
    proof_command: node --test --test-name-pattern="NC unmatched quote" scripts/agent-control/tests/control-envelope.spec.mjs
    timeout_ms: 120000

  - id: NC-ENVELOPE-ESCAPED-COMMENT
    claim: >
      The inline-comment scanner is escape-aware. Ending a quoted scalar at an
      escaped \" or doubled '' cut `packet_id: "KF\" # 1"` at the "#" and then
      rejected it as an unmatched quote (Copilot review 21:31Z at ad9c908d).
    mutation:
      file: scripts/agent-control/lib/yaml.mjs
      find: |-
        if (quote === '"' && ch === '\\') i += 1;
              else if (quote === "'" && ch === "'" && text[i + 1] === "'") i += 1;
              else if (ch === quote) quote = null;
      replace: "if (ch === quote) quote = null;"
    proof_command: node --test --test-name-pattern="NC escaped comment" scripts/agent-control/tests/yaml.spec.mjs scripts/agent-control/tests/control-envelope.spec.mjs
    timeout_ms: 120000

  - id: NC-SELECTOR-SOURCE-HEAD-FALLBACK
    claim: >
      A directive that names only source_head is routed by that head. The
      selector dropped it, so the worker based the wake worktree on origin/main
      (Copilot review 5332418633 at 82454cce).
    mutation:
      file: scripts/agent-control/select-directive.mjs
      find: "    source_main: decisive.source_main ?? decisive.source_head,"
      replace: "    source_main: decisive.source_main,"
    proof_command: node --test --test-name-pattern="NC source head" scripts/agent-control/tests/select-directive.spec.mjs
    timeout_ms: 120000

  - id: NC-SELECTOR-SOURCE-MAIN-PRECEDENCE
    claim: >
      When a directive names both, the explicit source_main is the base, not
      source_head.
    mutation:
      file: scripts/agent-control/select-directive.mjs
      find: "    source_main: decisive.source_main ?? decisive.source_head,"
      replace: "    source_main: decisive.source_head ?? decisive.source_main,"
    proof_command: node --test --test-name-pattern="NC source precedence" scripts/agent-control/tests/select-directive.spec.mjs
    timeout_ms: 120000

  - id: NC-ENVELOPE-MISSING-KEY
    claim: >
      AUTHORITY requires every envelope key to be present (null allowed). An
