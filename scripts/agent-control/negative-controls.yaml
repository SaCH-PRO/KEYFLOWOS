    timeout_ms: 120000

  - id: NC-STATE-SHAPE-UNVALIDATED
    claim: >
      A checkpoint container that is present with the wrong structural type
      (`holds: []`, a null or scalar mapping, a mapping where a list belongs)
      is rejected by the state contract under a named problem, so the fold
      does not start. Without the shape check `holds: []` passes every other
      check and the checkpoint reconciles (CONVERGED-CORRECTIONS-018 K2;
      Copilot review 5407820973).
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "  if (shape.length) return { ok: false, problems: shape };"
      replace: "  // defect restored: the shape of the containers is not checked"
    proof_command: node --test --test-name-pattern="container present with the wrong type is left as written" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-STATE-SHAPE-UNVALIDATED-CLI
    claim: >
      The same defect is caught on the live path: orchestrate.mjs, reading
      the committed checkpoint from disk with `holds: []` in place of its
      held packet, must report drift. Without the shape check it reconciles
      with the ACTION-001 hold gone (CONVERGED-CORRECTIONS-018 K2).
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "  if (shape.length) return { ok: false, problems: shape };"
      replace: "  // defect restored: the shape of the containers is not checked"
    proof_command: node --test --test-name-pattern="wrong-type container is drift for orchestrate" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 180000

  - id: NC-STATE-SHAPE-DECISION
    claim: >
      A checkpoint with a wrong-type container reaches no dispatch, review,
      admission or wait decision. Without the shape check each of those
      checkpoints reaches its normal decision (CONVERGED-CORRECTIONS-018 K2).
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "  if (shape.length) return { ok: false, problems: shape };"
      replace: "  // defect restored: the shape of the containers is not checked"
    proof_command: node --test --test-name-pattern="wrong-type container reaches no dispatch" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-STATE-MAPPING-COERCED
    claim: >
      normalizeState() defaults an absent mapping only. Restoring the coercion
      that spread any present value into a mapping turns `holds: []` into
      `{}` before the checkpoint is validated, and is caught
      (CONVERGED-CORRECTIONS-018 K2; CHECKPOINT-VALIDATION-017).
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "    return isMapping(written) ? { ...fallback, ...written } : written;"
      replace: "    return { ...fallback, ...(written || {}) };"
    proof_command: node --test --test-name-pattern="container present with the wrong type is left as written" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-STATE-LIST-COERCED
    claim: >
      normalizeState() defaults an absent list only. Replacing a present value
      that is not a list with an empty list repairs the checkpoint before it
      is validated, and is caught (CONVERGED-CORRECTIONS-018 K2).
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "    return Array.isArray(written) ? [...written] : written;"
      replace: "    return Array.isArray(written) ? [...written] : [];"
    proof_command: node --test --test-name-pattern="container present with the wrong type is left as written" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-APPLY-INVALID-CHECKPOINT-JOURNALED
    claim: >
      orchestrate.mjs --apply checks the stored checkpoint before the journal
      step. One the state contract rejects is not journaled onto and not
      saved: the run prints the same REPORT_DRIFT, names the contract
      problems and writes nothing. Without the check the journal helpers run
      on the invalid checkpoint and the run ends in a TypeError or a refused
      save, with no decision printed (FINAL-CORRECTION-020 K1; Copilot
      r4179736619).
    mutation:
      file: scripts/agent-control/orchestrate.mjs
      find: "    if (!stored.ok) {"
      replace: "    if (false) {"
    proof_command: node --test --test-name-pattern="apply on an invalid checkpoint journals nothing" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 180000

  - id: NC-HOLDS-CONTAINER-FABRICATED
    claim: >
      activeHolds() reads `holds` only when it is a mapping. Reading whatever
      is there shows a list written in its place as holds that the checkpoint
      does not have (FINAL-CORRECTION-020 K2; Copilot r4179736650).
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "  const holds = isMapping(state?.holds) ? state.holds : {};"
      replace: "  const holds = state?.holds || {};"
    proof_command: node --test --test-name-pattern="wrong-type hold container yields no hold entry" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-HOLDS-ENTRY-FABRICATED
    claim: >
      An entry of `holds` is a hold only when it is a mapping. Accepting any
      truthy entry shows a scalar or a list as an active hold with no packet
      and no reason (FINAL-CORRECTION-020 K2).
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "    .filter((hold) => isMapping(hold) && hold.active !== false);"
      replace: "    .filter((hold) => hold && hold.active !== false);"
    proof_command: node --test --test-name-pattern="wrong-type hold container yields no hold entry" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-HOLD-LEGACY-FABRICATED
    claim: >
      The legacy single `hold` is a hold only when it is a mapping. Accepting
      any truthy value shows `hold: text` or a list as an active hold
      (FINAL-CORRECTION-020 K2; Copilot r4179736650).
    mutation:
      file: scripts/agent-control/lib/state.mjs
      find: "  const legacy = isMapping(state?.hold) && state.hold.active !== false ? [state.hold] : [];"
      replace: "  const legacy = state?.hold && state.hold.active !== false ? [state.hold] : [];"
    proof_command: node --test --test-name-pattern="wrong-type hold container yields no hold entry" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-ADMISSION-WITHOUT-PR
    claim: >
      An admission or a checkpoint is about a PR and must name it; only a
      release or a correction may come before a PR exists.
    mutation:
      file: scripts/agent-control/lib/authority-effects.mjs
      find: |-
        const PR_REQUIRED = Object.freeze(['PACKET_ADMISSION', 'CHECKPOINT']);
      replace: |-
        const PR_REQUIRED = Object.freeze([]);
    proof_command: node --test --test-name-pattern="NC unfoldable authority" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-STATE-FROM-PROSE
    claim: >
      A packet effect projects its packet state from the effect, never from the
      free-vocabulary state field (RELEASED, REVIEWED, QUEUED).
    mutation:
      file: scripts/agent-control/lib/authority-effects.mjs
      find: |-
              state: PROJECTED_STATE[effect],
      replace: |-
              state: field(message, 'state'),
    proof_command: node --test --test-name-pattern="packet effects project state from the effect" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-META-CREDIT
    claim: >
      CHECKPOINT credits only members of the programme DAG; a meta packet
      checkpoint earns zero programme credit.
    mutation:
      file: scripts/agent-control/lib/authority-effects.mjs
      find: |-
            if (effect === 'CHECKPOINT' && options.applicationPackets?.has(packet)) {
      replace: |-
            if (effect === 'CHECKPOINT') {
    proof_command: node --test --test-name-pattern="CHECKPOINT credits only programme DAG packets" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-REPO-TRUTH-STORED
    claim: >
      Repository truth is read for the effective projection. Reading it for the
      stored checkpoint would skip the PR checks that catch a folded CHECKPOINT
      or ADMISSION the repository contradicts.
    mutation:
      file: scripts/agent-control/lib/reconcile.mjs
      find: |-
          const repo = typeof repoFor === 'function' ? repoFor(effective?.programme || {}) : repoFor;
      replace: |-
          const repo = typeof repoFor === 'function' ? repoFor(checkpoint?.programme || {}) : repoFor;
    proof_command: node --test --test-name-pattern="NC repository contradictions still report drift" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-CLI-STORED-PROJECTION
    claim: >
      The orchestrator decides on the effective projection it reconciled.
      Deciding on the stored checkpoint ignores an explicit RESUME HOLD_CLEAR.
    mutation:
      file: scripts/agent-control/orchestrate.mjs
      find: |-
          const state = reconciliation.effective_state;
      replace: |-
          const state = checkpoint;
    proof_command: node --test --test-name-pattern="orchestrate decides on the effective projection" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-LIVE-FOLD-DISABLED
    claim: >
      The live path folds: with typed authority withheld from the reducer, an
      observed typed REVIEW makes the committed checkpoint stale again, which is
      the DERIVED_STATE_STALE_AUTHORITY deadlock this packet removes.
    mutation:
      file: scripts/agent-control/lib/truth.mjs
      find: |-
          return reconcileProjection(state, authority, truth.repoFor, { applicationPackets: applicationPacketsOf(dag) });
      replace: |-
          return reconcileProjection(state, { ...authority, candidates: [] }, truth.repoFor, { applicationPackets: applicationPacketsOf(dag) });
    proof_command: node --test --test-name-pattern="orchestrate decides on the effective projection" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-PRODUCTION-TOUCHED-FOLDED
    claim: >
      Authority carrying production_touched other than false stops the fold on
      every effect, holds included. No effect projects the field, so without
      the guard such a message would fold as untouched (Copilot r4171364250).
    mutation:
      file: scripts/agent-control/lib/authority-effects.mjs
      find: |-
        if (touched !== 'false') {
      replace: |-
        if (false) {
    proof_command: node --test --test-name-pattern="NC production_touched other than false" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-INHERITED-HOLD
    claim: >
      Holds are read by own key only, so an inherited name such as __proto__
      or constructor is never an active hold, and an unmatched HOLD_CLEAR for
      it fails closed (AUDIT-CORRECTION-007 A7-F1, Copilot r4171599236).
    mutation:
      file: scripts/agent-control/lib/authority-effects.mjs
      find: |-
        const ownHold = (holds, packet) => (Object.hasOwn(holds, packet) ? holds[packet] : undefined);
      replace: |-
        const ownHold = (holds, packet) => holds[packet];
    proof_command: node --test --test-name-pattern="an unmatched HOLD_CLEAR for an inherited name" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-HOLD-PROTO-SETTER
    claim: >
      A hold is written as an own data property, so a hold for the packet id
      __proto__ is stored, never routed through the prototype setter (A7-F1).
    mutation:
      file: scripts/agent-control/lib/authority-effects.mjs
      find: |-
        Object.defineProperty(holds, packet, { value: hold, enumerable: true, writable: true, configurable: true });
      replace: |-
        holds[packet] = hold;
    proof_command: node --test --test-name-pattern="a hold for any non-blank packet id" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-YAML-PROTO-KEY
    claim: >
      The control-state YAML codec defines every mapping key as an own
      property, so a checkpoint whose holds are keyed __proto__ round-trips
      without prototype mutation (A7-F1 serialization path).
    mutation:
      file: scripts/agent-control/lib/yaml.mjs
      find: |-
        Object.defineProperty(out, key, { value, enumerable: true, writable: true, configurable: true });
      replace: |-
        out[key] = value;
    proof_command: node --test --test-name-pattern="survives the checkpoint YAML round trip" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-RECOVERY-MALFORMED-SKIPPED
    claim: >
      Recovery past malformed authority is a reviewed re-anchor, never a skip
      (C8-F2). On the real #80 recording, folding only valid messages would
      carry the previous checkpoint past the malformed CORRECTION-004, and
      would carry the new one past a later malformed message.
    mutation:
      file: scripts/agent-control/lib/authority-effects.mjs
      find: |-
              ? [...(Array.isArray(authority.candidates) ? authority.candidates : authority.messages || [])].sort(compareAuthorityOrder)
      replace: |-
              ? [...(authority.messages || [])].sort(compareAuthorityOrder)
    proof_command: node --test --test-name-pattern="recorded evidence .recovery." scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-REDUCER-RECORDED-UNMINIMIZED
    claim: >
      The recorded #80 evidence stays minimized to the column-0 lines the
      parser reads (CORRECTION-004 C4-F2). A restored fence line changes no
      parsed field, so only the minimality proof can notice it.
    mutation:
      file: scripts/agent-control/fixtures/reducer-live-truth.json
      find: |-
              "body": "message_id: CG-DIRECTIVE-META-STATE-RECONCILE-002\n
      replace: |-
              "body": "```yaml\nmessage_id: CG-DIRECTIVE-META-STATE-RECONCILE-002\n
    proof_command: node --test --test-name-pattern="every recorded body is only the column-0 lines" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-YAML-KEY-AMBIGUOUS
    claim: >
      The checkpoint codec writes a mapping key in the form its parser reads
      back as the same key, so a hold keyed by a packet id such as ":" or
      "a: b" survives a save and reload (CORRECTION-010 C10-F1, Copilot
      r4171689174). Restoring the plain-key rule emits a line that fails to
      parse or parses to another key.
    mutation:
      file: scripts/agent-control/lib/yaml.mjs
      find: |-
        const safeKey = formatKey(key);
      replace: |-
        const safeKey = PLAIN_SAFE.test(key) ? key : JSON.stringify(key);
    proof_command: node --test --test-name-pattern="ambiguous packet id survives the checkpoint YAML round trip" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-YAML-KEY-AMBIGUOUS-ENVELOPE
    claim: >
      A colon-bearing packet id that arrives through the real #80 envelope is
      held, saved, reloaded and cleared under the same key (C10-F1). The
      packet-id vocabulary is not narrowed.
    mutation:
      file: scripts/agent-control/lib/yaml.mjs
      find: |-
        const safeKey = formatKey(key);
      replace: |-
        const safeKey = PLAIN_SAFE.test(key) ? key : JSON.stringify(key);
    proof_command: node --test --test-name-pattern="a colon-bearing packet id folds from a real envelope" scripts/agent-control/tests/authority-effects.spec.mjs
    timeout_ms: 120000

  - id: NC-YAML-QUOTED-KEY-ESCAPE
    claim: >
      A plain key never starts with a quote, so a quoted scalar holding a
      colon is read whole, as a quoted key or as a value, never split at the
      colon inside it (C10-F1).
    mutation:
      file: scripts/agent-control/lib/yaml.mjs
      find: |-
        |(?!["'])[^:#]+?):
      replace: |-
        |[^:#]+?):
    proof_command: node --test --test-name-pattern="mapping keys round-trip as the same keys" scripts/agent-control/tests/yaml.spec.mjs
    timeout_ms: 120000

  - id: NC-YAML-SEQUENCE-ITEM-KEYLIKE
    claim: >
      A sequence item the parser would read as "key: value" is quoted, so a
      list of packet ids keeps an id such as "a: b" as text (C10-F1).
    mutation:
      file: scripts/agent-control/lib/yaml.mjs
      find: |-
        const ambiguous = scalar === null || (typeof item === 'string' && !scalar.startsWith('"') && matchKey(scalar) !== null);
      replace: |-
        const ambiguous = scalar === null;
    proof_command: node --test --test-name-pattern="mapping keys round-trip as the same keys" scripts/agent-control/tests/yaml.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-ARTIFACTS-UNBOUND
    claim: >
      Admission binds the control artifacts to the PR being admitted. A pair
      copied whole from another packet agrees with itself on packet, branch
      and PR, and is still not eligible (CORRECTION-010 C10-F2, Copilot
      r4171689190 and r4171689206).
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: |-
        if (unbound.length) return fail(ADMISSION_REASONS.ARTIFACTS_NOT_BOUND, unbound);
      replace: |-
        if (false) return fail(ADMISSION_REASONS.ARTIFACTS_NOT_BOUND, unbound);
    proof_command: node --test --test-name-pattern="NC stale artifacts" scripts/agent-control/tests/admission.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-BRANCH-UNBOUND
    claim: >
      Each artifact's implementation_branch must equal the PR head_ref; two
      artifacts agreeing on another branch are not bound (C10-F2).
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: |-
        if (headRef === '' || branch !== headRef) {
      replace: |-
        if (headRef === '' || branch === '') {
    proof_command: node --test --test-name-pattern="NC wrong branch" scripts/agent-control/tests/admission.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-PR-NUMBER-UNBOUND
    claim: >
      An artifact that names a PR must name the one being admitted, so another
      packet's pair with only its branch retargeted is not bound (C10-F2).
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: |-
        if (declared !== undefined && declared !== null && numberText(declared) !== numberText(pr.number)) {
      replace: |-
        if (false) {
    proof_command: node --test --test-name-pattern="NC wrong packet" scripts/agent-control/tests/admission.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-PACKET-ID-SPLIT
    claim: >
      Both artifacts must name the same non-blank packet; artifacts that name
      different packets are not bound (C10-F2).
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: |-
        if (ids[0] !== '' && ids[1] !== '' && ids[0] !== ids[1]) {
      replace: |-
        if (false) {
    proof_command: node --test --test-name-pattern="NC wrong packet" scripts/agent-control/tests/admission.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-IDENTITY-TRIMMED
    claim: >
      The binding compares identities exactly. Trimming a branch, packet id
      or PR number before the comparison accepts an artifact that differs from
      the PR by surrounding whitespace (EXACT-BINDING-016; Copilot review
      5407375269), and is caught.
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: "  return exact.trim() === '' ? '' : exact;"
      replace: "  return exact.trim();"
    proof_command: node --test --test-name-pattern="NC whitespace" scripts/agent-control/tests/admission.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-IDENTITY-COERCED
    claim: >
      An identity is a string. Turning a number or a boolean into its text
      before the comparison makes `packet_id: 1` in one artifact equal
      `packet_id: "1"` in the other, and is caught (CONVERGED-CORRECTIONS-018
      K3; Copilot r4179015393).
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: "  if (typeof exact !== 'string') return '';"
      replace: "  if (typeof exact === 'number' || typeof exact === 'boolean') exact = String(exact);"
    proof_command: node --test --test-name-pattern="NC identity types" scripts/agent-control/tests/admission.spec.mjs
    timeout_ms: 120000

  - id: NC-ADMISSION-BRANCH-ARTIFACT-UNBOUND
    claim: >
      The suite binds the branch's own control artifacts by the admission
      rule, and proves the rule rejects that same real pair for another PR,
      so the branch-artifact check is not satisfied by mere agreement
      (C10-F2, Copilot r4171689206).
    mutation:
      file: scripts/agent-control/lib/admission.mjs
      find: |-
        if (headRef === '' || branch !== headRef) {
      replace: |-
        if (false) {
    proof_command: node --test --test-name-pattern="the real control artifacts on this branch parse and are bound" scripts/agent-control/tests/yaml.spec.mjs
    timeout_ms: 120000
