# WHAT WAS WORTH KEEPING
#
# These were measured, not guessed, and they hold wherever this is built. The
# rest of the old file described Render specifics and is in git history if anyone
# ever wants it (`git log -- render.yaml`).
#
#   BUILD MEMORY. The server's tsc does not fit in 2GB, and no configuration
#   closes the gap. Measured on a cold cache:
#       2048MB  OOM
#       3328MB  OOM
#       3584MB  builds
#       4096MB  builds
#   `tsc --noCheck` still OOM'd at 3072MB, so skipping type checking does not
#   help. 1,219 files / ~314k lines is simply a large compile. The VPS has 7.6GB
#   and 4GB of swap was added on 2026-08-08 to keep this survivable alongside the
#   running stack.
#
#   tsx CANNOT START THE SERVER. It does not emit `design:paramtypes`, so NestJS
#   type-based dependency injection fails: 64 "undefined dependency" errors, zero
#   routes mapped, non-zero exit. Run the compiled output — `node dist/main.js`.
#
#   NODE_ENV=production BREAKS THE BUILD AT INSTALL TIME. pnpm honours it and
#   skips devDependencies, which is where typescript and @types/node live. Every
#   subsequent tsc then finds no compiler. Any build step needs
#   `pnpm install --frozen-lockfile --prod=false`. This is invisible locally,
#   because NODE_ENV is not production on a dev machine.
#
#   DO NOT RUN MORE THAN ONE APP INSTANCE. There is no leader election or
#   single-runner guard on any @Cron, and there are 28 of them. Some are
#   idempotent. These are not: key-proactive-engine sends the morning brief, the
#   weekly digest and the end-of-day summary — N replicas means N copies of each
#   email. key-cortex-homeostasis and -salience release hormones that accumulate
#   asymptotically, so KEY's disposition would shift on replica count rather than
#   on the business. Latent only because one instance runs today.
#
#   PRISMA MIGRATE NEEDS A SESSION CONNECTION. It takes a session-level advisory
#   lock, so it hangs or fails through a transaction pooler (pgbouncer, :6543).
#   Where DATABASE_URL is a pooler, migrations must use the direct :5432 URL.
#   Irrelevant on the current VPS — Postgres is a container on the compose
#   network — but it will matter again the moment a managed database appears.
#
# ─────────────────────────────────────────────────────────────────────────────
