services:
  - type: web
    name: keyflowos
    runtime: node
    region: ohio
    plan: standard
    branch: main
    # The build actually has to build. This previously ran `pnpm install` only,
    # which is why the start command had to use tsx — there was no compiled
    # output to run. tsx cannot start this server (it does not emit
    # design:paramtypes, so NestJS dependency injection fails), so the deploy
    # was broken either way.
    #
    # Order matters: workspace packages first (the server imports @keyflow/db,
    # @keyflow/shared and @keyflow/api by their built entrypoints), then the
    # Prisma client, then the apps.
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @keyflow/shared --filter @keyflow/db --filter @keyflow/api build &&
      pnpm --filter @keyflow/db run db:generate &&
      pnpm --filter server build &&
      pnpm --filter web build
    startCommand: bash scripts/start-prod.sh
    # /api/healthz — the WEB app's health route, because the WEB app is what
    # binds Render's $PORT here.
    #
    # Read the env block below carefully before changing this: WEB_PORT is set
    # to the same value as PORT (10000) while API_PORT is 3001, and
    # scripts/start-prod.sh resolves WEB_PORT="${WEB_PORT:-5000}". So Render
    # probes the Next.js app, not the NestJS API. The API's own /healthz is on
    # port 3001 and is not publicly reachable in this topology.
    #
    # apps/web/src/app/api/healthz/route.ts returns 200 when the web env is
    # valid and additionally probes the API's /readyz, reporting apiReachable in
    # the body — so a green health check means the web is up, and the body says
    # whether the API behind it is too.
    #
    # NOT the API's /healthz (404 on the web app) and NOT /readyz (503 on a
    # transient DB blip would roll back a good release).
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_PORT
        value: "3001"
      - key: WEB_PORT
        value: "10000"

      # REQUIRED AT BUILD TIME — without it `pnpm --filter web build` throws and
      # the whole deploy fails.
      #
      # apps/web/src/lib/api.ts evaluates at module load:
      #   if (!process.env.NEXT_PUBLIC_API_BASE_URL && NODE_ENV === 'production')
      #     throw new Error('NEXT_PUBLIC_API_BASE_URL is required in production')
      # Next.js evaluates modules during the build, and NODE_ENV=production is
      # set above, so an absent value is a hard build failure — not a runtime
      # one. apps/web/src/lib/env.ts enforces the same requirement.
      #
      # `/__api` is the same-origin proxy, which is the right answer for THIS
      # topology: the web app binds the public $PORT and the API sits on 3001 on
      # the same host, not publicly reachable. next.config.ts rewrites
      # /__api/:path* to the upstream below, so the browser only ever makes
      # same-origin requests and needs no public API hostname.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /__api

      # Upstream for that rewrite. Matches API_PORT above. next.config.ts falls
      # back to this exact value, but it is set explicitly so the two cannot
      # drift apart silently.
      - key: KEYFLOW_API_INTERNAL_URL
        value: http://localhost:3001
      # Secrets must be added manually in the Render dashboard from your .env file:
      # DATABASE_URL, DIRECT_URL, REDIS_URL, SUPABASE_URL, SUPABASE_ANON_KEY,
      # SUPABASE_JWT_SECRET, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY,
      # S3_BUCKET, S3_REGION, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
      # S3_PUBLIC_URL, S3_FORCE_PATH_STYLE, PRIVATE_OBJECT_DIR,
      # PUBLIC_OBJECT_SEARCH_PATHS, OPENAI_API_KEY, STRIPE_SECRET_KEY, etc.
