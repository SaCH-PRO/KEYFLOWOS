services:
  - type: web
    name: keyflowos
    runtime: node
    region: ohio
    plan: standard
    branch: main
    # The build actually has to build. This previously ran `pnpm install` only,
    # which is why the start command had to use tsx — there was no compiled
    # output to run. tsx cannot start this server (it does not emit
    # design:paramtypes, so NestJS dependency injection fails), so the deploy
    # was broken either way.
    #
    # Order matters: workspace packages first (the server imports @keyflow/db,
    # @keyflow/shared and @keyflow/api by their built entrypoints), then the
    # Prisma client, then the apps.
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @keyflow/shared --filter @keyflow/db --filter @keyflow/api build &&
      pnpm --filter @keyflow/db run db:generate &&
      pnpm --filter server build &&
      pnpm --filter web build
    startCommand: bash scripts/start-prod.sh
    healthCheckPath: /auth/login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_PORT
        value: "3001"
      - key: WEB_PORT
        value: "10000"
      # Secrets must be added manually in the Render dashboard from your .env file:
      # DATABASE_URL, DIRECT_URL, REDIS_URL, SUPABASE_URL, SUPABASE_ANON_KEY,
      # SUPABASE_JWT_SECRET, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY,
      # S3_BUCKET, S3_REGION, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
      # S3_PUBLIC_URL, S3_FORCE_PATH_STYLE, PRIVATE_OBJECT_DIR,
      # PUBLIC_OBJECT_SEARCH_PATHS, OPENAI_API_KEY, STRIPE_SECRET_KEY, etc.
