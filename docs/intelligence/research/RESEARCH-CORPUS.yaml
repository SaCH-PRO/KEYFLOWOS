sources:
  - id: BOOK-WEINBERG-PSYCHOLOGY-COMPUTER-PROGRAMMING
    title: The Psychology of Computer Programming
    author: Gerald M. Weinberg
    first_published: 1971
    preferred_edition: Silver Anniversary Edition
    lens: social_and_organizational_cognition
    status: REPO_PRESSURE_TESTED
    primary_questions:
      - How do programmers and teams produce software reality?
      - How do ego, communication, environment, tools and feedback affect quality?
      - How should multi-agent development avoid private competing truths?

  - id: BOOK-HERMANS-PROGRAMMERS-BRAIN
    title: The Programmer's Brain
    author: Felienne Hermans
    published: 2021
    lens: individual_cognition
    status: QUEUED
    primary_questions:
      - How do working memory, long-term memory and cognitive load affect code comprehension?
      - How should KEY distinguish missing knowledge, retrieval failure, overload and reasoning failure?
      - How should context be chunked and presented to agents?

  - id: BOOK-MARTIN-CLEAN-CODE
    title: Clean Code
    author: Robert C. Martin
    published: 2008
    lens: local_code_design
    status: QUEUED
    caution: Treat prescriptions as hypotheses; classify empirical support and context dependence.

