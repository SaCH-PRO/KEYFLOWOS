    fail-open defect and is not an acceptable rollback target.
  emergency_behavior: >
    If this correction itself creates an operational regression, prefer an
    existing hold/disable path for the action-capable Cortex execution surface
    and then roll forward. A code revert is acceptable only if it does not
    restore executable-on-authority-error semantics.

