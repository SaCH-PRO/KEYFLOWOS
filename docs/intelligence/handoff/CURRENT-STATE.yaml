confirmed_dynamic_breaks:
  - ContractAlert delete/recreate can erase acknowledgement disposition.
  - Contract hard delete emits no obligation settlement and can leave independently persisted renewal work orphaned.
  - Contract-owned version/alert descendants cascade on hard delete, strengthening the revision-history defect.
  - The renewal five-tuple correctly dedupes repeat emissions for one occurrence but cannot distinguish a later renewal cycle; a terminal CommandItem can therefore suppress a genuinely new occurrence.

positive_seams:
  - ObligationListener upsert preserves disposition while refreshing facts.
  - Contract status update has explicit WORK_OBLIGATION_SETTLED path for ACTIVE EXPIRED TERMINATED ARCHIVED.
  - Repeated sweep emission is safe under the obligation five-tuple for the same occurrence.

