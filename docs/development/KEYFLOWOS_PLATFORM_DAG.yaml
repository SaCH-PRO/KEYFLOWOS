# KEYFLOWOS platform/workflow convergence programme -- dependency graph
#
# Narrative:  docs/development/KEYFLOWOS_PLATFORM_CONVERGENCE_PROGRAMME.md
# Roles:      docs/development/KEYFLOWOS_AUTONOMOUS_AGENT_ROLES.md
#
# INACTIVE SUCCESSOR. This file never activates anything. Programme state is
# decided only by the activation contract below, evaluated against issue #80.
#
# Format: the same schema and YAML subset as KEYFLOWOS_PROGRAMME_DAG.yaml, so
# the repository's own tooling parses and validates it:
#   scripts/agent-control/lib/yaml.mjs      parseYaml (no flow mappings, no anchors)
#   scripts/agent-control/lib/dag.mjs       buildDag / validateDag / proveDrainable
#   scripts/agent-control/lib/platform-dag.mjs
#                                           gate and activation contract checks
# Proof: node scripts/agent-control/validate-platform-dag.mjs
#        node --test scripts/agent-control/tests/platform-dag.spec.mjs
#
# A phase group (P0..P11) is a "wave" in dag.mjs terms. Every packet names its
# own depends_on edges; phase membership alone never orders anything.

version: 2
programme: KEYFLOWOS_PLATFORM_CONVERGENCE
status: INACTIVE_SUCCESSOR
packets_total: 63
phases_total: 63

activation:
  state: INACTIVE_SUCCESSOR
  authority_channel: github_issue_80
  # Only a message matching this block moves the programme to ACTIVE.
  activate:
    message_type: DIRECTIVE
    sender_exact: chatgpt
    author_allowlist: [SaCH-PRO]
    required_fields:
      programme: KEYFLOWOS_PLATFORM_CONVERGENCE
      programme_action: ACTIVATE
  # A newer message matching this block returns the programme to HELD.
  hold:
    message_types: [DIRECTIVE, HOLD]
    sender_exact: chatgpt
    author_allowlist: [SaCH-PRO]
    required_fields:
      programme: KEYFLOWOS_PLATFORM_CONVERGENCE
      programme_action: HOLD
  # Envelope every #80 message must carry (issue #80 body). A message naming
  # this programme without all of it cannot activate; it holds.
  required_envelope:
    - message_id
    - packet_id
    - sender
    - source_main|source_head
    - implementation_branch
    - state
    - health
    - scope_changed
    - production_touched
  evaluation:
    # Of all valid authority messages on #80 whose programme field equals this
    # programme, the newest (created_at, then comment id) decides the state.
    # These outcomes are fixed in lib/platform-dag.mjs, which also refuses to
    # evaluate a contract that fails validation; the values here must match.
    decided_by: newest_valid_authority_message_naming_this_programme
    invalid_contract: INACTIVE_SUCCESSOR
    malformed_envelope: HELD
    no_matching_message: INACTIVE_SUCCESSOR
    unrecognized_programme_action: HELD
    authority_unverifiable: INACTIVE_SUCCESSOR
    # ACTIVE is necessary, never sufficient: any packet advance still passes
    # reconcile.mjs, where ANY newer authority message makes state stale.
    advancement_still_requires_reconcile: true
  never_activated_by:
    - file_presence_or_merge_of_this_file
    - prose_or_objective_text
    - message_id_or_packet_id_pattern
    - REVIEW_or_RESUME_message_type
    - AUTO_EVENT_or_derived_programme_state
    - any_sender_other_than_chatgpt_or_author_outside_allowlist
  activation_releases_no_other_hold: true
  current_application_programme_remains_authoritative_until_activation: true

roles:
  architecture_authority: chatgpt
  primary_builder: claude-code
  continuous_reviewer: github-copilot
  deterministic_proof: github-actions
  durable_truth: github
  optional_secondary_prover: kimi-code

copilot:
  required_for_semantic_prs: true
  review_on_semantic_push: true
  exact_head_disposition_required: true
  allowed_dispositions: [RESOLVED, REJECTED_WITH_EVIDENCE]
  per_finding_id_and_evidence_required: true
  summary_counts_are_derived_only: true
  unresolved_substantive_findings_block_return: true
  architecture_authority: false

human_gates:
  # Every effect the active safety policy forbids automation from performing is
  # inherited unchanged. This programme may add gates, never remove one.
  inherits_never_automatic_from: docs/development/AGENT_AUTOPILOT_POLICY.yaml
  inherited_never_automatic:
    - architecture_precedence_decision
    - scope_widening
    - production_deployment
    - production_data_mutation
    - real_provider_traffic
    - forensic_rebaseline
    - programme_map_refresh
    - architecture_os_cycle_resume
    - gate_weakening
    - proof_obligation_reduction
    - contradiction_resolution_without_recorded_authority
    - schema_primitive_choice
    - migration_strategy
    - agent_self_approval
  # Packet annotations below are non-exhaustive hints. Every gate here applies
  # to every packet whenever its effect would occur.
  applies_to_every_packet: true
  gates:
    - id: production_deployment_or_release
      effect: triggering, promoting or releasing any production deployment
      inherits: [production_deployment]
    - id: production_mutation
      effect: >
        any change to production runtime, configuration, infrastructure or
        state that no separately admitted, reversible operational runbook covers
      inherits: [production_deployment, production_data_mutation]
    - id: production_data_mutation
      effect: any write to production application data
      inherits: [production_data_mutation]
    - id: production_dns_or_domain_cutover
      effect: changing production DNS records or the canonical domain target
      inherits: [production_deployment]
    - id: destructive_production_data_or_schema_action
      effect: deleting, truncating, dropping or irreversibly migrating production data or schema
      inherits: [production_data_mutation, migration_strategy]
    - id: paid_resource_creation
      effect: creating or upgrading any resource that incurs cost
      inherits: []
    - id: secret_or_oauth_entry_without_safe_connected_writer
      effect: >
        entering, rotating or connecting a secret or OAuth credential where no
        already-authorized connected writer can do it without exposing the value
      inherits: []
    - id: unauthorized_real_provider_traffic
      effect: sending traffic to a real external provider that is not already authorized
      inherits: [real_provider_traffic]
    - id: major_architecture_override
      effect: overriding an admitted architectural boundary or canonical truth owner
      inherits: [architecture_precedence_decision, schema_primitive_choice]
    - id: weakening_security_tenancy_branch_ci_proof_review_or_admission_gate
      effect: lowering, bypassing or removing any security, tenancy, branch, CI, proof, review or admission gate
      inherits: [gate_weakening, proof_obligation_reduction]

selection_policy:
  wave_order: [P0, P1, P2, P3, P4, P5, P6, P7, P8, P9, P10, P11]
  # Lowest ready phase is preferred, not required: a packet whose own
  # depends_on edges are complete may start before an unrelated earlier phase.
  do_not_leapfrog_wave_gate: false
  re_resolve_main_before_every_packet: true
  no_parallel_semantic_conflicts: true
  ready_packet_requires_all_packet_dependencies_complete: true
  production_effects_require_matching_human_gate: true
  file_presence_never_activates_successor: true

phase_groups:
  P0: autonomous_programme_activation
  P1: canonical_frontend_runtime
  P2: supabase_and_data_plane
  P3: isolated_staging
  P4: immutable_backend_delivery
  P5: data_resilience
  P6: observability
  P7: github_ci_security
  P8: configuration_and_secrets
  P9: multi_agent_scale
  P10: infrastructure_as_code
  P11: final_qualification

