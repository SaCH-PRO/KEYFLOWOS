version: 1
programme: KEYFLOWOS_PLATFORM_CONVERGENCE
status: INACTIVE_SUCCESSOR
activation:
  authority_channel: github_issue_80
  requires_explicit_chatgpt_authority: true
  must_not_override_active_hold: true
  current_application_programme_remains_authoritative_until_activation: true

roles:
  architecture_authority: chatgpt
  primary_builder: claude-code
  continuous_reviewer: github-copilot
  deterministic_proof: github-actions
  durable_truth: github
  optional_secondary_prover: kimi-code

copilot:
  required_for_semantic_prs: true
  review_on_semantic_push: true
  exact_head_disposition_required: true
  allowed_dispositions: [RESOLVED, REJECTED_WITH_EVIDENCE]
  unresolved_substantive_findings_block_return: true
  architecture_authority: false

human_gates:
  - production_dns_or_domain_cutover
  - destructive_production_data_or_schema_action
  - paid_resource_creation
  - secret_or_oauth_entry_without_safe_connected_writer
  - unauthorized_real_provider_traffic
  - major_architecture_override
  - weakening_security_tenancy_branch_or_proof_gate

phases:
  - id: P0
    name: autonomous_programme_activation
    packets: [KF-PLAT-AUTO-001, KF-PLAT-AUTO-002, KF-PLAT-AUTO-003]
  - id: P1
    name: canonical_frontend_runtime
    depends_on: [P0]
    packets: [KF-INFRA-001, KF-INFRA-002, KF-INFRA-003, KF-INFRA-004, KF-INFRA-005]
  - id: P2
    name: supabase_and_data_plane
    depends_on: [P1]
    packets: [KF-DATA-001, KF-DATA-002, KF-DATA-003, KF-DATA-004, KF-DATA-005]
  - id: P3
    name: isolated_staging
    depends_on: [P1, P2]
    packets: [KF-STAGE-001, KF-STAGE-002, KF-STAGE-003, KF-STAGE-004, KF-STAGE-005, KF-STAGE-006]
  - id: P4
    name: immutable_backend_delivery
    depends_on: [P3]
    packets: [KF-DEPLOY-001, KF-DEPLOY-002, KF-DEPLOY-003, KF-DEPLOY-004, KF-DEPLOY-005, KF-DEPLOY-006]
  - id: P5
    name: data_resilience
    depends_on: [P4]
    packets: [KF-RESILIENCE-001, KF-RESILIENCE-002, KF-RESILIENCE-003, KF-RESILIENCE-004, KF-RESILIENCE-005]
  - id: P6
    name: observability
    depends_on: [P4]
    packets: [KF-OBS-001, KF-OBS-002, KF-OBS-003, KF-OBS-004, KF-OBS-005, KF-OBS-006]
  - id: P7
    name: github_ci_security
    depends_on: [P0]
    packets: [KF-GOV-001, KF-GOV-002, KF-GOV-003, KF-CI-001, KF-CI-002, KF-SEC-001, KF-SEC-002, KF-SEC-003]
  - id: P8
    name: configuration_and_secrets
    depends_on: [P3, P4, P7]
    packets: [KF-CONFIG-001, KF-CONFIG-002, KF-CONFIG-003, KF-CONFIG-004, KF-CONFIG-005]
  - id: P9
    name: multi_agent_scale
    depends_on: [P0, P7]
    packets: [KF-AGENT-001, KF-AGENT-002, KF-AGENT-003, KF-AGENT-004, KF-AGENT-005, KF-AGENT-006, KF-AGENT-007]
  - id: P10
    name: infrastructure_as_code
    depends_on: [P4, P5, P8]
    packets: [KF-IAC-001, KF-IAC-002, KF-IAC-003, KF-IAC-004]
  - id: P11
    name: final_qualification
    depends_on: [P2, P3, P4, P5, P6, P7, P8, P9, P10]
    packets: [KF-QUAL-001, KF-QUAL-002, KF-QUAL-003]

selection:
  re_resolve_main_before_every_packet: true
  no_parallel_semantic_conflicts: true
  prefer_lowest_ready_phase: true
  packet_completion_required_before_dependents: true
  production_effects_require_human_gate: true
