#
# ---------------------------------------------------------------------------
# Phase model (resolves the wave-gate deadlock, F2)
# ---------------------------------------------------------------------------
# The canonical board declares two packets that deliberately SPAN waves:
#
#   PLAYBOOK-001  "span: B -> D; foundation starts here, product/library
#                  convergence finishes in Wave D"
#   GROWTH-001    "span: C -> D; foundation can begin in C, closed-loop/product
#                  optimization completes only after Wave D dependencies exist"
#
# and names the later dependency set under "Cross-wave completions":
#
#   "GROWTH-001 closed-loop optimization after PUBLIC/SPACE/PLAYBOOK/CONNECTOR
#    dependencies"
#
# A single-node model must therefore place GROWTH-001 in wave C while it
# depends on wave-D packets, which deadlocks any selector that honours
# do_not_leapfrog_wave_gate. The board is NOT ambiguous about this -- it states
# the span and enumerates the late dependencies -- so the faithful executable
# model is one node per declared phase, each with its own wave and its own
# dependency subset. No product dependency has been invented, removed, or
# reordered; the union of a packet's phase dependencies equals the board's
# packet dependency list.
#
# Reference resolution:
#   - "KF-EXEC-X-001"          -> that packet's TERMINAL phase (strictest reading)
#   - "KF-EXEC-X-001#phase"    -> that exact phase
# Terminal is the default because a dependant naming a packet plainly means the
# packet, and the stricter reading can only delay work, never leapfrog it. The
# validator proves this choice introduces no backward wave edge.
